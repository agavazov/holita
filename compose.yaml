name: discocan

services:
  postgres:
    image: postgres:18.6-bookworm
    # The ERM gateway stores every truck report here; come back after Docker or host restarts.
    restart: unless-stopped
    environment:
      POSTGRES_USER: discocan_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discocan_admin_local}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-11084}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U discocan_admin -d postgres']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-discocan_postgres_data}
