name: holita

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: holita_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-holita_admin_local}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-11084}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U holita_admin -d postgres']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
