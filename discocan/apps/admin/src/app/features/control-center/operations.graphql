fragment AdminControlCenterEventFields on FleetDeviceEvent {
  id
  code
  recordedAt
  positionAt
  latitude
  longitude
  speedKph
  headingDeg
  odometerKm
  engineOn
  externalVoltage
  backupBatteryVoltage
  category
  severity
  name(language: $language)
}
fragment AdminControlCenterStateFields on FleetDeviceState {
  imei
  connected
  connectedSince
  lastReportAt
  alarmsLast24h
  latestPosition {
    ...AdminControlCenterEventFields
  }
  latestEvent {
    ...AdminControlCenterEventFields
  }
  latestAlarm {
    ...AdminControlCenterEventFields
  }
  health {
    lastReportAgeSeconds
    expectedIntervalSeconds
    overdue
  }
}
query AdminControlCenterDevice($id: ID!, $language: FleetDeviceLanguage!) {
  fleetDevice(id: $id) {
    ...AdminFleetLiveDevice
    id
    imei
    model
    serialNumber
    firmwareVersion
    ...AdminErmDeviceMetadata
    simPhoneNumber
    simIccid
    installedAt
    notes
    options
    ...AdminErmRouting
    currentWarnings {
      ...AdminWarningLamp
    }
    warningLamps {
      ...AdminWarningLamp
    }
    vehicle {
      id
      licensePlate
    }
    state {
      ...AdminControlCenterStateFields
      ...AdminErmSessionEvidence
      externalVoltage {
        value
        observedAt
      }
      backupBatteryVoltage {
        value
        observedAt
      }
      signalQuality {
        value
        observedAt
      }
      firmwareVersion {
        value
        observedAt
      }
      measurements {
        parameterId
        name
        unit
        parameterType
        valueSize
        valueHex
        observedAt
      }
      health {
        gapsLast24h {
          from
          to
          durationSeconds
          expectedIntervalSeconds
        }
        networkChangesLast24h
        latestNetworkChange {
          at
          networkType
          operatorCode
        }
        lastCloseReason
        lastClosedAt
      }
    }
  }
}
query AdminControlCenterEvents(
  $id: ID!
  $language: FleetDeviceLanguage!
  $input: FleetDeviceEventsInput
) {
  fleetDevice(id: $id) {
    id
    events(input: $input) {
      total
      offset
      limit
      cursor
      nextCursor
      hasMore
      items {
        ...AdminControlCenterEventFields
        ...AdminErmEventEvidence
      }
    }
  }
}
query AdminControlCenterFrames($id: ID!, $input: FleetDeviceMessagesInput) {
  fleetDevice(id: $id) {
    id
    messages(input: $input) {
      total
      offset
      limit
      cursor
      nextCursor
      hasMore
      items {
        id
        direction
        receivedAt
        ...AdminErmMessageEvidence
        partial
        displayText
        payloadHex
        acknowledgement {
          commandId
          commandRequestId
          ...AdminErmAcknowledgementEvidence
          resultCode
          receivedAt
        }
      }
    }
  }
}
fragment AdminControlCenterSnapshotFields on FleetDeviceParameterSnapshot {
  id
  imei
  actorId
  intent
  status
  startedAt
  finishedAt
  parameterCount
  unreadParameterIds
  readCount
  failureReason
}
query AdminControlCenterSnapshots($id: ID!, $input: FleetDeviceParameterSnapshotsInput) {
  fleetDevice(id: $id) {
    id
    parameterSnapshots(input: $input) {
      total
      offset
      limit
      cursor
      nextCursor
      hasMore
      items {
        ...AdminControlCenterSnapshotFields
        values {
          parameterId
          title
          value
          outcome
          ...AdminErmSnapshotValueEvidence
        }
        changes {
          parameterId
          title
          previousValue
          value
        }
      }
    }
  }
}
mutation AdminControlCenterStartSnapshot($input: StartDeviceParameterSnapshotInput!) {
  startDeviceParameterSnapshot(input: $input) {
    ...AdminControlCenterSnapshotFields
  }
}
mutation AdminControlCenterSendCommand($input: SendDeviceCommandInput!) {
  sendDeviceCommand(input: $input) {
    ...AdminControlCenterCommandRequestFields
  }
}

fragment AdminControlCenterConfigurationChangeFields on FleetDeviceConfigurationChange {
  id
  imei
  actorId
  intent
  operation
  parameterIds
  measurementParameterId
  batchId
  batchIndex
  status
  startedAt
  finishedAt
  failureReason
  ...AdminErmConfigurationEvidence
}
query AdminControlCenterConfigurationChanges($id: ID!) {
  fleetDevice(id: $id) {
    id
    configurationWritesEnabled
    configurationChanges {
      ...AdminControlCenterConfigurationChangeFields
    }
  }
}
mutation AdminControlCenterStartEdataChange(
  $input: StartDeviceMeasurementConfigurationChangeInput!
) {
  startDeviceMeasurementConfigurationChange(input: $input) {
    ...AdminControlCenterConfigurationChangeFields
  }
}
mutation AdminControlCenterStartParameterChange($input: StartDeviceParameterChangeInput!) {
  startDeviceParameterChange(input: $input) {
    ...AdminControlCenterConfigurationChangeFields
  }
}

fragment AdminControlCenterCommandRequestFields on FleetDeviceCommandRequest {
  id
  deviceId
  deviceType
  imei
  actorId
  cancelledByActorId
  waitingReason
  waitingSince
  batchId
  batchIndex
  retryOfId
  intent
  action
  parameters
  parameterValues {
    parameter
    title
    value
    outcome
  }
  actionCode
  displayParameters {
    expiresInSeconds
    requestedFields
  }
  requestedAt
  queuedAt
  submittingAt
  sentAt
  answeredAt
  failedAt
  expiredAt
  cancelledAt
  uncertainAt
  outcomeCode
  reasonCode
  transportCommand {
    id
    imei
    connectionId
    ...AdminErmTransportEvidence
    status
    sentAt
    answeredAt
    resultCode
    responseText
    acknowledgement {
      commandId
      ...AdminErmAcknowledgementEvidence
      resultCode
      receivedAt
    }
  }
  ...AdminErmRequestEvidence
  status
  createdAt
  expiresAt
  submittedAt
  completedAt
  commandId
  resultCode
  responseText
  failureReason
}
query AdminControlCenterCommandRequests($id: ID!) {
  fleetDevice(id: $id) {
    id
    commandRequests {
      ...AdminControlCenterCommandRequestFields
    }
  }
}
mutation AdminControlCenterCancelCommand($input: CancelDeviceCommandInput!) {
  cancelDeviceCommand(input: $input) {
    ...AdminControlCenterCommandRequestFields
  }
}

query AdminControlCenterCommandRequest($id: ID!) {
  fleetDeviceCommandRequest(id: $id) {
    ...AdminControlCenterCommandRequestFields
  }
}
query AdminControlCenterDeviceProblems(
  $id: ID!
  $offset: Int! = 0
  $limit: Int! = 20
  $severities: [FleetEventSeverity!]
  $states: [FleetProblemState!]
  $sort: FleetProblemSort
) {
  fleetProblems(
    offset: $offset
    limit: $limit
    filter: { deviceIds: [$id], severities: $severities, states: $states }
    sort: $sort
  ) {
    total
    offset
    limit
    counts {
      asOf
      dataAsOf
      liveAsOf
      periodFrom
      periodTo
      total
      requiringAttention
      recorded
    }
    items {
      id
      sourceKind
      sourceId
      severity
      occurredAt
      state
      requiringAttention
      code
      details
      diagnostics {
        ...AdminFaultDiagnostic
      }
      deviceId
      deviceImei
      vehicleId
      alertId
      sourceEventId
      commandRequestId
    }
  }
}

query AdminControlCenterBranchCommandRequests(
  $offset: Int! = 0
  $limit: Int! = 20
  $filter: FleetDeviceCommandRequestsFilter
  $sort: FleetDeviceCommandRequestsSort
) {
  fleetDeviceCommandRequests(offset: $offset, limit: $limit, filter: $filter, sort: $sort) {
    total
    offset
    limit
    items {
      ...AdminControlCenterCommandRequestFields
    }
  }
}
mutation AdminControlCenterRetryCommand($input: RetryDeviceCommandInput!) {
  retryDeviceCommand(input: $input) {
    ...AdminControlCenterCommandRequestFields
  }
}
fragment AdminControlCenterCommandBatchFields on FleetDeviceCommandBatch {
  id
  actorId
  action
  createdAt
  stoppedAt
  stoppedByActorId
  counts {
    status
    count
  }
  requests {
    ...AdminControlCenterCommandRequestFields
  }
}
query AdminControlCenterCommandBatch($id: ID!) {
  fleetDeviceCommandBatch(id: $id) {
    ...AdminControlCenterCommandBatchFields
  }
}
mutation AdminControlCenterStartCommandBatch($input: StartDeviceCommandBatchInput!) {
  startDeviceCommandBatch(input: $input) {
    ...AdminControlCenterCommandBatchFields
  }
}
mutation AdminControlCenterStopCommandBatch($id: ID!) {
  stopDeviceCommandBatch(id: $id) {
    ...AdminControlCenterCommandBatchFields
  }
}
query AdminControlCenterParameterBaseline($id: ID!) {
  fleetDevice(id: $id) {
    id
    parameterSnapshots(input: { pageSize: 25 }) {
      items {
        id
        startedAt
        status
        unreadParameterIds
        values {
          parameterId
          title
          value
          outcome
        }
      }
    }
  }
}
query AdminControlCenterSettingsDevices($offset: Int! = 0) {
  fleetDevices(
    offset: $offset
    limit: 100
    sort: { field: VEHICLE_LICENSE_PLATE, direction: ASC }
  ) {
    total
    offset
    limit
    items {
      id
      imei
      type
      vehicle {
        id
        licensePlate
      }
      state {
        connected
        ...AdminErmSessionMode
      }
    }
  }
}
fragment AdminControlCenterConfigurationBatchFields on FleetDeviceConfigurationBatch {
  id
  actorId
  createdAt
  finishedAt
  stoppedAt
  stoppedByActorId
  changes {
    ...AdminControlCenterConfigurationChangeFields
  }
}
query AdminControlCenterConfigurationBatch($id: ID!) {
  fleetDeviceConfigurationBatch(id: $id) {
    ...AdminControlCenterConfigurationBatchFields
  }
}
mutation AdminControlCenterStartParametersChange($input: StartDeviceParametersChangeInput!) {
  startDeviceParametersChange(input: $input) {
    ...AdminControlCenterConfigurationChangeFields
  }
}
mutation AdminControlCenterStartParameterBatch($input: StartDeviceConfigurationBatchInput!) {
  startDeviceConfigurationBatch(input: $input) {
    ...AdminControlCenterConfigurationBatchFields
  }
}
mutation AdminControlCenterStopConfigurationBatch($id: ID!) {
  stopDeviceConfigurationBatch(id: $id) {
    ...AdminControlCenterConfigurationBatchFields
  }
}

query AdminControlCenterQueueDeviceLabels($ids: [ID!]!) {
  fleetDevices(ids: $ids, limit: 100) {
    items {
      id
      imei
      vehicle {
        id
        licensePlate
      }
    }
  }
}
query AdminControlCenterParameterCatalog(
  $deviceType: FleetDeviceType!
  $input: FleetDeviceParameterCatalogInput
) {
  fleetDeviceParameterCatalog(deviceType: $deviceType, input: $input) {
    total
    offset
    limit
    ...AdminErmCatalogFeatures
    items {
      parameterId
      title
      summary
      defaultValue
      ...AdminErmParameterDefinition
      writable
      options {
        value
        label
      }
    }
  }
}
query AdminControlCenterEdataProfiles {
  fleetEdataProfiles {
    id
    name
    categoryId
    categoryName
    parameterCount
  }
}
query AdminControlCenterEdataParameters($input: FleetEdataParametersInput!) {
  fleetEdataParameters(input: $input) {
    total
    offset
    limit
    catalogLabel
    items {
      parameterId
      hex
      name
      category
      multiply
      offset
    }
  }
}
query AdminControlCenterActionCommands($deviceType: FleetDeviceType!) {
  fleetDeviceActionCatalog(deviceType: $deviceType) {
    action
    requiresParameters
    ...AdminErmActionCommand
  }
}
