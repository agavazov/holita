query AdminFaultMonitor {
  fleetFaultMonitor {
    vehicle {
      id
      licensePlate
    }
    devices {
      id
      lastReportedAt
      state {
        connected
        lastReportAt
      }
    }
    faultCheck {
      ...AdminFaultCheck
    }
    canDataAt
    canLostAt
  }
}

query AdminFaultLog($offset: Int!, $limit: Int!, $filter: FleetFaultLogFilter) {
  fleetFaultLog(offset: $offset, limit: $limit, filter: $filter) {
    total
    offset
    limit
    items {
      id
      kind
      occurredAt
      vehicle {
        id
        licensePlate
      }
      deviceImei
      troubleCode
      spn
      fmi
      descriptionKey
      parameterId
      lampState
      activeCodes
      codeCount
      valueCount
    }
  }
}
