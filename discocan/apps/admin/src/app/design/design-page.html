<ng-container #designHost />
<ng-template #fleetSection>
  <h3>Fleet live cells</h3>
  <div class="app-card-grid">
    <discocan-fleet-connection [device]="null" /><discocan-fleet-last-report
      [device]="null"
    /><discocan-fleet-now [device]="null" /><discocan-fleet-faults [device]="null" />
  </div>
  <discocan-fleet-live-summary [devices]="[]" /><discocan-fleet-current-warnings
    [warnings]="[]"
    [language]="language()"
  /><discocan-fleet-fault-coverage [lamps]="[]" [language]="language()" /><discocan-fault-scanner
    [check]="null"
    [language]="language()"
    [now]="0"
  />
</ng-template>
