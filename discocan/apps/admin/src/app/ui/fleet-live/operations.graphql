fragment AdminFleetLiveDevice on FleetDevice {
  id
  imei
  type
  vehicleId
  status
  ...AdminErmLiveRouting
  lastReportedAt
  currentWarnings {
    ...AdminWarningLamp
  }
  warningLamps {
    ...AdminWarningLamp
  }
  diagnostics {
    count
    latest {
      kind
      occurredAt
      troubleCode
      details
      source
    }
  }
  state {
    connected
    connectedSince
    lastReportAt
    latestEvent {
      recordedAt
      speedKph
      engineOn
      ignition
      nameEn: name(language: EN)
      nameBg: name(language: BG)
    }
    latestAlarm {
      recordedAt
      severity
      nameEn: name(language: EN)
      nameBg: name(language: BG)
    }
    alarmsLast24h
    health {
      overdue
      lastReportAgeSeconds
      expectedIntervalSeconds
      lastCloseReason
    }
  }
}

fragment AdminWarningLamp on FleetWarningLamp {
  deviceId
  parameterId
  state
  recordedAt
  stateSince
}

fragment AdminFaultDiagnostic on FleetProblemDiagnostic {
  kind
  troubleCode
  status
  report
  spn
  fmi
  systemKey
  descriptionKey
  catalogVersion
  firstObservedAt
  lastObservedAt
  occurredAt
  receivedAt
}

fragment AdminFaultCheck on FleetFaultCheck {
  checkedAt
  dataAsOf
  findings {
    system
    severity
    source
    code
    spn
    fmi
    descriptionKey
    parameterId
    lampState
    value
    since
    lastSeenAt
    occurrences
  }
}

fragment AdminFreezeFrame on FleetFreezeFrame {
  recordedAt
  values {
    parameterId
    name
    unit
    valueHex
    value
  }
}

fragment AdminFaultRead on FleetDeviceCommandRequest {
  id
  action
  status
  actorId
  createdAt
  sentAt
  answeredAt
  completedAt
  expiresAt
  waitingReason
  faultReadVerdict {
    activeCodes
    codeCount
    receivedAt
  }
}

query AdminDeviceFaultReads($id: ID!) {
  fleetDevice(id: $id) {
    commandRequests {
      ...AdminFaultRead
    }
  }
}

mutation AdminReadFaultsNow($deviceId: ID!) {
  sendDeviceCommand(
    input: {
      deviceId: $deviceId
      action: READ_FAULTS
      expiresInSeconds: 900
      intent: "Fault scanner: read faults now"
    }
  ) {
    ...AdminFaultRead
  }
}
