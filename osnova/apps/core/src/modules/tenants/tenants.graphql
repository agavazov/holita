type Tenant {
  id: ID!
  name: String!
  status: AccountStatus!
}

type DemoSession {
  token: String!
  tenant: Tenant!
}

type Mutation {
  demoLogin(tenantId: ID!): DemoSession!
}

extend type Query {
  tenants: [Tenant!]!
}

"ISO-8601 instant with an offset; serialized in UTC with milliseconds."
scalar DateTime

enum AccountStatus {
  ACTIVE
  SUSPENDED
}

enum UserRole {
  SALES
  VIEWER
  OPERATOR
  ENGINEER
  ADMINISTRATOR
}

type User {
  id: ID!
  tenant: Tenant!
  name: String!
  email: String!
  active: Boolean!
  role: UserRole!
  lastSignInAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SignInPayload {
  token: String!
  user: User!
  tenant: Tenant!
  expiresAt: DateTime!
}

extend type Query {
  me: User!
  users: [User!]!
}

extend type Mutation {
  signIn(email: String!, password: String!): SignInPayload!
  signOut: Boolean!
  updateProfile(name: String!, email: String!): User!
  changePassword(currentPassword: String!, newPassword: String!): Boolean!
  createUser(name: String!, email: String!, password: String!, role: UserRole): User!
  updateUser(id: ID!, name: String!, email: String!, role: UserRole): User!
  deactivateUser(id: ID!): User!
  reactivateUser(id: ID!): User!
}

type MerchantBranch {
  id: ID!
  name: String!
  status: AccountStatus!
}

type Merchant {
  id: ID!
  name: String!
  status: AccountStatus!
  branchCount: Int!
  branches: [MerchantBranch!]!
}

extend type Query {
  merchants: [Merchant!]!
}

extend type Mutation {
  createMerchant(
    name: String!
    adminName: String!
    adminEmail: String!
    initialPassword: String!
  ): Merchant!
  createMerchantBranch(tenantId: ID!, name: String!): MerchantBranch!
  setMerchantStatus(tenantId: ID!, status: AccountStatus!): Merchant!
  setMerchantBranchStatus(tenantId: ID!, branchId: ID!, status: AccountStatus!): MerchantBranch!
}
