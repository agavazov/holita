type KarmaTrip {
  id: ID!
  carId: ID!
  carNumber: String!
  deviceId: String!
  driverId: ID
  tripActive: Float
  startMessageId: ID
  startDate: String
  startLatitude: Float
  startLongitude: Float
  startOdo: Float
  stopMessageId: ID
  stopDate: String
  stopLatitude: Float
  stopLongitude: Float
  stopOdo: Float
  tripDuration: Float
  tripDistance: Float
  tripDurationNight: Float
  tripDistanceNight: Float
  maxSpeed: Float
  drivingScore: Float
  ecoScore: Float
}
type KarmaEvent {
  id: ID!
  carId: ID!
  deviceId: String!
  eventId: ID!
  edt: String
  edtTz: String
  pdt: String
  latitude: Float
  longitude: Float
  spd: Float
  odo: Float
  extra: String
}
input KarmaTripsInput {
  carId: ID!
  pageSize: Int = 50
  cursor: String
  fromDate: String
  toDate: String
}
input KarmaEventsInput {
  carId: ID!
  pageSize: Int = 50
  cursor: String
  fromDate: String
  toDate: String
  eventTypes: [ID!]
}
type KarmaTripsPage {
  items: [KarmaTrip!]!
  cursor: String
  nextCursor: String
  hasMore: Boolean!
}
type KarmaEventsPage {
  items: [KarmaEvent!]!
  cursor: String
  nextCursor: String
  hasMore: Boolean!
}
input KarmaDrivingProfileInput {
  carId: ID!
  fromDate: String!
  toDate: String!
}
type KarmaDrivingCategory {
  name: String!
  score: Float
  weight: Float
}
type KarmaDrivingProfile {
  carId: ID!
  carNumber: String!
  deviceId: String!
  categories: [KarmaDrivingCategory!]!
}

input KarmaDailyReportInput {
  carId: ID!
  day: String
}
enum KarmaDailyReportState {
  COMPLETE
  PARTIAL
  EMPTY
  UNSUPPORTED_PERIOD
  UNAVAILABLE
}
enum KarmaDailyReportReason {
  NONE
  TIME_ZONE_NOT_PROVEN
  OPEN_DAY
  CAR_NOT_FOUND
  UPSTREAM_FAILURE
  PAGE_LIMIT
  ROW_LIMIT
  INCOMPATIBLE_SOURCE
  SOURCE_BOUNDARY_NOT_PROVEN
  OPEN_TRIPS
}
enum KarmaDailyReportRetrieval {
  NOT_STARTED
  COMPLETE
  PARTIAL
  UNAVAILABLE
}
enum KarmaDailyReportSelection {
  STARTED_IN_DAY
}
enum KarmaDailyReportPositionCoverage {
  NOT_ASSESSED
}
enum KarmaDailyReportMetricAvailability {
  COMPLETE
  PARTIAL
  UNAVAILABLE
}
enum KarmaDailyReportMetricUnit {
  COUNT
  SOURCE_DISTANCE_UNCONFIRMED
  SOURCE_SPEED_UNCONFIRMED
}
type KarmaDailyReportMetric {
  value: Float
  availability: KarmaDailyReportMetricAvailability!
  availableInputs: Int!
  requiredInputs: Int!
  unit: KarmaDailyReportMetricUnit!
}
type KarmaDailyReport {
  carId: ID!
  car: KarmaCar
  day: String
  timeZone: KarmaTimeZone
  fromLocal: String
  toLocalExclusive: String
  fromUtc: String
  toUtcExclusive: String
  selection: KarmaDailyReportSelection!
  retrieval: KarmaDailyReportRetrieval!
  state: KarmaDailyReportState!
  reason: KarmaDailyReportReason!
  pageRequests: Int!
  loadedTrips: Int!
  trips: [KarmaTrip!]!
  maxPages: Int!
  maxRows: Int!
  deadlineMs: Int!
  positionCoverage: KarmaDailyReportPositionCoverage!
  retrievedAt: String!
  tripCount: KarmaDailyReportMetric!
  totalDistance: KarmaDailyReportMetric!
  nightDistance: KarmaDailyReportMetric!
  dayDistance: KarmaDailyReportMetric!
  maxSpeed: KarmaDailyReportMetric!
}
input KarmaPositionSamplesInput {
  carId: ID!
  startMessageId: ID!
  stopMessageId: ID!
}
enum KarmaPositionSamplesRetrieval {
  NOT_STARTED
  COMPLETE
  PARTIAL
  UNAVAILABLE
}
enum KarmaPositionSamplesReason {
  NONE
  CAR_NOT_FOUND
  UPSTREAM_FAILURE
  INCOMPATIBLE_SOURCE
  ROW_LIMIT
  BOUNDARIES_MISSING
}
enum KarmaPositionSamplesSourceClock {
  EDT_UTC
}
enum KarmaPositionSamplesOrdering {
  UTC_THEN_MESSAGE_ID
  SOURCE_ORDER
}
type KarmaPositionSample {
  event: KarmaEvent!
  instantUtc: String
}
type KarmaPositionSamples {
  carId: ID!
  startMessageId: ID!
  stopMessageId: ID!
  samples: [KarmaPositionSample!]!
  retrieval: KarmaPositionSamplesRetrieval!
  reason: KarmaPositionSamplesReason!
  sourceClock: KarmaPositionSamplesSourceClock!
  ordering: KarmaPositionSamplesOrdering!
  positionCoverage: KarmaDailyReportPositionCoverage!
  startMessagePresent: Boolean!
  stopMessagePresent: Boolean!
  loadedRows: Int!
  maxRows: Int!
  deadlineMs: Int!
  duplicateIdsRemoved: Int!
  retrievedAt: String!
}
extend type Query {
  karmaTrips(input: KarmaTripsInput!): KarmaTripsPage!
  karmaEvents(input: KarmaEventsInput!): KarmaEventsPage!
  karmaDrivingProfile(input: KarmaDrivingProfileInput!): KarmaDrivingProfile
  karmaDailyReport(input: KarmaDailyReportInput!): KarmaDailyReport!
  karmaPositionSamples(input: KarmaPositionSamplesInput!): KarmaPositionSamples!
  karmaDiagnosticHistory(input: KarmaDiagnosticHistoryInput!): KarmaDiagnosticHistory!
}

input KarmaDiagnosticHistoryInput {
  carId: ID!
  pageSize: Int = 50
  cursor: String
  fromMessageId: ID
  toMessageId: ID
}
enum KarmaDiagnosticRetrieval {
  COMPLETE
  UNAVAILABLE
}
enum KarmaDiagnosticHistoryReason {
  NONE
  CAR_NOT_FOUND
  UPSTREAM_FAILURE
  INCOMPATIBLE_SOURCE
}
enum KarmaDiagnosticFamily {
  TRACKER_E2
  OBD_E70
  EDATA_411
  EDATA_413
  EDATA_417
  EDATA_418
  EDATA_419
  SPECIAL_ACK
  UNKNOWN
}
enum KarmaDiagnosticDecoding {
  DECODED
  OPAQUE
  MALFORMED
}
enum KarmaDiagnosticFaultStatus {
  ADDED
  REMOVED
  UNKNOWN
}
enum KarmaDiagnosticAcknowledgement {
  NACK
  POSITIVE_ACK
  UNKNOWN
}
type KarmaDiagnosticFault {
  code: String
  spn: Float
  fmi: Int
  statusHex: String!
  status: KarmaDiagnosticFaultStatus!
  rawHex: String!
}
type KarmaCommunicationDiagnostics {
  communicationMask: Int!
  obdMask: Int!
  canError: Int!
  ignition: Int!
  extensionHex: String!
}
type KarmaDiagnosticReport {
  event: KarmaEvent!
  instantUtc: String
  family: KarmaDiagnosticFamily!
  reportCode: String!
  decoding: KarmaDiagnosticDecoding!
  rawPayload: String!
  payloadHex: String
  faults: [KarmaDiagnosticFault!]!
  acknowledgement: KarmaDiagnosticAcknowledgement
  communication: KarmaCommunicationDiagnostics
}
type KarmaDiagnosticHistory {
  carId: ID!
  items: [KarmaDiagnosticReport!]!
  cursor: String
  nextCursor: String
  hasMore: Boolean!
  retrieval: KarmaDiagnosticRetrieval!
  reason: KarmaDiagnosticHistoryReason!
  historyComplete: Boolean!
  scannedRows: Int!
  maxRows: Int!
  deadlineMs: Int!
  retrievedAt: String!
}
