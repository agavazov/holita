enum FleetKarmaMonitoringEventKind {
  CAME_ONLINE
  NO_DATA_SINCE
  FAULT_REPORTED
  FAULT_READ_REQUESTED
  FAULT_READ_ANSWERED
  FAULT_READ_FAILED
  POLL_FAILED
}
enum FleetKarmaMonitoringSource {
  STATUS_POLL
  KARMA_HISTORY
  DEVICE_COMMAND
}
enum FleetKarmaMonitoringCommandOutcome {
  NOT_ACKNOWLEDGED
  EMPTY
  FAULTS
  UNRESOLVED
  FAILED
}

type FleetKarmaMonitoringSettings {
  enabled: Boolean!
  statusPollSeconds: Int!
  offlineAfterMinutes: Int!
  faultHistoryPollMinutes: Int!
  faultCommandEnabled: Boolean!
  faultCommandMinutes: Int!
  retentionDays: Int!
}
input UpdateFleetKarmaMonitoringSettingsInput {
  enabled: Boolean!
  "30–3600 seconds."
  statusPollSeconds: Int!
  "2–1440 minutes."
  offlineAfterMinutes: Int!
  "5–1440 minutes."
  faultHistoryPollMinutes: Int!
  faultCommandEnabled: Boolean!
  "15–1440 minutes."
  faultCommandMinutes: Int!
  "1–30 days."
  retentionDays: Int!
}
type FleetKarmaMonitoringEvent {
  id: ID!
  karmaCarId: ID
  kind: FleetKarmaMonitoringEventKind!
  source: FleetKarmaMonitoringSource!
  occurredAt: DateTime!
  recordedAt: DateTime!
  code: String
  spn: Float
  fmi: Int
  faultStatus: String
  commandOutcome: FleetKarmaMonitoringCommandOutcome
  operationId: ID
  "Original source record serialized as JSON."
  rawRecord: String
  details: String
}
type FleetKarmaMonitoringTruck {
  id: ID!
  karmaCarId: ID!
  karmaDeviceId: String!
  displayName: String!
  "Latest source data time (edt), interpreted as UTC; not the poll time."
  lastDataAt: DateTime
  online: Boolean!
  onlineSince: DateTime
  "Last source data time, or first observation when the source has no timestamp."
  noDataSince: DateTime
  "Reported faults in the retention window, including reported removals; not an active-fault inventory."
  faults: [FleetKarmaMonitoringEvent!]!
  latestFault: FleetKarmaMonitoringEvent
  lastCommandRequestedAt: DateTime
  lastCommandCompletedAt: DateTime
  lastCommandOutcome: FleetKarmaMonitoringCommandOutcome
}
type FleetKarmaMonitoringTruckPage {
  "Branch-wide totals, independent of filters and pagination."
  onlineTotal: Int!
  noDataTotal: Int!
  withFaultsTotal: Int!
  items: [FleetKarmaMonitoringTruck!]!
  total: Int!
  offset: Int!
  limit: Int!
}
type FleetKarmaMonitoringEventPage {
  items: [FleetKarmaMonitoringEvent!]!
  total: Int!
  offset: Int!
  limit: Int!
}
input FleetKarmaMonitoringTruckFilter {
  withFaults: Boolean
  online: Boolean
}
enum FleetKarmaMonitoringTruckSortField {
  DISPLAY_NAME
  LAST_DATA_AT
}
input FleetKarmaMonitoringTruckSort {
  field: FleetKarmaMonitoringTruckSortField! = DISPLAY_NAME
  direction: FleetSortDirection! = ASC
}
input FleetKarmaMonitoringEventFilter {
  karmaCarId: ID
  kinds: [FleetKarmaMonitoringEventKind!]
  from: DateTime
  to: DateTime
}
extend type Query {
  fleetKarmaMonitoringSettings: FleetKarmaMonitoringSettings!
  fleetKarmaMonitoringTrucks(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    ids: [ID!]
    filter: FleetKarmaMonitoringTruckFilter
    sort: FleetKarmaMonitoringTruckSort
  ): FleetKarmaMonitoringTruckPage!
  "Newest first; from/to are inclusive and the retention window always applies."
  fleetKarmaMonitoringEvents(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    ids: [ID!]
    filter: FleetKarmaMonitoringEventFilter
  ): FleetKarmaMonitoringEventPage!
}
extend type Mutation {
  "Full replacement; verifies the active Branch through Core."
  updateFleetKarmaMonitoringSettings(
    input: UpdateFleetKarmaMonitoringSettingsInput!
  ): FleetKarmaMonitoringSettings!
}
