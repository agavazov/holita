enum FleetDataSource {
  DEMO
  MANUAL
  "Imported from discocan's ERM device server."
  ERM
}
enum FleetActivityStatus {
  MOVING
  IDLE
  PARKED
  ASSET
  NOT_CONNECTED
  NO_DEVICE
}
enum FleetFuelStatus {
  NORMAL
  LOW
  STALE
  NO_DATA
}

"Latest device-reported state of a vehicle, classified against the Branch data clock."
type FleetVehicleState {
  activity: FleetActivityStatus!
  lastReportedAt: DateTime
  latitude: Float
  longitude: Float
  address: String
  speedKph: Float
  headingDeg: Int
  ignition: Boolean
  fuelLevelPct: Float
  fuelStatus: FleetFuelStatus!
  externalVoltage: Float
  backupBatteryVoltage: Float
  engineHours: Float
  coolantTempC: Int
  "Latest non-null odometer from any source, including MANUAL readings."
  odometerKm: Float
  odometerRecordedAt: DateTime
  odometerSource: FleetDataSource
}

type FleetStatusSample {
  id: ID!
  vehicleId: ID!
  deviceImei: String
  source: FleetDataSource!
  recordedAt: DateTime!
  receivedAt: DateTime!
  latitude: Float
  longitude: Float
  address: String
  speedKph: Float
  headingDeg: Int
  ignition: Boolean
  odometerKm: Float
  fuelLevelPct: Float
  externalVoltage: Float
  backupBatteryVoltage: Float
  engineHours: Float
  coolantTempC: Int
}

type FleetStatusSampleSeries {
  vehicleId: ID!
  from: DateTime!
  to: DateTime!
  "Ascending by recordedAt, then id; at most 2,000 rows (the newest are kept)."
  items: [FleetStatusSample!]!
  truncated: Boolean!
  "Recorded position coverage of the returned items; never join separate segments."
  track: FleetVehicleTrack!
}

enum FleetTrackGapReason {
  "No coordinate pair was recorded for a device observation."
  POSITION_UNAVAILABLE
  "Position samples exceed the inferred activity-based sample cadence."
  SAMPLE_GAP
  "The reporting device changed between position samples."
  DEVICE_CHANGED
  "The requested interval extends beyond the available positions."
  OUTSIDE_SAMPLES
  "Older samples were omitted by the newest-2,000 limit."
  TRUNCATED
}

type FleetTrackSegment {
  from: DateTime!
  to: DateTime!
  "Ascending references to items with a recorded latitude/longitude pair."
  sampleIds: [ID!]!
}

type FleetTrackGap {
  from: DateTime!
  to: DateTime!
  reason: FleetTrackGapReason!
  "For SAMPLE_GAP only: twice the inferred cadence (600s active, 7200s otherwise). This is not historical socket evidence."
  thresholdSeconds: Int
}

type FleetVehicleTrack {
  "Latest device sample time of the scoped Branch, independent of the requested interval."
  asOf: DateTime
  positionCount: Int!
  firstPositionAt: DateTime
  lastPositionAt: DateTime
  "Recorded coordinates only; MANUAL odometer rows never create or interrupt a segment."
  segments: [FleetTrackSegment!]!
  gaps: [FleetTrackGap!]!
}

"A dated raw eData 405 observation; catalog names and units are reference labels, not a conversion."
type FleetVehicleEdataMeasurement {
  id: ID!
  vehicleId: ID!
  deviceImei: String!
  source: FleetDataSource!
  recordedAt: DateTime!
  receivedAt: DateTime!
  parameterId: Int!
  parameterType: Int!
  valueSize: Int!
  valueHex: String!
  name: String
  unit: String
}

type FleetVehicleEdataMeasurementSeries {
  vehicleId: ID!
  from: DateTime!
  to: DateTime!
  "Ascending by recordedAt, then id; at most 2,000 rows (the newest are kept)."
  items: [FleetVehicleEdataMeasurement!]!
  truncated: Boolean!
}

type FleetDataClock {
  asOf: DateTime
  businessDate: Date!
  timeZone: String!
}

input RecordFleetOdometerReadingInput {
  vehicleId: ID!
  odometerKm: Float!
  recordedAt: DateTime!
}

extend type Query {
  fleetDataClock: FleetDataClock!
  fleetVehicleSamples(vehicleId: ID!, from: DateTime!, to: DateTime!): FleetStatusSampleSeries!
  fleetVehicleEdataMeasurements(
    vehicleId: ID!
    from: DateTime!
    to: DateTime!
    "Only these reported parameter IDs; every ID when omitted."
    parameterIds: [Int!]
  ): FleetVehicleEdataMeasurementSeries!
}

extend type Mutation {
  recordFleetOdometerReading(input: RecordFleetOdometerReadingInput!): FleetStatusSample!
}
