enum FleetGeoZoneEventKind {
  ENTER
  EXIT
}

type FleetGeoPoint {
  latitude: Float!
  longitude: Float!
}

type FleetGeoZone {
  id: ID!
  name: String!
  "Closed outer ring of the polygon; the first point repeats as the last."
  points: [FleetGeoPoint!]!
}

type FleetGeoZoneRef {
  id: ID!
  name: String!
}

"A vehicle entering or leaving a zone, derived from its position samples."
type FleetGeoZoneEvent {
  id: ID!
  kind: FleetGeoZoneEventKind!
  occurredAt: DateTime!
  latitude: Float!
  longitude: Float!
  zone: FleetGeoZoneRef!
  vehicle: FleetVehicleRef!
}

type FleetGeoZoneEventPage {
  items: [FleetGeoZoneEvent!]!
  total: Int!
  offset: Int!
  limit: Int!
}

input FleetGeoZoneEventFilter {
  vehicleIds: [ID!]
  zoneIds: [ID!]
  kinds: [FleetGeoZoneEventKind!]
  occurredFrom: DateTime
  occurredTo: DateTime
}

input FleetGeoPointInput {
  latitude: Float!
  longitude: Float!
}

"The ring may be open or closed; the zone stores it closed."
input FleetGeoZoneInput {
  name: String!
  "3 to 2000 distinct vertices forming a simple polygon (no self-intersection)."
  points: [FleetGeoPointInput!]!
}

extend type Query {
  "Zones of the active Branch, ordered by name."
  fleetGeoZones: [FleetGeoZone!]!
  "Zone entries and exits, newest first."
  fleetGeoZoneEvents(
    offset: Int! = 0
    limit: Int! = 20
    filter: FleetGeoZoneEventFilter
  ): FleetGeoZoneEventPage!
}

extend type Mutation {
  "Operator and above. A new zone starts with every vehicle outside."
  createFleetGeoZone(input: FleetGeoZoneInput!): FleetGeoZone!
  "Operator and above. Replaces the name and geometry; detection uses them from the next position."
  updateFleetGeoZone(id: ID!, input: FleetGeoZoneInput!): FleetGeoZone!
  "Operator and above. The zone disappears from the map; its logged events remain."
  deleteFleetGeoZone(id: ID!): FleetGeoZone!
}
