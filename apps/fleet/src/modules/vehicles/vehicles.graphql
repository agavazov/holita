enum FleetVehicleType {
  TRACTOR
  RIGID_TRUCK
  VAN
  CAR
  TRAILER
  OTHER
}
enum FleetFuelType {
  DIESEL
  PETROL
  LPG
  CNG
  ELECTRIC
  HYBRID
}
enum FleetVehicleStatus {
  ACTIVE
  IN_WORKSHOP
  INACTIVE
}

type FleetVehicle @key(fields: "id") {
  id: ID!
  branchId: ID!
  branch: Branch!
  licensePlate: String!
  notes: String
  fleetNumber: String
  vehicleType: FleetVehicleType
  make: String
  model: String
  modelYear: Int
  vin: String
  fuelType: FleetFuelType
  fuelTankCapacityL: Int
  status: FleetVehicleStatus!
  groupId: ID
  group: FleetVehicleGroupRef
  currentDriverId: ID
  currentDriver: FleetDriverRef
  deviceCount: Int!
  state: FleetVehicleState! # B2
  "Events of the vehicle with alert status OPEN." # B2
  openAlertCount: Int! # B2
  "The PLANNED task with the worst urgency; the documented exception to the reference rule." # B2
  nextService: FleetServiceTask # B2
  createdAt: DateTime!
  updatedAt: DateTime!
}

type FleetVehicleRef {
  id: ID!
  licensePlate: String!
  fleetNumber: String
  vehicleType: FleetVehicleType
  status: FleetVehicleStatus!
}

type FleetVehiclePage {
  items: [FleetVehicle!]!
  total: Int!
  offset: Int!
  limit: Int!
}

input FleetVehicleFilter {
  statuses: [FleetVehicleStatus!]
  vehicleTypes: [FleetVehicleType!]
  fuelTypes: [FleetFuelType!]
  groupIds: [ID!]
  hasGroup: Boolean
  currentDriverIds: [ID!]
  hasDriver: Boolean
  hasDevice: Boolean
  hasOpenAlerts: Boolean # B2
  "At most 50 nonrecursive conditions; every condition and field applies together (AND)."
  allOf: [FleetVehicleCondition!]
}

"One Vehicles filter condition; omitted/null fields apply no constraint."
input FleetVehicleCondition {
  statuses: [FleetVehicleStatus!]
  excludedStatuses: [FleetVehicleStatus!]
  activities: [FleetActivityStatus!]
  excludedActivities: [FleetActivityStatus!]
  vehicleTypes: [FleetVehicleType!]
  excludedVehicleTypes: [FleetVehicleType!]
  groupIds: [ID!]
  excludedGroupIds: [ID!]
  hasGroup: Boolean
  fuelTypes: [FleetFuelType!]
  currentDriverIds: [ID!]
  hasDriver: Boolean
  hasDevice: Boolean
  hasOpenAlerts: Boolean
  makeContains: String
  makeEquals: String
  modelYearEquals: Int
  modelYearAbove: Int
  modelYearBelow: Int
  modelYearFrom: Int
  modelYearTo: Int
  odometerKmAbove: Float
  odometerKmBelow: Float
  odometerKmFrom: Float
  odometerKmTo: Float
  "Calendar dates of createdAt in the configured Branch time zone; after/before are exclusive, from/to inclusive."
  createdOnAfter: Date
  createdOnBefore: Date
  createdOnFrom: Date
  createdOnTo: Date
}

enum FleetVehicleSortField {
  LICENSE_PLATE
  FLEET_NUMBER
  CREATED_AT
  UPDATED_AT
  STATUS
  LAST_REPORTED_AT
  ODOMETER_KM
}

"Exact whole-Branch counts, independent of list search, conditions and pagination."
type FleetVehicleSummary {
  dataAsOf: DateTime
  inOperation: Int!
  inWorkshop: Int!
  moving: Int!
  notReporting: Int!
  openAlerts: Int!
  lowFuel: Int!
}

type FleetVehicleActionFailure {
  id: ID!
  code: String!
  message: String!
}

type FleetVehicleActionResult {
  succeededIds: [ID!]!
  failures: [FleetVehicleActionFailure!]!
}

input FleetVehicleSort {
  field: FleetVehicleSortField! = CREATED_AT
  direction: FleetSortDirection! = DESC
}

input CreateFleetVehicleInput {
  licensePlate: String!
  notes: String
  fleetNumber: String
  vehicleType: FleetVehicleType
  make: String
  model: String
  modelYear: Int
  vin: String
  fuelType: FleetFuelType
  fuelTankCapacityL: Int
  status: FleetVehicleStatus
  groupId: ID
  currentDriverId: ID
}

"Omitted fields stay unchanged; explicit null clears optional fields."
input UpdateFleetVehicleInput {
  licensePlate: String
  notes: String
  fleetNumber: String
  vehicleType: FleetVehicleType
  make: String
  model: String
  modelYear: Int
  vin: String
  fuelType: FleetFuelType
  fuelTankCapacityL: Int
  status: FleetVehicleStatus
  groupId: ID
  currentDriverId: ID
}

type Query {
  fleetVehicles(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    ids: [ID!]
    filter: FleetVehicleFilter
    sort: FleetVehicleSort
  ): FleetVehiclePage!
  fleetVehicle(id: ID!): FleetVehicle!
  fleetVehicleSummary: FleetVehicleSummary!
}

type Mutation {
  createFleetVehicle(input: CreateFleetVehicleInput!): FleetVehicle!
  updateFleetVehicle(id: ID!, input: UpdateFleetVehicleInput!): FleetVehicle!
  "Sets status INACTIVE and clears the current driver; idempotent."
  deactivateFleetVehicle(id: ID!): FleetVehicle!
  deleteFleetVehicle(id: ID!): FleetVehicle!
  "One or many IDs (1–100 unique); each submitted record settles with an independent result."
  deleteFleetVehicles(ids: [ID!]!): FleetVehicleActionResult!
  deactivateFleetVehicles(ids: [ID!]!): FleetVehicleActionResult!
}
