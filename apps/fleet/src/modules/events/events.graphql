enum FleetEventKind {
  HARSH_ACCELERATION
  HARSH_BRAKING
  SPEED_BUMP
  OVERTAKING
  ROUNDABOUT
  LANE_CHANGE
  SHARP_TURN
  OFF_ROAD
  SPEEDING
  IGNITION_ON
  IGNITION_OFF
  IDLING
  LOW_FUEL
  FUEL_DROP
  POWER_DISCONNECTED
  LOW_BACKUP_BATTERY
  CAN_DISCONNECTED
  "eData 411 CAN error flag, not proof of a disconnection."
  CAN_ERROR
  DEVICE_OFFLINE
  "Karma received newer data on two consecutive polls while discocan's import lagged."
  UNIT_ON_BACKUP
  DIAGNOSTIC_TROUBLE_CODE
  CRASH_DETECTED
}
enum FleetEventSeverity {
  INFO
  WARNING
  CRITICAL
}
enum FleetAlertStatus {
  OPEN
  ACKNOWLEDGED
  RESOLVED
}
enum FleetMeasurementUnit {
  KPH
  PERCENT
  VOLT
  MINUTE
}

type FleetEvent {
  id: ID!
  branchId: ID!
  vehicleId: ID!
  vehicle: FleetVehicleRef!
  tripId: ID
  driverId: ID
  driver: FleetDriverRef
  deviceImei: String
  source: FleetDataSource!
  occurredAt: DateTime!
  kind: FleetEventKind!
  severity: FleetEventSeverity!
  intensity: Int
  latitude: Float
  longitude: Float
  address: String
  speedKph: Float
  measuredValue: Float
  thresholdValue: Float
  measurementUnit: FleetMeasurementUnit
  troubleCode: String
  details: String
  "Null for informational events; alerts have a status."
  alertStatus: FleetAlertStatus
  acknowledgedAt: DateTime
  resolvedAt: DateTime
  remark: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type FleetEventPage {
  items: [FleetEvent!]!
  total: Int!
  offset: Int!
  limit: Int!
}

type FleetAlertCounts {
  open: Int!
  openCritical: Int!
  acknowledged: Int!
  resolved: Int!
}

type FleetManeuverCount {
  kind: FleetEventKind!
  intensity1: Int!
  intensity2: Int!
  intensity3: Int!
  intensityUnknown: Int!
  total: Int!
}

input FleetEventFilter {
  actionable: Boolean
  alertStatuses: [FleetAlertStatus!]
  severities: [FleetEventSeverity!]
  kinds: [FleetEventKind!]
  vehicleIds: [ID!]
  driverIds: [ID!]
  tripIds: [ID!]
  occurredFrom: DateTime
  occurredTo: DateTime
  "Independent AND conditions; at most 50."
  allOf: [FleetEventCondition!]
}

input FleetEventCondition {
  actionable: Boolean
  alertStatuses: [FleetAlertStatus!]
  excludedAlertStatuses: [FleetAlertStatus!]
  severities: [FleetEventSeverity!]
  excludedSeverities: [FleetEventSeverity!]
  kinds: [FleetEventKind!]
  excludedKinds: [FleetEventKind!]
  vehicleIds: [ID!]
  excludedVehicleIds: [ID!]
  driverIds: [ID!]
  excludedDriverIds: [ID!]
  tripIds: [ID!]
  occurredFrom: DateTime
  occurredTo: DateTime
}

enum FleetEventSortField {
  OCCURRED_AT
  SEVERITY
  ALERT_STATUS
}
input FleetEventSort {
  field: FleetEventSortField! = OCCURRED_AT
  direction: FleetSortDirection! = DESC
}

input FleetAlertTransitionInput {
  expectedStatus: FleetAlertStatus!
  "Omitted: unchanged. Null or blank: cleared. Up to 1,000 characters."
  remark: String
}

type FleetAlertActionFailure {
  id: ID!
  code: String!
  message: String!
}

type FleetAlertActionResult {
  succeededIds: [ID!]!
  failures: [FleetAlertActionFailure!]!
}

extend type Query {
  fleetEvents(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    ids: [ID!]
    filter: FleetEventFilter
    sort: FleetEventSort
  ): FleetEventPage!
  fleetEvent(id: ID!): FleetEvent!
  "Counts actionable events matching search and filter, ignoring actionable and included/excluded alert statuses in every condition."
  fleetAlertCounts(search: String, filter: FleetEventFilter): FleetAlertCounts!
}

extend type Mutation {
  "Acknowledges 1–100 unique alerts with independent results and optimistic concurrency."
  acknowledgeFleetAlerts(ids: [ID!]!, input: FleetAlertTransitionInput!): FleetAlertActionResult!
  acknowledgeFleetAlert(id: ID!, input: FleetAlertTransitionInput!): FleetEvent!
  resolveFleetAlert(id: ID!, input: FleetAlertTransitionInput!): FleetEvent!
  reopenFleetAlert(id: ID!, input: FleetAlertTransitionInput!): FleetEvent!
}

enum FleetProblemSourceKind {
  FLEET_ALERT
  DIAGNOSTIC
  ALARM
  REPORTING_GAP
  COMMAND
}

enum FleetProblemState {
  OPEN
  ACKNOWLEDGED
  "Recorded evidence does not establish a currently unresolved fault."
  RECORDED
  FAILED
  UNCERTAIN
  EXPIRED
}

enum FleetDiagnosticStatus {
  ADDED
  DELETED
}

enum FleetFaultSystem {
  ENGINE
  BRAKES
  ABS_EBS
  AFTERTREATMENT
  "CAN communication between the tracker's eData module and the vehicle; used by fault checks."
  CAN_BUS
  "Vehicle supply voltage measured by the tracker; used by fault checks."
  POWER
  OTHER
}

enum FleetFaultFindingSource {
  "The latest value of a supported warning lamp is RED, YELLOW or INFORMATION."
  WARNING_LAMP
  "The latest fault-logger report for this code added it and no later report deleted it."
  FAULT_LOGGER
  "An unresolved Fleet alert with a trouble code but no fault-logger status."
  ALERT
  "CAN loss or CAN error reports within the last 24 hours."
  CAN_REPORT
  "The last three supply-voltage samples within six hours are below the low limit for the vehicle's 12 V or 24 V system."
  VOLTAGE
}

"One current fault of a vehicle found by the fault check."
type FleetFaultFinding {
  system: FleetFaultSystem!
  severity: FleetEventSeverity!
  source: FleetFaultFindingSource!
  "Trouble code (SPN/FMI or OBD), or the CAN report kind; null for lamps and voltage."
  code: String
  "SPN uses Float to retain unsigned 32-bit values beyond GraphQL Int."
  spn: Float
  fmi: Int
  "DiscoCan component-description translation key, when the code has a supported meaning."
  descriptionKey: String
  "Warning-lamp eData parameter for WARNING_LAMP findings."
  parameterId: Int
  lampState: FleetWarningLampState
  "Volts for VOLTAGE findings."
  value: Float
  "Start of the current episode: when the lamp state, logger entry or first CAN report in the window began."
  since: DateTime!
  lastSeenAt: DateTime!
  "Reports in the episode, for example CAN losses within 24 hours."
  occurrences: Int!
}

"The latest server-side fault check of a vehicle. It runs every 15 minutes from the data Fleet already holds and sends nothing to the vehicle."
type FleetFaultCheck {
  checkedAt: DateTime!
  "Newest status sample of the vehicle within seven days of the check."
  dataAsOf: DateTime
  "Current findings, worst severity first."
  findings: [FleetFaultFinding!]!
}

type FleetProblemDiagnostic {
  kind: FleetEventKind!
  troubleCode: String
  "CAN Engine logger observation; does not establish the current ECU fault state."
  status: FleetDiagnosticStatus
  "Source eData report number."
  report: Int
  "SPN uses Float to retain unsigned 32-bit values beyond GraphQL Int."
  spn: Float
  fmi: Int
  "Vehicle-system translation key from discocan's versioned catalog; CAN loss and CAN errors use CAN_BUS, unknown codes OTHER."
  systemKey: FleetFaultSystem!
  "DiscoCan component-description translation key, when the code has a supported meaning."
  descriptionKey: String
  catalogVersion: String!
  "For recorded diagnostics, first and last observations of this code/kind/report on the same vehicle/IMEI within the requested evidence period, across added/deleted observations. Alert-backed diagnostics use their own observation time."
  firstObservedAt: DateTime!
  lastObservedAt: DateTime!
  occurredAt: DateTime!
  "Receipt time when retained by Fleet; null for evidence available only from ERM Problems."
  receivedAt: DateTime
}

type FleetProblem {
  "Stable source kind plus source identity; suitable for row selection."
  id: ID!
  sourceKind: FleetProblemSourceKind!
  sourceId: ID!
  severity: FleetEventSeverity!
  occurredAt: DateTime!
  state: FleetProblemState!
  requiringAttention: Boolean!
  code: String!
  details: String
  "Every diagnostic in this recorded report, including deleted observations."
  diagnostics: [FleetProblemDiagnostic!]!
  vehicleId: ID
  vehicle: FleetVehicleRef
  deviceId: ID
  deviceImei: String
  "Only this non-null field authorizes the existing alert acknowledge/resolve workflow."
  alertId: ID
  fleetEventId: ID
  ermEventId: ID
  commandRequestId: ID
}

type FleetProblemSeverityCount {
  severity: FleetEventSeverity!
  total: Int!
  requiringAttention: Int!
  recorded: Int!
}

type FleetProblemSourceCount {
  sourceKind: FleetProblemSourceKind!
  total: Int!
  requiringAttention: Int!
  recorded: Int!
}

type FleetProblemCounts {
  "Fleet business snapshot time."
  asOf: DateTime!
  "Latest scoped device sample time, independent of current reporting."
  dataAsOf: DateTime
  "ERM snapshot time; null when the Branch has no registered devices."
  ermAsOf: DateTime
  periodFrom: DateTime!
  periodTo: DateTime!
  total: Int!
  requiringAttention: Int!
  "Historical fault/alarm observations, excluded from requiringAttention."
  recorded: Int!
  bySeverity: [FleetProblemSeverityCount!]!
  bySource: [FleetProblemSourceCount!]!
}

input FleetProblemFilter {
  sourceKinds: [FleetProblemSourceKind!]
  severities: [FleetEventSeverity!]
  states: [FleetProblemState!]
  vehicleIds: [ID!]
  deviceIds: [ID!]
  requiringAttention: Boolean
  "Recorded evidence and terminal command outcomes start here; defaults to 24h before occurredTo. At most 93 days. Current unresolved alerts and reporting gaps remain included."
  occurredFrom: DateTime
  "Exclusive recorded-evidence bound; defaults to the request time."
  occurredTo: DateTime
}

enum FleetProblemSortField {
  TIME
  SOURCE
  SEVERITY
  STATE
}

input FleetProblemSort {
  field: FleetProblemSortField! = TIME
  direction: FleetSortDirection! = DESC
}

type FleetProblemPage {
  "Sorted across the complete merged feed before pagination; newest first by default."
  items: [FleetProblem!]!
  total: Int!
  offset: Int!
  limit: Int!
  "Counts describe the complete filtered feed, before pagination."
  counts: FleetProblemCounts!
}

extend type Query {
  fleetProblems(
    offset: Int! = 0
    limit: Int! = 20
    filter: FleetProblemFilter
    sort: FleetProblemSort
  ): FleetProblemPage!
}
