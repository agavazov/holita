enum FleetDeviceOperationStatus {
  QUEUED
  SUBMITTING
  WAITING
  COMPLETE
  TIMED_OUT
  FAILED
  UNKNOWN
}

enum FleetDeviceOperationKind {
  READ_CONFIGURATION
  ADD_PARAMETER
  UPDATE_INTERVAL
  READ_RULES
  UPSERT_RULE
  READ_FAULT_LOGGER
  READ_COMMUNICATION_DIAGNOSTICS
}

enum FleetDeviceOperationPhase {
  READ_PROFILE
  READ_PARAMETERS
  WRITE_PARAMETER
  VERIFY_PARAMETERS
  READ_RULES
  WRITE_RULE
  VERIFY_RULES
  READ_DIAGNOSTICS
}

type FleetDeviceParameterPreset {
  catalogId: ID!
  catalogLabel: String!
  parameterId: Int!
  name: String!
  profileIds: [Int!]!
}

type FleetDeviceConfigurationParameter {
  parameterId: Int!
  intervalSeconds: Int!
  definitionHex: String!
}

type FleetDeviceConfiguration {
  configurationId: String!
  parameters: [FleetDeviceConfigurationParameter!]!
}

type FleetDeviceRule {
  ruleId: Int!
  trueEventId: Int!
  falseEventId: Int!
  debounceMilliseconds: Int!
  activateDashboard: Boolean!
  definitionHex: String!
  expression: String
  parameterIds: [Int!]!
}

type FleetDeviceRulesConfiguration {
  configurationId: String!
  rules: [FleetDeviceRule!]!
}

enum FleetDeviceDiagnosticReadKind {
  READ_FAULT_LOGGER
  READ_COMMUNICATION_DIAGNOSTICS
}

type FleetDeviceDiagnosticQueueEntry {
  id: ID!
  "Raw Karma queue state: 0 queued, 1 transmitted; neither is an ECU acknowledgement."
  state: Int
}

type FleetDeviceDiagnosticObservation {
  messageId: ID!
  eventTimeUtc: DateTime!
  rawMessage: String!
  family: String!
  acknowledgement: String
}

type FleetDeviceOperation {
  id: ID!
  branchId: ID!
  karmaCarId: ID!
  karmaDeviceId: String!
  status: FleetDeviceOperationStatus!
  kind: FleetDeviceOperationKind!
  phase: FleetDeviceOperationPhase!
  baselineOperationId: ID
  parameterBaselineOperationId: ID
  ruleId: Int
  ruleExpression: String
  ruleTrueEventId: Int
  ruleFalseEventId: Int
  ruleDebounceMilliseconds: Int
  parameterId: Int
  intervalSeconds: Int
  previousIntervalSeconds: Int
  catalogId: ID
  profileId: Int
  writeDispatchedAt: DateTime
  writeUncertain: Boolean!
  requestedAt: DateTime!
  dispatchedAt: DateTime
  completedAt: DateTime
  nextCheckAt: DateTime!
  deadlineAt: DateTime!
  queueIds: [ID!]!
  observationCount: Int!
  coverageComplete: Boolean!
  diagnosticQueue: [FleetDeviceDiagnosticQueueEntry!]!
  "Observed response records; no causal queue correlation or complete current ECU state is implied."
  diagnosticObservations: [FleetDeviceDiagnosticObservation!]!
  configuration: FleetDeviceConfiguration
  rulesConfiguration: FleetDeviceRulesConfiguration
  errorCode: String
}

input RequestFleetDeviceDiagnosticReadInput {
  karmaCarId: ID!
  expectedKarmaDeviceId: String!
  kind: FleetDeviceDiagnosticReadKind!
}

input RequestFleetDeviceConfigurationReadInput {
  karmaCarId: ID!
  expectedKarmaDeviceId: String!
}

input RequestFleetDeviceParameterAdditionInput {
  karmaCarId: ID!
  expectedKarmaDeviceId: String!
  baselineOperationId: ID!
  catalogId: ID!
  parameterId: Int!
  intervalSeconds: Int!
}

input RequestFleetDeviceParameterIntervalUpdateInput {
  karmaCarId: ID!
  expectedKarmaDeviceId: String!
  baselineOperationId: ID!
  parameterId: Int!
  intervalSeconds: Int!
}

input RequestFleetDeviceRulesReadInput {
  karmaCarId: ID!
  expectedKarmaDeviceId: String!
}

input RequestFleetDeviceRuleChangeInput {
  karmaCarId: ID!
  expectedKarmaDeviceId: String!
  baselineOperationId: ID!
  parameterBaselineOperationId: ID!
  ruleId: Int!
  expression: String!
  trueEventId: Int!
  falseEventId: Int!
  debounceMilliseconds: Int!
}

extend type Query {
  "The latest 20 scoped diagnostic read operations for the exact Karma car and device."
  fleetDeviceDiagnosticOperations(
    karmaCarId: ID!
    expectedKarmaDeviceId: String!
  ): [FleetDeviceOperation!]!
  fleetDeviceOperationsEnabled: Boolean!
  fleetDeviceConfigurationWritesEnabled: Boolean!
  fleetDeviceParameterPresets: [FleetDeviceParameterPreset!]!
  fleetDeviceOperation(id: ID!): FleetDeviceOperation
  "The latest complete parameter snapshot for the scoped Karma car and device pair."
  fleetDeviceConfigurationSnapshot(
    karmaCarId: ID!
    expectedKarmaDeviceId: String!
  ): FleetDeviceOperation
  "The latest complete rules snapshot for the scoped Karma car and device pair."
  fleetDeviceRulesSnapshot(karmaCarId: ID!, expectedKarmaDeviceId: String!): FleetDeviceOperation
  "The latest 20 configuration operations for the scoped Karma car and device pair, newest first."
  fleetDeviceOperations(karmaCarId: ID!, expectedKarmaDeviceId: String!): [FleetDeviceOperation!]!
}

extend type Mutation {
  "Requests only the fixed stored-fault logger read or 411 communication snapshot; never clears faults."
  requestFleetDeviceDiagnosticRead(
    input: RequestFleetDeviceDiagnosticReadInput!
  ): FleetDeviceOperation!
  "Requests a device configuration read; it does not change device configuration."
  requestFleetDeviceConfigurationRead(
    input: RequestFleetDeviceConfigurationReadInput!
  ): FleetDeviceOperation!
  requestFleetDeviceParameterAddition(
    input: RequestFleetDeviceParameterAdditionInput!
  ): FleetDeviceOperation!
  requestFleetDeviceParameterIntervalUpdate(
    input: RequestFleetDeviceParameterIntervalUpdateInput!
  ): FleetDeviceOperation!
  requestFleetDeviceRulesRead(input: RequestFleetDeviceRulesReadInput!): FleetDeviceOperation!
  requestFleetDeviceRuleChange(input: RequestFleetDeviceRuleChangeInput!): FleetDeviceOperation!
}
