enum FleetDeviceModel {
  STARLINK_TRACKER
  STARLINK_SCOUT
  OTHER
}
enum FleetDeviceOption {
  CELLULAR_4G
  SAFETY_SF
  IRF
  CAN
  DRIVER_ID
  GEOZONES_GO
  TEMPERATURE_DS
  ECONNECT
  WIFI
  VOICE
  EXTERNAL_ANTENNA
  RS232
  WILIOT
}

enum FleetDeviceStatus {
  ONLINE
  OFFLINE
  IN_STOCK
}

"Observed destination; null when the last available observation is older than 70 minutes."
enum FleetDeviceRouting {
  "The device reported to holita after the retained routing observation."
  HOLITA
  "The retained observation established use of the Karma backup."
  KARMA_BACKUP
  "The retained observation established that neither destination received recent data."
  SILENT
}

type FleetDevice @key(fields: "id") {
  id: ID!
  branchId: ID!
  branch: Branch!
  "15 digits, unique across all Tenants: one physical unit belongs to one Branch."
  imei: String!
  vehicleId: ID
  vehicle: FleetVehicleRef
  "Unassigned means IN_STOCK; assigned devices are ONLINE when their current pair reported within the configured not-reporting hours of the Branch data clock."
  status: FleetDeviceStatus!
  "A fresh ERM receipt after the retained observation establishes HOLITA. Otherwise the retained observation expires after 70 minutes; null means unknown or ERM import disabled."
  routing: FleetDeviceRouting
  "Retained backup history at the last stored routing observation; null without one."
  routingHealth: FleetDeviceRoutingHealth
  model: FleetDeviceModel
  "ERM serial number from the unit's label; unique within the Branch."
  serialNumber: String
  options: [FleetDeviceOption!]!
  firmwareVersion: String
  "eData module and version reported by the unit, for example eData Fms 6.56."
  edataModule: String
  simPhoneNumber: String
  simIccid: String
  "StarLink Simple SMS password (parameter 0593), plain text by the owner's decision."
  smsPassword: String
  installedAt: DateTime
  notes: String
  "Latest sample recorded for this device on its current vehicle; null if never." # B2
  lastReportedAt: DateTime # B2
  diagnostics: FleetDeviceDiagnosticSummary!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type FleetDeviceRoutingHealth {
  "Backup period open at the retained observation; does not establish the current destination."
  backupSince: DateTime
  "Latest completed backup period at the retained observation."
  lastBackupStartedAt: DateTime
  lastBackupEndedAt: DateTime
  "Accumulated backup seconds through the retained observation; never extended by the current clock."
  backupSeconds: Int!
}

"Recorded DTC and CAN faults for the current vehicle/IMEI pair; these are historical evidence, not an active-fault assertion."
type FleetDeviceDiagnosticSummary {
  count: Int!
  latest: FleetDeviceDiagnosticFault
}

type FleetDeviceDiagnosticFault {
  kind: FleetEventKind!
  occurredAt: DateTime!
  troubleCode: String
  details: String
  source: FleetDataSource!
}

type FleetDevicePage {
  items: [FleetDevice!]!
  total: Int!
  offset: Int!
  limit: Int!
}

input FleetDeviceFilter {
  models: [FleetDeviceModel!]
  options: [FleetDeviceOption!]
  vehicleIds: [ID!]
  "Independent AND conditions, including repeated fields; at most 50."
  allOf: [FleetDeviceCondition!]
}

input FleetDeviceCondition {
  statuses: [FleetDeviceStatus!]
  excludedStatuses: [FleetDeviceStatus!]
  models: [FleetDeviceModel!]
  excludedModels: [FleetDeviceModel!]
  firmwareVersionEquals: String
  firmwareVersionNotEquals: String
  firmwareVersionStartsWith: String
  hasVehicle: Boolean
}

enum FleetDeviceSortField {
  IMEI
  INSTALLED_AT
  CREATED_AT
  STATUS
  VEHICLE_LICENSE_PLATE
  LAST_REPORTED_AT
}
input FleetDeviceSort {
  field: FleetDeviceSortField! = CREATED_AT
  direction: FleetSortDirection! = DESC
}

input CreateFleetDeviceInput {
  imei: String!
  vehicleId: ID
  model: FleetDeviceModel
  serialNumber: String
  options: [FleetDeviceOption!]
  firmwareVersion: String
  edataModule: String
  simPhoneNumber: String
  simIccid: String
  smsPassword: String
  installedAt: DateTime
  notes: String
}

"Omitted fields stay unchanged; explicit null clears optional fields."
input UpdateFleetDeviceInput {
  imei: String
  vehicleId: ID
  model: FleetDeviceModel
  serialNumber: String
  options: [FleetDeviceOption!]
  firmwareVersion: String
  edataModule: String
  simPhoneNumber: String
  simIccid: String
  smsPassword: String
  installedAt: DateTime
  notes: String
}

"Exact whole-Branch counts, independent of the list query/page; firmware policy and hardware diagnostics are unavailable."
type FleetDeviceSummary {
  dataAsOf: DateTime
  online: Int!
  offline: Int!
  inStock: Int!
}

type FleetDeviceActionFailure {
  id: ID!
  code: String!
  message: String!
}

type FleetDeviceActionResult {
  succeededIds: [ID!]!
  failures: [FleetDeviceActionFailure!]!
}

extend type Query {
  fleetDevices(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    ids: [ID!]
    filter: FleetDeviceFilter
    sort: FleetDeviceSort
  ): FleetDevicePage!
  fleetDevice(id: ID!): FleetDevice!
  fleetDeviceSummary: FleetDeviceSummary!
}

extend type Mutation {
  createFleetDevice(input: CreateFleetDeviceInput!): FleetDevice!
  updateFleetDevice(id: ID!, input: UpdateFleetDeviceInput!): FleetDevice!
  deleteFleetDevice(id: ID!): FleetDevice!
  "One or many unique IDs (1–100); each submitted deletion settles independently."
  deleteFleetDevices(ids: [ID!]!): FleetDeviceActionResult!
}
