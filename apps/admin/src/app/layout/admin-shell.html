<a class="app-skip-link" href="#main-content">{{ text().skipNavigation }}</a>
<div class="app-shell" [class.app-shell--rail]="rail() && !mobile()">
  <header class="app-topbar">
    <holita-admin-topbar
      class="app-topbar__bar"
      [language]="language()"
      [languageUrl]="languageUrl()"
      [context]="context()"
      [branches]="branches()"
      [branchControl]="branchControl"
      [loading]="loading()"
      [tenantName]="tenantName()"
      [homeLink]="homeLink()"
      [showLogo]="mobile()"
      [menuExpanded]="menuExpanded()"
      [menuControls]="mobile() ? 'mobile-navigation' : 'desktop-navigation'"
      (menuToggle)="toggleNavigation()"
      (signOut)="signOut.emit()"
    />
  </header>
  @if (!mobile()) {
    <aside class="app-sidebar" id="desktop-navigation" [attr.aria-label]="text().navigation">
      <holita-admin-sidebar
        [navigation]="navigation()"
        [language]="language()"
        [homeLink]="homeLink()"
        [tenantName]="tenantName()"
        [rail]="rail()"
      />
    </aside>
  }
  <main id="main-content" class="app-main" tabindex="-1">
    <div class="app-page">
      @if (appearance.persistenceFailed()) {
        <p-message severity="warn" [pt]="{ root: { role: 'status', 'aria-live': 'polite' } }">
          {{ text().themePersistenceError }}
        </p-message>
      }
      <ng-content />
    </div>
  </main>
</div>
@if (mobile()) {
  <p-drawer
    [visible]="mobileOpen()"
    (visibleChange)="drawerVisibilityChanged($event)"
    (onShow)="focusNavigation()"
    [modal]="true"
    [blockScroll]="true"
    appendTo="body"
    styleClass="app-nav-drawer"
    [ariaCloseLabel]="text().closeNavigation"
    [pt]="{
      root: { 'aria-label': text().navigation },
      pcCloseButton: { root: { id: 'mobile-navigation-close' } },
    }"
  >
    <ng-template #header>
      <span class="app-logo" aria-hidden="true">
        <span class="app-logo__mark">h</span>
        <span class="app-logo__word">holita</span>
      </span>
    </ng-template>
    <div id="mobile-navigation" class="app-nav-drawer__content">
      <holita-admin-sidebar
        [navigation]="navigation()"
        [language]="language()"
        [homeLink]="homeLink()"
        [tenantName]="tenantName()"
        [showLogo]="false"
        idPrefix="mobile-nav"
      />
    </div>
  </p-drawer>
}
