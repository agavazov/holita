@if (backLink(); as link) {
  <a
    class="page-header__back"
    [routerLink]="link"
    [queryParams]="backQueryParams()"
    [fragment]="backFragment() ?? undefined"
  >
    <svg data-p-icon="arrow-left" aria-hidden="true"></svg>
    {{ backLabel() }}
  </a>
}
<div class="page-header__row">
  <div class="page-header__heading">
    <div class="page-header__title-row">
      <h1 #heading id="page-title" class="page-header__title" tabindex="-1">{{ title() }}</h1>
      @if (countText(); as count) {
        <span class="page-header__count">{{ count }}</span>
      }
      <ng-content select="[headerMeta]" />
    </div>
  </div>
  <div class="page-header__actions">
    @if (primaryAction(); as primary) {
      <button
        pButton
        type="button"
        [routerLink]="primary.link ?? null"
        [disabled]="primary.disabled || primary.loading || false"
        [loading]="primary.loading ?? false"
        (click)="runPrimary(primary, $event)"
      >
        {{ primary.label }}
      </button>
    }
    <discocan-menu-button
      [ariaLabel]="text().actions"
      [options]="menuOptions()"
      (choose)="choose($event)"
    >
      <svg data-p-icon="ellipsis-h" aria-hidden="true"></svg>
    </discocan-menu-button>
  </div>
</div>
