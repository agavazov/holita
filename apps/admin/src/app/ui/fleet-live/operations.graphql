fragment AdminFleetLiveDevice on FleetDevice {
  id
  imei
  vehicleId
  status
  routing
  routingHealth {
    backupSince
  }
  lastReportedAt
  currentWarnings {
    ...AdminWarningLamp
  }
  warningLamps {
    ...AdminWarningLamp
  }
  diagnostics {
    count
    latest {
      kind
      occurredAt
      troubleCode
      details
      source
    }
  }
  ermState {
    online
    mode
    connectedSince
    lastFrameAt
    latestEvent {
      eventTime
      speedKmh
      engineOn
      ignitionOn
      nameEn: name(language: EN)
      nameBg: name(language: BG)
    }
    latestAlarm {
      eventTime
      severity
      nameEn: name(language: EN)
      nameBg: name(language: BG)
    }
    alarmsLast24h
    health {
      overdue
      lastFrameAgeSeconds
      expectedIntervalSeconds
      lastCloseReason
    }
  }
}

fragment AdminWarningLamp on FleetWarningLamp {
  deviceId
  parameterId
  state
  recordedAt
  stateSince
}

fragment AdminFaultDiagnostic on FleetProblemDiagnostic {
  kind
  troubleCode
  status
  report
  spn
  fmi
  systemKey
  descriptionKey
  catalogVersion
  firstObservedAt
  lastObservedAt
  occurredAt
  receivedAt
}
