fragment AdminFleetLiveDevice on FleetDevice {
  id
  imei
  vehicleId
  status
  routing
  routingHealth {
    backupSince
  }
  lastReportedAt
  currentWarnings {
    ...AdminWarningLamp
  }
  warningLamps {
    ...AdminWarningLamp
  }
  diagnostics {
    count
    latest {
      kind
      occurredAt
      troubleCode
      details
      source
    }
  }
  ermState {
    online
    mode
    connectedSince
    lastFrameAt
    latestEvent {
      eventTime
      speedKmh
      engineOn
      ignitionOn
      nameEn: name(language: EN)
      nameBg: name(language: BG)
    }
    latestAlarm {
      eventTime
      severity
      nameEn: name(language: EN)
      nameBg: name(language: BG)
    }
    alarmsLast24h
    health {
      overdue
      lastFrameAgeSeconds
      expectedIntervalSeconds
      lastCloseReason
    }
  }
}

fragment AdminWarningLamp on FleetWarningLamp {
  deviceId
  parameterId
  state
  recordedAt
  stateSince
}

fragment AdminFaultDiagnostic on FleetProblemDiagnostic {
  kind
  troubleCode
  status
  report
  spn
  fmi
  systemKey
  descriptionKey
  catalogVersion
  firstObservedAt
  lastObservedAt
  occurredAt
  receivedAt
}

fragment AdminFaultCheck on FleetFaultCheck {
  checkedAt
  dataAsOf
  findings {
    system
    severity
    source
    code
    spn
    fmi
    descriptionKey
    parameterId
    lampState
    value
    since
    lastSeenAt
    occurrences
  }
}

fragment AdminFreezeFrame on FleetFreezeFrame {
  recordedAt
  values {
    parameterId
    name
    unit
    valueHex
    value
  }
}

fragment AdminFaultRead on ErmCommandRequest {
  id
  action
  status
  actorId
  createdAt
  sentAt
  answeredAt
  completedAt
  expiresAt
  waitingReason
  faultReadVerdict {
    activeCodes
    codeCount
    receivedAt
  }
}

mutation AdminReadFaultsNow($deviceId: ID!) {
  sendErmDeviceCommand(
    input: {
      deviceId: $deviceId
      action: READ_EDATA_FAULTS
      expiresInSeconds: 900
      intent: "Fault scanner: read faults now"
    }
  ) {
    ...AdminFaultRead
  }
}
