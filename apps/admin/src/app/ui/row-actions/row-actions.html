<button
  type="button"
  class="app-icon-button row-actions__trigger"
  aria-haspopup="menu"
  [attr.aria-label]="label()"
  [attr.aria-expanded]="open()"
  (click)="menu.toggle($event)"
>
  <svg data-p-icon="ellipsis-v" aria-hidden="true"></svg>
</button>
<p-menu
  #menu
  [model]="items()"
  [popup]="true"
  appendTo="body"
  (onShow)="open.set(true)"
  (onHide)="open.set(false)"
/>
