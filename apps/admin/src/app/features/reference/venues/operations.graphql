fragment AdminVenue on ReferenceVenue {
  id
  storeId
  name
  description
  city
  countryCode
  address
  capacity
  active
  createdAt
  updatedAt
}

query AdminVenues(
  $offset: Int!
  $limit: Int!
  $search: String
  $active: Boolean
  $ids: [ID!]
  $sort: ReferenceVenueSort
) {
  referenceVenues(
    offset: $offset
    limit: $limit
    search: $search
    active: $active
    ids: $ids
    sort: $sort
  ) {
    items {
      ...AdminVenue
    }
    total
    offset
    limit
  }
}
query AdminVenue($id: ID!) {
  referenceVenue(id: $id) {
    ...AdminVenue
  }
}
mutation AdminCreateVenue($input: CreateReferenceVenueInput!) {
  createReferenceVenue(input: $input) {
    ...AdminVenue
  }
}
mutation AdminUpdateVenue($id: ID!, $input: UpdateReferenceVenueInput!) {
  updateReferenceVenue(id: $id, input: $input) {
    ...AdminVenue
  }
}
mutation AdminDeleteVenue($id: ID!) {
  deleteReferenceVenue(id: $id) {
    ...AdminVenue
  }
}
