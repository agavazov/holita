fragment AdminTag on ReferenceTag {
  id
  storeId
  name
  color
  active
  createdAt
  updatedAt
}

query AdminTags(
  $offset: Int!
  $limit: Int!
  $search: String
  $active: Boolean
  $ids: [ID!]
  $sort: ReferenceTagSort
) {
  referenceTags(
    offset: $offset
    limit: $limit
    search: $search
    active: $active
    ids: $ids
    sort: $sort
  ) {
    items {
      ...AdminTag
    }
    total
    offset
    limit
  }
}
query AdminTag($id: ID!) {
  referenceTag(id: $id) {
    ...AdminTag
  }
}
mutation AdminCreateTag($input: CreateReferenceTagInput!) {
  createReferenceTag(input: $input) {
    ...AdminTag
  }
}
mutation AdminUpdateTag($id: ID!, $input: UpdateReferenceTagInput!) {
  updateReferenceTag(id: $id, input: $input) {
    ...AdminTag
  }
}
mutation AdminDeleteTag($id: ID!) {
  deleteReferenceTag(id: $id) {
    ...AdminTag
  }
}
