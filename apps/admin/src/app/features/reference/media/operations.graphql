fragment AdminMediaDetails on ReferenceEventMedia {
  __typename
  id
  eventId
  originalName
  contentType
  byteSize
  altText
  position
  isCover
  readUrl
  readUrlExpiresAt
  createdAt
}
query AdminMedia($eventId: ID!) {
  referenceEventMedia(eventId: $eventId) {
    ...AdminMediaDetails
  }
}
mutation AdminUploadIntent($eventId: ID!, $input: CreateReferenceUploadInput!) {
  createReferenceUploadIntent(eventId: $eventId, input: $input) {
    uploadId
    fileKey
    uploadUrl
    method
    headers {
      name
      value
    }
    expiresAt
  }
}
mutation AdminFinalizeUpload($uploadId: ID!) {
  finalizeReferenceUpload(uploadId: $uploadId) {
    ...AdminMediaDetails
  }
}
mutation AdminUpdateMedia($eventId: ID!, $id: ID!, $input: UpdateReferenceEventMediaInput!) {
  updateReferenceEventMedia(eventId: $eventId, id: $id, input: $input) {
    ...AdminMediaDetails
  }
}
mutation AdminDeleteMedia($eventId: ID!, $id: ID!) {
  deleteReferenceEventMedia(eventId: $eventId, id: $id)
}
mutation AdminMediaCover($eventId: ID!, $id: ID!) {
  setReferenceEventCover(eventId: $eventId, id: $id) {
    ...AdminMediaDetails
  }
}
mutation AdminReorderMedia($eventId: ID!, $ids: [ID!]!) {
  reorderReferenceEventMedia(eventId: $eventId, ids: $ids) {
    ...AdminMediaDetails
  }
}
