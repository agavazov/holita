fragment AdminEventListItem on ReferenceEvent {
  id
  storeId
  title
  code
  status
  format
  capacity
  budget
  featured
  startsAt
  endsAt
  registrationOpensOn
  registrationClosesOn
  venueId
  venue {
    id
    name
    city
    countryCode
    address
    active
  }
  meetingUrl
  tagIds
  tags {
    id
    name
    color
    active
  }
  summary
  deletedAt
  createdAt
  updatedAt
}
fragment AdminEventDetails on ReferenceEvent {
  ...AdminEventListItem
  descriptionHtml
}
query AdminEvents(
  $offset: Int!
  $limit: Int!
  $filter: ReferenceEventFilter
  $sort: ReferenceEventSort
) {
  referenceEvents(offset: $offset, limit: $limit, filter: $filter, sort: $sort) {
    items {
      ...AdminEventListItem
    }
    total
    offset
    limit
  }
}
query AdminEvent($id: ID!, $includeDeleted: Boolean! = false) {
  referenceEvent(id: $id, includeDeleted: $includeDeleted) {
    ...AdminEventDetails
  }
}
mutation AdminCreateEvent($input: CreateReferenceEventInput!) {
  createReferenceEvent(input: $input) {
    ...AdminEventDetails
  }
}
mutation AdminUpdateEvent($id: ID!, $input: UpdateReferenceEventInput!) {
  updateReferenceEvent(id: $id, input: $input) {
    ...AdminEventDetails
  }
}
mutation AdminSetEventsStatus($ids: [ID!]!, $status: ReferenceEventStatus!) {
  setReferenceEventsStatus(ids: $ids, status: $status) {
    ids
    count
  }
}
mutation AdminTrashEvents($ids: [ID!]!) {
  trashReferenceEvents(ids: $ids) {
    ids
    count
  }
}
mutation AdminRestoreEvents($ids: [ID!]!) {
  restoreReferenceEvents(ids: $ids) {
    ids
    count
  }
}
query AdminEventHistory($eventId: ID!, $offset: Int!, $limit: Int!) {
  referenceEventHistory(eventId: $eventId, offset: $offset, limit: $limit) {
    items {
      id
      eventId
      operation
      subject
      actor
      changes {
        field
        before
        after
      }
      createdAt
    }
    total
    offset
    limit
  }
}
