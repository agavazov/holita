<div class="rich-editor" [class.invalid]="invalid()">
  <div class="rich-toolbar" role="group" [attr.aria-label]="text().eventFormatting">
    @for (block of ['paragraph', 'h2', 'h3']; track block) {
      <button
        pButton
        type="button"
        severity="secondary"
        [text]="true"
        [disabled]="disabled()"
        (mousedown)="$event.preventDefault()"
        (click)="format(block === 'h2' ? 'h2' : block === 'h3' ? 'h3' : 'paragraph')"
      >
        {{
          block === 'h2'
            ? text().eventHeading2
            : block === 'h3'
              ? text().eventHeading3
              : text().eventParagraph
        }}
      </button>
    }
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [disabled]="disabled()"
      [attr.aria-label]="text().eventBold"
      [attr.aria-pressed]="state().bold"
      (mousedown)="$event.preventDefault()"
      (click)="format('bold')"
    >
      <strong>B</strong>
    </button>
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [disabled]="disabled()"
      [attr.aria-label]="text().eventItalic"
      [attr.aria-pressed]="state().italic"
      (mousedown)="$event.preventDefault()"
      (click)="format('italic')"
    >
      <em>I</em>
    </button>
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [disabled]="disabled()"
      [attr.aria-pressed]="state().bullet"
      (mousedown)="$event.preventDefault()"
      (click)="format('bullet')"
    >
      {{ text().eventBullet }}
    </button>
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [disabled]="disabled()"
      [attr.aria-pressed]="state().ordered"
      (mousedown)="$event.preventDefault()"
      (click)="format('ordered')"
    >
      {{ text().eventNumbered }}
    </button>
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [disabled]="disabled() || (!state().selection && !state().link)"
      (click)="showLink()"
    >
      {{ text().eventLink }}
    </button>
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [disabled]="disabled() || !state().link"
      (click)="format('unlink')"
    >
      {{ text().eventUnlink }}
    </button>
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [disabled]="disabled() || !state().undo"
      (click)="format('undo')"
    >
      {{ text().eventUndo }}
    </button>
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [disabled]="disabled() || !state().redo"
      (click)="format('redo')"
    >
      {{ text().eventRedo }}
    </button>
  </div>
  <div #surface></div>
  <div class="rich-hint">
    <span>{{ text().eventLinkHint }}</span
    ><span>{{ bytes() }}</span>
  </div>
</div>
<p-dialog
  [header]="text().eventLink"
  [visible]="linkOpen()"
  (visibleChange)="linkOpen.set(false)"
  [modal]="true"
  appendTo="body"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(30rem,94vw)' }"
  (onShow)="focusLink()"
  [closeAriaLabel]="text().closeConfirmation"
>
  <label for="event-link-url">{{ text().eventLinkAddress }}</label>
  <input
    #linkInput
    pInputText
    id="event-link-url"
    [ngModel]="link()"
    (ngModelChange)="editLink($event)"
    [ngModelOptions]="{ standalone: true }"
    [fluid]="true"
    [invalid]="linkError()"
    [disabled]="disabled()"
    (keydown.enter)="$event.preventDefault(); applyLink()"
  />
  @if (linkError()) {
    <p role="alert">{{ text().eventLinkError }}</p>
  }
  <ng-template #footer
    ><button
      pButton
      type="button"
      severity="secondary"
      [outlined]="true"
      (click)="linkOpen.set(false)"
    >
      {{ text().cancel }}</button
    ><button pButton type="button" [disabled]="disabled()" (click)="applyLink()">
      {{ text().eventApplyLink }}
    </button></ng-template
  >
</p-dialog>
