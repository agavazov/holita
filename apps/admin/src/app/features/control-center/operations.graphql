fragment AdminControlCenterEventFields on ErmEvent {
  id
  eventId
  eventTime
  positionTime
  latitude
  longitude
  speedKmh
  heading
  odometer
  engineOn
  mainVoltage
  backupVoltage
  category
  severity
  name(language: $language)
}
fragment AdminControlCenterStateFields on ErmUnitState {
  unitId
  online
  mode
  connectedSince
  lastFrameAt
  alarmsLast24h
  lastPosition {
    ...AdminControlCenterEventFields
  }
  latestEvent {
    ...AdminControlCenterEventFields
  }
  latestAlarm {
    ...AdminControlCenterEventFields
  }
  health {
    lastFrameAgeSeconds
    expectedIntervalSeconds
    overdue
    upstreamClosesLast24h
    karmaRoutingWritesLast24h
  }
}
fragment AdminControlCenterDashboardDevice on FleetDevice {
  ...AdminFleetLiveDevice
  model
  vehicle {
    id
    licensePlate
  }
  ermState {
    lastPosition {
      eventTime
      positionTime
      latitude
      longitude
      name(language: $language)
    }
    health {
      karmaRoutingWritesLast24h
    }
  }
}
query AdminControlCenterDevices($language: ErmLanguage!) {
  fleetDevices(limit: 100) {
    total
    items {
      ...AdminControlCenterDashboardDevice
    }
  }
  fleetVehicles(limit: 100, sort: { field: LICENSE_PLATE, direction: ASC }) {
    total
    items {
      id
      licensePlate
      devices {
        ...AdminControlCenterDashboardDevice
      }
    }
  }
}
query AdminControlCenterDevice($id: ID!, $language: ErmLanguage!) {
  fleetDevice(id: $id) {
    ...AdminFleetLiveDevice
    id
    imei
    model
    serialNumber
    firmwareVersion
    edataModule
    simPhoneNumber
    simIccid
    installedAt
    notes
    options
    routing
    ermRouting {
      state
      since
      observedAt
      latestKarmaReportAt
      parked
      latestReturnAttempt {
        ...AdminControlCenterReturnAttempt
      }
    }
    currentWarnings {
      ...AdminWarningLamp
    }
    warningLamps {
      ...AdminWarningLamp
    }
    routingHealth {
      backupSince
      lastBackupStartedAt
      lastBackupEndedAt
      backupSeconds
    }
    vehicle {
      id
      licensePlate
    }
    ermState {
      ...AdminControlCenterStateFields
      recovery {
        id
        startedAt
        finishedAt
        outcome
        reason
      }
      mainVoltage {
        value
        observedAt
      }
      backupVoltage {
        value
        observedAt
      }
      signalQuality {
        value
        observedAt
      }
      firmwareVersion {
        value
        observedAt
      }
      edataMeasurements {
        parameterId
        name
        unit
        parameterType
        valueSize
        valueHex
        observedAt
      }
      health {
        gapsLast24h {
          from
          to
          durationSeconds
          expectedIntervalSeconds
        }
        networkChangesLast24h
        latestNetworkChange {
          at
          networkType
          operatorCode
        }
        lastCloseReason
        lastClosedAt
        latestKarmaRoutingWrite {
          id
          receivedAt
          command
          displayText
        }
      }
    }
  }
}
fragment AdminControlCenterReturnAttempt on ErmKarmaReturnAttempt {
  id
  requestedAt
  status
  pending
  holitaConnectedAt
  recovery {
    id
    startedAt
    finishedAt
    outcome
    reason
  }
}
mutation AdminControlCenterReturnToHolita($deviceId: ID!) {
  returnErmDeviceToHolita(deviceId: $deviceId) {
    ...AdminControlCenterReturnAttempt
  }
}
query AdminControlCenterSmsDevices($ids: [ID!]) {
  fleetDevices(ids: $ids, limit: 100, sort: { field: VEHICLE_LICENSE_PLATE, direction: ASC }) {
    total
    items {
      id
      imei
      simPhoneNumber
      smsPassword
      vehicle {
        id
        licensePlate
        fleetNumber
      }
    }
  }
}
query AdminControlCenterEvents($id: ID!, $language: ErmLanguage!, $input: ErmDeviceEventsInput) {
  fleetDevice(id: $id) {
    id
    ermEvents(input: $input) {
      cursor
      nextCursor
      hasMore
      items {
        ...AdminControlCenterEventFields
        fields
        edata
      }
    }
  }
}
query AdminControlCenterCommands($id: ID!, $input: ErmDevicePageInput) {
  fleetDevice(id: $id) {
    id
    ermCommands(input: $input) {
      cursor
      nextCursor
      hasMore
      items {
        id
        reference
        command
        fields
        status
        sentAt
        answeredAt
        resultCode
        responseText
      }
    }
  }
}
query AdminControlCenterFrames($id: ID!, $input: ErmDevicePageInput) {
  fleetDevice(id: $id) {
    id
    ermFrames(input: $input) {
      cursor
      nextCursor
      hasMore
      items {
        id
        direction
        receivedAt
        command
        reference
        checksum
        partial
        displayText
        rawHex
        acknowledgement {
          commandId
          commandRequestId
          commandReference
          replyReference
          resultCode
          receivedAt
        }
      }
    }
  }
}
fragment AdminControlCenterSnapshotFields on ErmParameterSnapshot {
  id
  unitId
  actorId
  intent
  status
  startedAt
  finishedAt
  parameterCount
  unreadParameters
  readCount
  failureReason
}
query AdminControlCenterSnapshots($id: ID!, $input: ErmDevicePageInput) {
  fleetDevice(id: $id) {
    id
    ermParameterSnapshots(input: $input) {
      cursor
      nextCursor
      hasMore
      items {
        ...AdminControlCenterSnapshotFields
        values {
          parameter
          title
          value
          outcome
          resultCode
        }
        changes {
          parameter
          title
          previousValue
          value
        }
      }
    }
  }
}
mutation AdminControlCenterStartSnapshot($input: StartErmParameterSnapshotInput!) {
  startErmParameterSnapshot(input: $input) {
    ...AdminControlCenterSnapshotFields
  }
}
mutation AdminControlCenterSendCommand($input: SendErmDeviceCommandInput!) {
  sendErmDeviceCommand(input: $input) {
    ...AdminControlCenterCommandRequestFields
  }
}

fragment AdminControlCenterConfigurationChangeFields on ErmConfigurationChange {
  id
  unitId
  actorId
  intent
  parameter
  operation
  parameters
  batchId
  batchIndex
  status
  startedAt
  finishedAt
  failureReason
  baseline
  intended
  steps
}
query AdminControlCenterConfigurationChanges($id: ID!) {
  fleetDevice(id: $id) {
    id
    ermConfigurationWritesEnabled
    ermConfigurationChanges {
      ...AdminControlCenterConfigurationChangeFields
    }
  }
}
mutation AdminControlCenterStartEdataChange($input: StartErmEdataChangeInput!) {
  startErmEdataChange(input: $input) {
    ...AdminControlCenterConfigurationChangeFields
  }
}
mutation AdminControlCenterStartParameterChange($input: StartErmParameterChangeInput!) {
  startErmParameterChange(input: $input) {
    ...AdminControlCenterConfigurationChangeFields
  }
}

fragment AdminControlCenterCommandRequestFields on ErmCommandRequest {
  id
  deviceId
  unitId
  actorId
  cancelledByActorId
  waitingReason
  waitingSince
  batchId
  batchIndex
  retryOfId
  intent
  action
  actionCode
  displayParameters {
    expiresInSeconds
    requestedFields
  }
  requestedAt
  queuedAt
  submittingAt
  sentAt
  answeredAt
  failedAt
  expiredAt
  cancelledAt
  uncertainAt
  outcomeCode
  reasonCode
  transportCommand {
    id
    unitId
    connectionId
    reference
    command
    fields
    status
    sentAt
    answeredAt
    resultCode
    responseText
    responseHex
    acknowledgement {
      commandId
      commandReference
      replyReference
      resultCode
      receivedAt
    }
  }
  configurationVerification {
    id
    status
    startedAt
    finishedAt
    failureReason
    stepDetails {
      name
      at
      outcome
      outcomeCode
      commandId
      payload
    }
  }
  sentFrame {
    id
    direction
    receivedAt
    command
    reference
    checksum
    partial
    displayText
    rawHex
  }
  receivedFrameHex
  status
  createdAt
  expiresAt
  submittedAt
  completedAt
  commandId
  resultCode
  responseText
  failureReason
}
query AdminControlCenterCommandRequests($id: ID!) {
  fleetDevice(id: $id) {
    id
    ermCommandRequests {
      ...AdminControlCenterCommandRequestFields
    }
  }
}
mutation AdminControlCenterCancelCommand($input: CancelErmDeviceCommandInput!) {
  cancelErmDeviceCommand(input: $input) {
    ...AdminControlCenterCommandRequestFields
  }
}

query AdminControlCenterCommandRequest($id: ID!) {
  ermCommandRequest(id: $id) {
    ...AdminControlCenterCommandRequestFields
  }
}
query AdminControlCenterDeviceProblems($id: ID!, $offset: Int! = 0) {
  fleetProblems(offset: $offset, limit: 20, filter: { deviceIds: [$id] }) {
    total
    offset
    limit
    counts {
      asOf
      dataAsOf
      ermAsOf
      periodFrom
      periodTo
      total
      requiringAttention
      recorded
    }
    items {
      id
      sourceKind
      sourceId
      severity
      occurredAt
      state
      requiringAttention
      code
      details
      diagnostics {
        ...AdminFaultDiagnostic
      }
      deviceId
      deviceImei
      vehicleId
      alertId
      ermEventId
      commandRequestId
    }
  }
}

query AdminControlCenterBranchCommandRequests(
  $offset: Int! = 0
  $limit: Int! = 20
  $filter: ErmCommandRequestsFilter
) {
  ermCommandRequests(offset: $offset, limit: $limit, filter: $filter) {
    total
    offset
    limit
    items {
      ...AdminControlCenterCommandRequestFields
    }
  }
}
mutation AdminControlCenterRetryCommand($input: RetryErmDeviceCommandInput!) {
  retryErmDeviceCommand(input: $input) {
    ...AdminControlCenterCommandRequestFields
  }
}
fragment AdminControlCenterCommandBatchFields on ErmCommandBatch {
  id
  actorId
  action
  createdAt
  stoppedAt
  stoppedByActorId
  counts {
    status
    count
  }
  requests {
    ...AdminControlCenterCommandRequestFields
  }
}
query AdminControlCenterCommandBatch($id: ID!) {
  ermCommandBatch(id: $id) {
    ...AdminControlCenterCommandBatchFields
  }
}
mutation AdminControlCenterStartCommandBatch($input: StartErmCommandBatchInput!) {
  startErmCommandBatch(input: $input) {
    ...AdminControlCenterCommandBatchFields
  }
}
mutation AdminControlCenterStopCommandBatch($id: ID!) {
  stopErmCommandBatch(id: $id) {
    ...AdminControlCenterCommandBatchFields
  }
}
query AdminControlCenterParameterBaseline($id: ID!) {
  fleetDevice(id: $id) {
    id
    ermParameterSnapshots(input: { pageSize: 25 }) {
      items {
        id
        startedAt
        status
        unreadParameters
        values {
          parameter
          title
          value
          outcome
        }
      }
    }
  }
}
query AdminControlCenterSettingsDevices($offset: Int! = 0) {
  fleetDevices(
    offset: $offset
    limit: 100
    sort: { field: VEHICLE_LICENSE_PLATE, direction: ASC }
  ) {
    total
    offset
    limit
    items {
      id
      imei
      vehicle {
        id
        licensePlate
      }
      ermConfigurationWritesEnabled
      ermState {
        online
        mode
      }
    }
  }
}
fragment AdminControlCenterConfigurationBatchFields on ErmConfigurationBatch {
  id
  actorId
  createdAt
  finishedAt
  stoppedAt
  stoppedByActorId
  changes {
    ...AdminControlCenterConfigurationChangeFields
  }
}
query AdminControlCenterConfigurationBatch($id: ID!) {
  ermConfigurationBatch(id: $id) {
    ...AdminControlCenterConfigurationBatchFields
  }
}
mutation AdminControlCenterStartParametersChange($input: StartErmParametersChangeInput!) {
  startErmParametersChange(input: $input) {
    ...AdminControlCenterConfigurationChangeFields
  }
}
mutation AdminControlCenterStartParameterBatch($input: StartErmParameterBatchInput!) {
  startErmParameterBatch(input: $input) {
    ...AdminControlCenterConfigurationBatchFields
  }
}
mutation AdminControlCenterStopConfigurationBatch($id: ID!) {
  stopErmConfigurationBatch(id: $id) {
    ...AdminControlCenterConfigurationBatchFields
  }
}

query AdminControlCenterQueueDeviceLabels($ids: [ID!]!) {
  fleetDevices(ids: $ids, limit: 100) {
    items {
      id
      imei
      vehicle {
        id
        licensePlate
      }
    }
  }
}
