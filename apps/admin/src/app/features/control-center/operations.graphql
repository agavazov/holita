fragment AdminControlCenterEventFields on ErmEvent {
  id
  eventId
  eventTime
  positionTime
  latitude
  longitude
  speedKmh
  heading
  odometer
  engineOn
  mainVoltage
  backupVoltage
  category
  severity
  name(language: $language)
}
fragment AdminControlCenterStateFields on ErmUnitState {
  unitId
  online
  mode
  connectedSince
  lastFrameAt
  alarmsLast24h
  lastPosition {
    ...AdminControlCenterEventFields
  }
  latestEvent {
    ...AdminControlCenterEventFields
  }
  latestAlarm {
    ...AdminControlCenterEventFields
  }
  health {
    lastFrameAgeSeconds
    expectedIntervalSeconds
    overdue
    upstreamClosesLast24h
    karmaRoutingWritesLast24h
  }
}
fragment AdminControlCenterKarmaTrucks on FleetKarmaMonitoringTruckPage {
  items {
    id
    karmaDeviceId
    lastDataAt
    online
  }
}
query AdminControlCenterDevices($language: ErmLanguage!) {
  fleetDevices(limit: 100) {
    total
    items {
      id
      imei
      model
      serialNumber
      simPhoneNumber
      vehicle {
        id
        licensePlate
      }
      ermState {
        ...AdminControlCenterStateFields
      }
    }
  }
  fleetKarmaMonitoringTrucks(limit: 100) {
    ...AdminControlCenterKarmaTrucks
  }
}
query AdminControlCenterDevice($id: ID!, $language: ErmLanguage!) {
  fleetDevice(id: $id) {
    id
    imei
    model
    serialNumber
    firmwareVersion
    edataModule
    simPhoneNumber
    simIccid
    installedAt
    notes
    vehicle {
      id
      licensePlate
    }
    ermState {
      ...AdminControlCenterStateFields
      mainVoltage {
        value
        observedAt
      }
      backupVoltage {
        value
        observedAt
      }
      signalQuality {
        value
        observedAt
      }
      firmwareVersion {
        value
        observedAt
      }
      health {
        lastCloseReason
        lastClosedAt
        latestKarmaRoutingWrite {
          id
          receivedAt
          command
          displayText
        }
      }
    }
  }
  fleetKarmaMonitoringTrucks(limit: 100) {
    ...AdminControlCenterKarmaTrucks
  }
}
query AdminControlCenterSmsDevices {
  fleetDevices(limit: 100, sort: { field: VEHICLE_LICENSE_PLATE, direction: ASC }) {
    total
    items {
      id
      imei
      simPhoneNumber
      smsPassword
      vehicle {
        id
        licensePlate
        fleetNumber
      }
    }
  }
}
query AdminControlCenterEvents($id: ID!, $language: ErmLanguage!, $input: ErmDeviceEventsInput) {
  fleetDevice(id: $id) {
    id
    ermEvents(input: $input) {
      cursor
      nextCursor
      hasMore
      items {
        ...AdminControlCenterEventFields
        fields
      }
    }
  }
}
query AdminControlCenterCommands($id: ID!, $input: ErmDevicePageInput) {
  fleetDevice(id: $id) {
    id
    ermCommands(input: $input) {
      cursor
      nextCursor
      hasMore
      items {
        id
        reference
        command
        fields
        status
        sentAt
        answeredAt
        resultCode
        responseText
      }
    }
  }
}
query AdminControlCenterFrames($id: ID!, $input: ErmDevicePageInput) {
  fleetDevice(id: $id) {
    id
    ermFrames(input: $input) {
      cursor
      nextCursor
      hasMore
      items {
        id
        direction
        receivedAt
        command
        reference
        checksum
        partial
        displayText
      }
    }
  }
}
fragment AdminControlCenterSnapshotFields on ErmParameterSnapshot {
  id
  status
  startedAt
  finishedAt
  parameterCount
  readCount
  failureReason
}
query AdminControlCenterSnapshots($id: ID!, $input: ErmDevicePageInput) {
  fleetDevice(id: $id) {
    id
    ermParameterSnapshots(input: $input) {
      cursor
      nextCursor
      hasMore
      items {
        ...AdminControlCenterSnapshotFields
        values {
          parameter
          title
          value
          resultCode
        }
        changes {
          parameter
          title
          previousValue
          value
        }
      }
    }
  }
}
mutation AdminControlCenterStartSnapshot($input: StartErmParameterSnapshotInput!) {
  startErmParameterSnapshot(input: $input) {
    ...AdminControlCenterSnapshotFields
  }
}
mutation AdminControlCenterSendCommand($input: SendErmDeviceCommandInput!) {
  sendErmDeviceCommand(input: $input) {
    id
    reference
    command
    status
    sentAt
    resultCode
    responseText
  }
}
