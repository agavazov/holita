<section class="app-card" [attr.aria-label]="text().title">
  <h2>{{ text().title }}</h2>
  <p class="app-muted">{{ text().hint }}</p>
  <p class="app-muted">{{ text().identityNote }}</p>
  @if (error(); as error) {
    <p-message severity="warn">{{ error }}</p-message>
  }
  <div [formGroup]="form" class="app-form-grid">
    <holita-form-field
      [label]="text().intent"
      controlId="erm-command-intent"
      [hint]="text().intentHint"
    >
      <input pInputText id="erm-command-intent" formControlName="intent" maxlength="200" />
    </holita-form-field>
    <holita-form-field [label]="text().expiry" controlId="erm-command-expiry">
      <input
        pInputText
        id="erm-command-expiry"
        formControlName="expiryMinutes"
        type="number"
        min="1"
        max="1440"
        step="1"
      />
    </holita-form-field>
  </div>
  <div class="command-queue__actions">
    @for (action of actions; track action) {
      <button
        pButton
        type="button"
        severity="secondary"
        [outlined]="true"
        [disabled]="formStatus() !== 'VALID' || sending() !== null"
        [loading]="sending() === action"
        (click)="send(action)"
      >
        {{ catalog().actions[action] }}
      </button>
    }
  </div>
  <p-confirmdialog [pt]="confirmPt()">
    <ng-template #message
      ><p id="erm-queue-confirm-message">{{ confirmationMessage() }}</p></ng-template
    >
  </p-confirmdialog>
</section>
<holita-command-history
  [requests]="requests()"
  [language]="language()"
  [target]="target()"
  [loading]="loading()"
  [error]="error()"
  (inspect)="selectedId.set($event.id)"
  (retry)="refresh()"
/>
<holita-command-details
  [request]="selected()"
  [language]="language()"
  [target]="target()"
  [cancelling]="cancelling() === selectedId() && cancelling() !== null"
  [error]="error()"
  (closed)="selectedId.set(null)"
  (cancelRequest)="cancel($event)"
/>
