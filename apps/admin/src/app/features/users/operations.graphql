fragment AdminUserDetails on User {
  id
  tenant {
    id
    name
  }
  name
  email
  active
  role
  lastSignInAt
  createdAt
  updatedAt
}

query AdminUsers {
  users {
    ...AdminUserDetails
  }
}

mutation AdminCreateUser($name: String!, $email: String!, $password: String!, $role: UserRole!) {
  createUser(name: $name, email: $email, password: $password, role: $role) {
    ...AdminUserDetails
  }
}

mutation AdminUpdateUser($id: ID!, $name: String!, $email: String!, $role: UserRole!) {
  updateUser(id: $id, name: $name, email: $email, role: $role) {
    ...AdminUserDetails
  }
}

mutation AdminDeactivateUser($id: ID!) {
  deactivateUser(id: $id) {
    ...AdminUserDetails
  }
}

mutation AdminReactivateUser($id: ID!) {
  reactivateUser(id: $id) {
    ...AdminUserDetails
  }
}
