<div class="prototype-controls">
  <span>{{ text().prototypeBrowserHint }}</span>
  <button
    pButton
    type="button"
    severity="secondary"
    [outlined]="true"
    [disabled]="busy()"
    (click)="confirmingReset.set(true)"
  >
    {{ text().prototypeReset }}
  </button>
</div>
<p-dialog
  [header]="text().prototypeResetTitle"
  [visible]="confirmingReset()"
  (visibleChange)="confirmingReset.set($event)"
  [modal]="true"
  [closable]="!busy()"
  [closeOnEscape]="!busy()"
  [draggable]="false"
  [style]="{ width: 'min(30rem, calc(100vw - 2rem))' }"
  appendTo="body"
>
  <p>{{ text().prototypeResetDescription }}</p>
  @if (busy()) {
    <p role="status">{{ text().prototypeResetWaiting }}</p>
  }
  @if (failed()) {
    <p-message severity="error">{{ text().prototypeResetFailed }}</p-message>
  }
  <ng-template #footer>
    <button
      pButton
      type="button"
      severity="secondary"
      [outlined]="true"
      [disabled]="busy()"
      (click)="confirmingReset.set(false)"
    >
      {{ text().cancel }}
    </button>
    <button
      pButton
      type="button"
      [loading]="busy()"
      [disabled]="busy()"
      (click)="resetConfirmed.emit()"
    >
      {{ text().prototypeResetConfirm }}
    </button>
  </ng-template>
</p-dialog>
