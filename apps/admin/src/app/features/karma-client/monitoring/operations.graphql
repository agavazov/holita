fragment KarmaMonitoringSettings on FleetKarmaMonitoringSettings {
  enabled
  statusPollSeconds
  offlineAfterMinutes
  faultHistoryPollMinutes
  faultCommandEnabled
  faultCommandMinutes
  retentionDays
}
fragment KarmaMonitoringEvent on FleetKarmaMonitoringEvent {
  id
  karmaCarId
  kind
  source
  occurredAt
  recordedAt
  code
  spn
  fmi
  faultStatus
  commandOutcome
  operationId
  rawRecord
  details
}
query AdminKarmaMonitoringSettings {
  fleetKarmaMonitoringSettings {
    ...KarmaMonitoringSettings
  }
  fleetSettings {
    timeZone
  }
}
mutation AdminUpdateKarmaMonitoringSettings($input: UpdateFleetKarmaMonitoringSettingsInput!) {
  updateFleetKarmaMonitoringSettings(input: $input) {
    ...KarmaMonitoringSettings
  }
}
query AdminKarmaMonitoringTrucks(
  $offset: Int!
  $limit: Int!
  $search: String
  $filter: FleetKarmaMonitoringTruckFilter
) {
  fleetKarmaMonitoringTrucks(offset: $offset, limit: $limit, search: $search, filter: $filter) {
    onlineTotal
    noDataTotal
    withFaultsTotal
    total
    offset
    limit
    items {
      id
      karmaCarId
      displayName
      online
      lastDataAt
      noDataSince
      faults {
        id
      }
      latestFault {
        code
      }
      lastCommandOutcome
      lastCommandRequestedAt
      lastCommandCompletedAt
    }
  }
}
query AdminKarmaMonitoringEvents(
  $offset: Int!
  $limit: Int!
  $search: String
  $filter: FleetKarmaMonitoringEventFilter
) {
  fleetKarmaMonitoringEvents(offset: $offset, limit: $limit, search: $search, filter: $filter) {
    total
    offset
    limit
    items {
      ...KarmaMonitoringEvent
    }
  }
}
