<holita-page-header
  [title]="identity()"
  [eyebrow]="showSourceIdentity() ? text().karmaClient : text().truck"
  [description]="description()"
  [backLink]="['/', language(), 'karma-client', 'cars']"
  [backLabel]="text().backToTrucks"
  [backQueryParams]="returnQuery()"
/>
@if (canNavigate()) {
  <div class="app-context-toolbar">
    <holita-form-field [label]="text().switchTruck" controlId="karma-truck-switcher">
      <p-select
        inputId="karma-truck-switcher"
        [options]="truckOptions()"
        optionLabel="carNumber"
        optionValue="id"
        [ngModel]="carId()"
        (ngModelChange)="switchTruck($event)"
        [filter]="true"
        filterBy="carNumber,id"
        [ariaFilterLabel]="text().switchTruck"
        [ariaLabel]="text().switchTruck"
        [disabled]="truckOptions().length < 2"
        appendTo="body"
      />
    </holita-form-field>
    @if (switcherError()) {
      <p class="app-muted" role="status">{{ text().switcherUnavailable }}</p>
      <button pButton type="button" severity="secondary" (click)="retryTrucks()">
        {{ text().retry }}
      </button>
    }
  </div>
  <nav [attr.aria-label]="text().navigation">
    <ul class="app-route-nav car-navigation" role="list">
      @for (tab of tabs(); track tab.path) {
        <li>
          <a
            #tabLink
            (isActiveChange)="
              $event && tabLink.scrollIntoView({ block: 'nearest', inline: 'nearest' })
            "
            class="app-route-nav__link"
            [routerLink]="destination(tab.path)"
            routerLinkActive="app-route-nav__link--active"
            [routerLinkActiveOptions]="activeMatch"
            ariaCurrentWhenActive="page"
            >{{ tab.label }}</a
          >
        </li>
      }
    </ul>
  </nav>
}
<div class="app-context-toolbar">
  <h2>{{ sectionTitle() }}</h2>
  <div class="app-page-actions">
    @if (canNavigate() && showRefresh()) {
      <button
        pButton
        type="button"
        severity="secondary"
        [disabled]="busy() || refreshDisabled()"
        (click)="refreshRequest.emit()"
      >
        {{ error() ? text().retry : text().refresh }}
      </button>
    }
    <ng-content select="[headerActions]" />
  </div>
</div>
