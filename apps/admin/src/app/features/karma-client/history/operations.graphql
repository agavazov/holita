query AdminKarmaTrips($input: KarmaTripsInput!) {
  karmaTrips(input: $input) {
    cursor
    nextCursor
    hasMore
    items {
      ...KarmaTripFields
    }
  }
}

query AdminKarmaPositionSamples($input: KarmaPositionSamplesInput!) {
  karmaPositionSamples(input: $input) {
    carId
    startMessageId
    stopMessageId
    retrieval
    reason
    sourceClock
    ordering
    positionCoverage
    startMessagePresent
    stopMessagePresent
    loadedRows
    maxRows
    deadlineMs
    duplicateIdsRemoved
    retrievedAt
    samples {
      instantUtc
      event {
        id
        carId
        deviceId
        eventId
        edt
        edtTz
        pdt
        latitude
        longitude
        spd
        odo
        extra
      }
    }
  }
}

query AdminKarmaEvents($input: KarmaEventsInput!) {
  karmaEvents(input: $input) {
    cursor
    nextCursor
    hasMore
    items {
      id
      carId
      deviceId
      eventId
      edt
      edtTz
      pdt
      latitude
      longitude
      spd
      odo
      extra
    }
  }
}

query AdminKarmaDrivingProfile($input: KarmaDrivingProfileInput!) {
  karmaDrivingProfile(input: $input) {
    carId
    carNumber
    deviceId
    categories {
      name
      score
      weight
    }
  }
}

query AdminKarmaDailyReport($input: KarmaDailyReportInput!) {
  karmaDailyReport(input: $input) {
    carId
    car {
      id
      carNumber
      deviceId
      projectId
      timeZoneId
    }
    day
    timeZone {
      id
      name
    }
    fromLocal
    toLocalExclusive
    fromUtc
    toUtcExclusive
    selection
    retrieval
    state
    reason
    pageRequests
    loadedTrips
    trips {
      ...KarmaTripFields
    }
    maxPages
    maxRows
    deadlineMs
    positionCoverage
    retrievedAt
    tripCount {
      ...DailyReportMetric
    }
    totalDistance {
      ...DailyReportMetric
    }
    nightDistance {
      ...DailyReportMetric
    }
    dayDistance {
      ...DailyReportMetric
    }
    maxSpeed {
      ...DailyReportMetric
    }
  }
}

fragment DailyReportMetric on KarmaDailyReportMetric {
  value
  availability
  availableInputs
  requiredInputs
  unit
}

fragment KarmaTripFields on KarmaTrip {
  id
  carId
  carNumber
  deviceId
  driverId
  tripActive
  startMessageId
  startDate
  startLatitude
  startLongitude
  startOdo
  stopMessageId
  stopDate
  stopLatitude
  stopLongitude
  stopOdo
  tripDuration
  tripDistance
  tripDurationNight
  tripDistanceNight
  maxSpeed
  drivingScore
  ecoScore
}
