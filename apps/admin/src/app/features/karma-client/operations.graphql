query AdminKarmaCars {
  karmaCars {
    id
    deviceId
    projectId
    carNumber
    carType
    carYear
    carColor
    timeZoneId
  }
}

query AdminKarmaCar($id: ID!) {
  karmaCar(id: $id) {
    id
    deviceId
    projectId
    carNumber
    carType
    carYear
    carColor
    subType
    timeZoneId
    driverCount
  }
}

query AdminKarmaEdata($input: KarmaEdataInput!) {
  karmaEdata(input: $input) {
    cursor
    hasMore
    nextCursor
    items {
      id
      carId
      deviceId
      carNumber
      eventTimeUtc
      eventTimeLocal
      pdt
      spd
      odo
      latitude
      longitude
      parameters {
        id
        value
        description
      }
    }
  }
}

query AdminKarmaProjects {
  karmaProjects {
    id
    name
  }
}
query AdminKarmaTimeZones {
  karmaTimeZones {
    id
    name
  }
}
query AdminKarmaVersion {
  karmaVersion {
    version
  }
}
query AdminKarmaReferences {
  karmaProjects {
    id
    name
  }
  karmaTimeZones {
    id
    name
  }
}
query AdminKarmaLocation($carId: ID!) {
  karmaLocation(carId: $carId) {
    carId
    deviceId
    carNumber
    messageId
    eventId
    edt
    edtTz
    pdt
    latitude
    longitude
    spd
    odo
    extra
  }
}

query AdminKarmaTrips($input: KarmaTripsInput!) {
  karmaTrips(input: $input) {
    cursor
    nextCursor
    hasMore
    items {
      id
      carId
      carNumber
      deviceId
      driverId
      tripActive
      startMessageId
      startDate
      startLatitude
      startLongitude
      startOdo
      stopMessageId
      stopDate
      stopLatitude
      stopLongitude
      stopOdo
      tripDuration
      tripDistance
      tripDurationNight
      tripDistanceNight
      maxSpeed
      drivingScore
      ecoScore
    }
  }
}

query AdminKarmaEvents($input: KarmaEventsInput!) {
  karmaEvents(input: $input) {
    cursor
    nextCursor
    hasMore
    items {
      id
      carId
      deviceId
      eventId
      edt
      edtTz
      pdt
      latitude
      longitude
      spd
      odo
      extra
    }
  }
}

query AdminKarmaDrivingProfile($input: KarmaDrivingProfileInput!) {
  karmaDrivingProfile(input: $input) {
    carId
    carNumber
    deviceId
    categories {
      name
      score
      weight
    }
  }
}

query AdminKarmaUsers {
  karmaUsers {
    id
    userName
    active
    expireDate
    roleId
    firstName
    lastName
    timeZoneId
    email
    projectId
    projectIds
  }
}
query AdminKarmaRoles {
  karmaRoles {
    id
    description
  }
}
