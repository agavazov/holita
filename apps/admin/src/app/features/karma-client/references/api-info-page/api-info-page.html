<section class="app-view" [attr.aria-label]="text().karmaApiInfo" [attr.aria-busy]="loading()">
  <holita-page-header [title]="text().karmaApiInfo" [eyebrow]="text().karmaAdministrationTitle">
    <button
      headerActions
      pButton
      type="button"
      severity="secondary"
      [disabled]="loading()"
      (click)="refresh()"
    >
      {{ error() ? text().retry : text().refresh }}
    </button>
  </holita-page-header>
  @if (loading()) {
    <p role="status">{{ text().karmaLoadingReferences }}</p>
  }
  @if (error()) {
    <p-message severity="error">{{ text().karmaUnavailable }}</p-message>
  }
  @if (version(); as value) {
    <dl class="app-card app-facts">
      <div>
        <dt>{{ text().karmaApiVersion }}</dt>
        <dd>{{ value }}</dd>
      </div>
    </dl>
  }
</section>
