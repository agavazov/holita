<section class="app-view" [attr.aria-label]="text().karmaRoles" [attr.aria-busy]="loading()">
  <holita-page-header
    [title]="text().karmaRoles"
    [eyebrow]="text().karmaAdministrationTitle"
    [description]="presentationText().readOnly"
  >
    <button
      headerActions
      pButton
      type="button"
      severity="secondary"
      [disabled]="loading()"
      (click)="refresh()"
    >
      {{ error() ? text().retry : text().refresh }}
    </button>
  </holita-page-header>
  <form
    [attr.aria-label]="text().karmaSearch + ': ' + text().karmaRoles"
    class="app-card app-form-section"
    [formGroup]="form"
    (ngSubmit)="applySearch()"
  >
    <div class="app-form-grid">
      <holita-form-field [label]="presentationText().search" controlId="roles-page-search"
        ><input pInputText id="roles-page-search" [formControl]="search"
      /></holita-form-field>
    </div>
    <div class="app-page-actions">
      <button pButton type="submit">{{ text().karmaSearch }}</button>
    </div>
  </form>
  <holita-table-panel
    #panel
    [heading]="text().karmaRoles"
    [view]="view()"
    [total]="loaded() ? filtered().length : null"
    [busy]="loading()"
    [page]="tablePage()"
    [pageSizes]="[25, 50, 100]"
    [emptyTitle]="text().karmaNoReferences"
    [errorText]="text().karmaUnavailable"
    (pageChange)="page($event)"
    (retry)="refresh()"
    (clearFilters)="search.setValue(''); applySearch()"
  >
    <p-table
      [value]="filtered().slice(first(), first() + query().rows)"
      dataKey="id"
      [tableStyle]="{ width: '100%' }"
    >
      <ng-template #header
        ><tr>
          <th scope="col">{{ text().karmaRoleId }}</th>
          <th scope="col">{{ text().karmaRoleDescription }}</th>
        </tr></ng-template
      >
      <ng-template #body let-item
        ><tr>
          <td>{{ item.id }}</td>
          <td>{{ item.description || '—' }}</td>
        </tr></ng-template
      >
      <ng-template #emptymessage
        ><tr>
          <td colspan="2">
            @if (!loading() && !error()) {
              {{ text().karmaNoReferences }}
            }
          </td>
        </tr></ng-template
      >
    </p-table>
  </holita-table-panel>
</section>
