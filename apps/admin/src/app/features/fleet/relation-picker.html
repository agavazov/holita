<div class="relation-control">
  <button
    #trigger
    pButton
    type="button"
    severity="secondary"
    [outlined]="true"
    [id]="controlId()"
    [disabled]="disabled()"
    [attr.aria-label]="label()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="controlId() + '-popup'"
    [attr.aria-invalid]="invalid()"
    (click)="show()"
  >
    {{ selectedLabel() || text().chooseRelation }}
  </button>
  @if (selectedIds().length) {
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [disabled]="disabled()"
      [attr.aria-label]="text().clearRelation + ' ' + label()"
      (click)="clear()"
    >
      {{ text().clearRelation }}
    </button>
  }
</div>
@if (selectedError()) {
  <p-message severity="error">{{ failure() }}</p-message>
  <button pButton type="button" severity="secondary" [text]="true" (click)="retry()">
    {{ text().retry }}
  </button>
}
<p-dialog
  [header]="label()"
  [visible]="open()"
  (visibleChange)="close()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  appendTo="body"
  [id]="controlId() + '-popup'"
  [style]="{ width: 'min(34rem, 94vw)' }"
  [closeAriaLabel]="text().closeConfirmation"
  (onShow)="focusSearch()"
>
  <div class="lookup-search">
    <label [for]="controlId() + '-search'">{{ text().lookupSearch }}</label>
    <input
      #searchElement
      pInputText
      type="search"
      [id]="controlId() + '-search'"
      [ngModel]="search()"
      (ngModelChange)="editSearch($event)"
      [ngModelOptions]="{ standalone: true }"
      [fluid]="true"
    />
  </div>
  @if (error()) {
    <p-message severity="error">{{ failure() }}</p-message
    ><button pButton type="button" [text]="true" (click)="retry()">{{ text().retry }}</button>
  }
  @if (loading()) {
    <p role="status">{{ text().loadingRelations }}</p>
  }
  <p-listbox
    [options]="page().items"
    optionLabel="name"
    optionValue="id"
    [ariaLabel]="label()"
    [ngModel]="selectedIds()[0]"
    (ngModelChange)="select($event)"
    [ngModelOptions]="{ standalone: true }"
    [listStyle]="{ maxHeight: '16rem' }"
    [emptyMessage]="text().noRelations"
  />
  <p-paginator
    [rows]="20"
    [first]="offset()"
    [totalRecords]="page().total"
    [pageLinkSize]="3"
    (onPageChange)="changePage($event)"
    [locale]="language()"
  />
  <ng-template #footer
    ><button pButton type="button" severity="secondary" (click)="close()">
      {{ text().done }}
    </button></ng-template
  >
</p-dialog>
