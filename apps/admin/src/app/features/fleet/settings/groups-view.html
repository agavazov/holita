<holita-page-header
  [eyebrow]="eyebrow()"
  [title]="text().title"
  [count]="view().kind === 'rows' || view().kind === 'rows-error' ? page().total : null"
  [description]="guidance()"
>
  <button headerActions pButton type="button" (click)="create.emit()">{{ text().new }}</button>
</holita-page-header>

<holita-table-panel
  #panel
  [heading]="text().heading"
  [total]="page().total"
  [page]="page()"
  [columns]="columns()"
  [tableMinWidth]="tableMinWidth"
  [view]="view()"
  [errorText]="errorText() ?? text().errorText"
  [busy]="busy()"
  [actionContext]="actionContext()"
  [emptyTitle]="text().emptyTitle"
  [emptyDescription]="text().emptyDescription"
  [actions]="actions()"
  (action)="action.emit($event)"
  (retry)="retry.emit()"
  (pageChange)="pageChange.emit($event)"
>
  <button emptyActions pButton type="button" (click)="create.emit()">{{ text().new }}</button>
  <p-table
    class="app-responsive-table"
    [value]="tableRows()"
    dataKey="id"
    [rowTrackBy]="trackById"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [scrollable]="true"
    [tableStyle]="{ 'min-width': 'var(--app-table-responsive-min-width)' }"
    [pt]="{ tableContainer: { tabindex: '0', 'aria-label': text().heading } }"
  >
    <ng-template #colgroup>
      <colgroup>
        @for (column of columns(); track column.id) {
          <col
            [style.width]="
              column.className === 'app-col-identity'
                ? 'var(--app-table-identity-width, ' + column.width + ')'
                : column.width
            "
            [class]="column.className ?? ''"
          />
        }
      </colgroup>
    </ng-template>
    <ng-template #header>
      <tr>
        <th scope="col" class="app-col-identity">{{ text().name }}</th>
        <th scope="col" class="app-cell-number">{{ text().vehicles }}</th>
        <th scope="col" class="app-col-actions" pFrozenColumn alignFrozen="right">
          <span class="app-visually-hidden">{{ text().actionsColumn }}</span>
        </th>
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td class="app-col-identity">
          <span class="app-cell-identity">
            <span class="app-inline" [title]="row.name">
              <span [class]="'app-dot app-dot--' + row.slot" aria-hidden="true"></span>
              <button
                type="button"
                class="app-link app-cell-truncate"
                [attr.aria-label]="editLabel(row)"
                (click)="panel.run('edit', [recordOf(row)], $event.currentTarget)"
              >
                {{ row.name }}
              </button>
            </span>
            <span [title]="row.description">{{ row.description || '—' }}</span>
          </span>
          <span class="app-table-mobile-actions">
            <holita-row-actions
              [actions]="actions()"
              [record]="recordOf(row)"
              (choose)="panel.run($event.action, [recordOf(row)], $event.origin)"
            />
          </span>
        </td>
        <td class="app-cell-number">{{ row.vehicles | holitaNumber }}</td>
        <td class="app-col-actions" pFrozenColumn alignFrozen="right">
          <holita-row-actions
            [actions]="actions()"
            [record]="recordOf(row)"
            (choose)="panel.run($event.action, [recordOf(row)], $event.origin)"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</holita-table-panel>
<p class="app-muted">{{ text().inUse }}</p>
