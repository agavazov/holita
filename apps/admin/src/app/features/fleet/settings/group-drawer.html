<holita-route-drawer
  [title]="title()"
  [saving]="saving()"
  [dirty]="dirty()"
  [state]="state()"
  [errorText]="loadError()"
  [closeLink]="closeLink()"
  (retry)="retry.emit()"
  (closeRequest)="requestClose()"
>
  @if (saveError(); as error) {
    <p-message severity="error">{{ error }}</p-message>
  }
  <form #formElement id="group-form" [formGroup]="form" (ngSubmit)="submit()">
    <section class="app-form-section">
      <holita-form-field
        [label]="text().name"
        controlId="group-name"
        [required]="true"
        [error]="errorOf('name')"
      >
        <input
          pInputText
          id="group-name"
          formControlName="name"
          [invalid]="!!errorOf('name')"
          [attr.aria-invalid]="errorOf('name') ? 'true' : null"
          aria-describedby="group-name-hint group-name-error"
        />
      </holita-form-field>
      <holita-form-field
        [label]="text().color"
        controlId="group-slot"
        [hint]="text().colorHint"
        [error]="errorOf('slot')"
      >
        <p-select
          inputId="group-slot"
          formControlName="slot"
          [options]="slotOptions()"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [ariaLabel]="text().color"
          [invalid]="!!errorOf('slot')"
          [pt]="{
            label: {
              'aria-invalid': errorOf('slot') ? 'true' : null,
              'aria-describedby': 'group-slot-hint group-slot-error',
            },
          }"
        >
          <ng-template #selectedItem let-option>
            <span class="app-inline">
              <span [class]="'app-dot app-dot--' + option.value"></span>{{ option.label }}
            </span>
          </ng-template>
          <ng-template #item let-option>
            <span class="app-inline">
              <span [class]="'app-dot app-dot--' + option.value"></span>{{ option.label }}
            </span>
          </ng-template>
        </p-select>
      </holita-form-field>
      <holita-form-field
        [label]="text().descriptionLabel"
        controlId="group-description"
        [error]="errorOf('description')"
      >
        <textarea
          pTextarea
          id="group-description"
          formControlName="description"
          rows="3"
          [invalid]="!!errorOf('description')"
          [attr.aria-invalid]="errorOf('description') ? 'true' : null"
          aria-describedby="group-description-hint group-description-error"
        ></textarea>
      </holita-form-field>
    </section>
  </form>

  <div drawerFooter class="app-drawer-actions">
    <button
      pButton
      type="button"
      severity="secondary"
      [outlined]="true"
      [disabled]="saving()"
      (click)="close()"
    >
      {{ text().cancel }}
    </button>
    <button pButton type="submit" form="group-form" [loading]="saving()" [disabled]="saving()">
      {{ group() ? text().save : text().create }}
    </button>
  </div>
</holita-route-drawer>
