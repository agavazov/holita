fragment AdminFleetSettings on FleetSettings {
  timeZone
  dateFormat
  notificationRetentionDays
  distanceUnit
  volumeUnit
  lowFuelPct
  notReportingHours
  speedLimitKph
}

query AdminFleetPreferences {
  fleetSettings {
    ...AdminFleetSettings
  }
}

mutation AdminUpdateFleetSettings($input: UpdateFleetSettingsInput!) {
  updateFleetSettings(input: $input) {
    ...AdminFleetSettings
  }
}

mutation AdminUpdateBranchName($id: ID!, $name: String!) {
  updateBranchName(id: $id, name: $name) {
    id
    name
  }
}
