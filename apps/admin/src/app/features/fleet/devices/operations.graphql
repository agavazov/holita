fragment AdminDevice on FleetDevice {
  id
  branchId
  imei
  vehicleId
  vehicle {
    id
    licensePlate
  }
  createdAt
  updatedAt
}

fragment AdminDeviceDetails on FleetDevice {
  ...AdminDevice
  status
  model
  serialNumber
  options
  firmwareVersion
  edataModule
  simPhoneNumber
  simIccid
  smsPassword
  installedAt
  notes
  lastReportedAt
}

query AdminDevices(
  $offset: Int!
  $limit: Int!
  $search: String
  $ids: [ID!]
  $filter: FleetDeviceFilter
  $sort: FleetDeviceSort
) {
  fleetDevices(
    offset: $offset
    limit: $limit
    search: $search
    ids: $ids
    filter: $filter
    sort: $sort
  ) {
    items {
      ...AdminDeviceDetails
    }
    total
    offset
    limit
  }
}
query AdminDevicesLive($ids: [ID!]!) {
  fleetDevices(ids: $ids, limit: 100) {
    items {
      id
      ermState {
        unitId
        online
        lastFrameAt
        alarmsLast24h
        health {
          overdue
          karmaRoutingWritesLast24h
        }
      }
    }
  }
  fleetKarmaMonitoringTrucks(limit: 100) {
    items {
      id
      karmaDeviceId
      lastDataAt
      online
    }
  }
}
query AdminDevice($id: ID!) {
  fleetDevice(id: $id) {
    ...AdminDeviceDetails
  }
}
mutation AdminCreateDevice($input: CreateFleetDeviceInput!) {
  createFleetDevice(input: $input) {
    ...AdminDeviceDetails
  }
}
mutation AdminUpdateDevice($id: ID!, $input: UpdateFleetDeviceInput!) {
  updateFleetDevice(id: $id, input: $input) {
    ...AdminDeviceDetails
  }
}
query AdminDeviceVehicles($offset: Int!, $limit: Int!, $search: String, $ids: [ID!]) {
  fleetVehicles(
    offset: $offset
    limit: $limit
    search: $search
    ids: $ids
    sort: { field: LICENSE_PLATE, direction: ASC }
  ) {
    items {
      id
      licensePlate
    }
    total
    offset
    limit
  }
}

query AdminDeviceSummary {
  fleetDeviceSummary {
    dataAsOf
    online
    offline
    inStock
  }
}

mutation AdminDeleteDevices($ids: [ID!]!) {
  deleteFleetDevices(ids: $ids) {
    succeededIds
    failures {
      id
      code
      message
    }
  }
}
