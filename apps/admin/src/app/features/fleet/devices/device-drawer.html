<holita-route-drawer
  [title]="title()"
  [subtitle]="modelSubtitle()"
  [saving]="saving()"
  [dirty]="dirty()"
  [state]="state()"
  [errorText]="loadError()"
  [closeLink]="closeLink()"
  (retry)="retry.emit()"
  (closeRequest)="requestClose()"
>
  @if (state() === 'ready') {
    <form #formElement id="device-form" [formGroup]="form" (ngSubmit)="submit()">
      @if (saveError(); as error) {
        <p-message severity="error" role="alert">{{ error }}</p-message>
      }
      @if (choicesError(); as error) {
        <p-message severity="warn"
          >{{ error }}
          <button pButton type="button" (click)="retryChoices.emit()">
            {{ text().retry }}
          </button></p-message
        >
      }
      <section class="app-form-section">
        <h3>{{ text().installation }}</h3>
        <div class="app-form-grid">
          <holita-form-field
            [label]="text().imei"
            controlId="device-imei"
            [hint]="text().imeiHint"
            [required]="true"
            [error]="errorOf('imei')"
          >
            <input
              pInputText
              id="device-imei"
              formControlName="imei"
              inputmode="numeric"
              class="app-mono"
              [invalid]="!!errorOf('imei')"
              [attr.aria-invalid]="errorOf('imei') ? 'true' : null"
              [attr.aria-describedby]="describedBy('imei')"
            />
          </holita-form-field>
          <holita-form-field
            [label]="text().serialNumber"
            controlId="device-serialNumber"
            [hint]="text().serialNumberHint"
            [error]="errorOf('serialNumber')"
          >
            <input
              pInputText
              id="device-serialNumber"
              formControlName="serialNumber"
              class="app-mono"
              [invalid]="!!errorOf('serialNumber')"
              [attr.aria-invalid]="errorOf('serialNumber') ? 'true' : null"
              [attr.aria-describedby]="describedBy('serialNumber')"
            />
          </holita-form-field>
          <holita-form-field
            [label]="text().model"
            controlId="device-model"
            [error]="errorOf('model')"
          >
            <p-select
              inputId="device-model"
              formControlName="model"
              [options]="modelOptions()"
              [showClear]="true"
              optionLabel="label"
              optionValue="value"
              appendTo="body"
              [invalid]="!!errorOf('model')"
              [ariaLabel]="text().model"
              [pt]="{
                label: {
                  'aria-invalid': errorOf('model') ? 'true' : undefined,
                  'aria-describedby': describedBy('model'),
                },
              }"
            />
          </holita-form-field>
          <holita-form-field
            [label]="text().options"
            controlId="device-options"
            [error]="errorOf('options')"
          >
            <p-select
              inputId="device-options"
              formControlName="options"
              [multiple]="true"
              [pt]="multiplePt()"
              [options]="optionChoices()"
              optionLabel="label"
              optionValue="value"
              appendTo="body"
              [ariaLabel]="text().options"
              [invalid]="!!errorOf('options')"
            />
          </holita-form-field>
          <holita-form-field
            [label]="text().firmware"
            controlId="device-firmwareVersion"
            [error]="errorOf('firmwareVersion')"
          >
            <input
              pInputText
              id="device-firmwareVersion"
              formControlName="firmwareVersion"
              [invalid]="!!errorOf('firmwareVersion')"
              [attr.aria-invalid]="errorOf('firmwareVersion') ? 'true' : null"
              [attr.aria-describedby]="describedBy('firmwareVersion')"
            />
          </holita-form-field>
          <holita-form-field
            [label]="text().edataModule"
            controlId="device-edataModule"
            [hint]="text().edataModuleHint"
            [error]="errorOf('edataModule')"
          >
            <input
              pInputText
              id="device-edataModule"
              formControlName="edataModule"
              [invalid]="!!errorOf('edataModule')"
              [attr.aria-invalid]="errorOf('edataModule') ? 'true' : null"
              [attr.aria-describedby]="describedBy('edataModule')"
            />
          </holita-form-field>
          <holita-form-field
            [label]="text().simPhone"
            controlId="device-simPhoneNumber"
            [error]="errorOf('simPhoneNumber')"
          >
            <input
              pInputText
              id="device-simPhoneNumber"
              formControlName="simPhoneNumber"
              [invalid]="!!errorOf('simPhoneNumber')"
              [attr.aria-invalid]="errorOf('simPhoneNumber') ? 'true' : null"
              [attr.aria-describedby]="describedBy('simPhoneNumber')"
            />
          </holita-form-field>
          <holita-form-field
            [label]="text().smsPassword"
            controlId="device-smsPassword"
            [hint]="text().smsPasswordHint"
            [error]="errorOf('smsPassword')"
          >
            <input
              pInputText
              id="device-smsPassword"
              formControlName="smsPassword"
              class="app-mono"
              autocomplete="off"
              [invalid]="!!errorOf('smsPassword')"
              [attr.aria-invalid]="errorOf('smsPassword') ? 'true' : null"
              [attr.aria-describedby]="describedBy('smsPassword')"
            />
          </holita-form-field>
          <holita-form-field
            [label]="text().installedAt"
            controlId="device-installedAt"
            [hint]="installedAtHint()"
            [error]="errorOf('installedAt')"
          >
            <input
              pInputText
              id="device-installedAt"
              type="datetime-local"
              step="0.001"
              formControlName="installedAt"
              [invalid]="!!errorOf('installedAt')"
              [attr.aria-invalid]="errorOf('installedAt') ? 'true' : null"
              [attr.aria-describedby]="describedBy('installedAt')"
            />
          </holita-form-field>
          <holita-form-field
            [label]="text().sim"
            controlId="device-simIccid"
            [hint]="text().simHint"
            [error]="errorOf('simIccid')"
          >
            <input
              pInputText
              id="device-simIccid"
              formControlName="simIccid"
              inputmode="numeric"
              class="app-mono"
              [invalid]="!!errorOf('simIccid')"
              [attr.aria-invalid]="errorOf('simIccid') ? 'true' : null"
              [attr.aria-describedby]="describedBy('simIccid')"
            />
          </holita-form-field>
          <holita-form-field
            [label]="text().vehicle"
            controlId="device-vehicleId"
            [error]="errorOf('vehicleId')"
          >
            <p-select
              inputId="device-vehicleId"
              formControlName="vehicleId"
              [options]="vehicleOptions()"
              optionLabel="name"
              optionValue="id"
              [filter]="true"
              appendTo="body"
              [ariaLabel]="text().vehicle"
              [invalid]="!!errorOf('vehicleId')"
              [pt]="{
                label: {
                  'aria-invalid': errorOf('vehicleId') ? 'true' : undefined,
                  'aria-describedby': describedBy('vehicleId'),
                },
              }"
            />
          </holita-form-field>
          <holita-form-field
            class="app-form-grid--wide"
            [label]="text().notes"
            controlId="device-notes"
            [error]="errorOf('notes')"
            [counter]="{ length: notesLength(), max: 2000 }"
          >
            <textarea
              pTextarea
              id="device-notes"
              formControlName="notes"
              rows="3"
              [invalid]="!!errorOf('notes')"
              [attr.aria-invalid]="errorOf('notes') ? 'true' : null"
              [attr.aria-describedby]="describedBy('notes')"
            ></textarea>
          </holita-form-field>
        </div>
      </section>
    </form>
  }
  @if (state() === 'ready') {
    <div drawerFooter class="app-drawer-actions">
      <button
        pButton
        type="button"
        severity="secondary"
        [outlined]="true"
        [disabled]="saving()"
        (click)="requestClose()"
      >
        {{ text().cancel }}
      </button>
      <button
        pButton
        type="submit"
        form="device-form"
        [loading]="saving()"
        [disabled]="!canEdit() || saving()"
      >
        {{ device() ? text().save : text().create }}
      </button>
    </div>
  }
</holita-route-drawer>
