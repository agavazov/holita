fragment AdminVehicle on FleetVehicle {
  id
  branchId
  licensePlate
  notes
  createdAt
  updatedAt
}

fragment AdminVehicleDetails on FleetVehicle {
  ...AdminVehicle
  fleetNumber
  vehicleType
  make
  model
  modelYear
  vin
  fuelType
  fuelTankCapacityL
  status
  groupId
  group {
    id
    name
    colorToken
  }
  currentDriverId
  currentDriver {
    id
    firstName
    lastName
    status
  }
  deviceCount
  devices {
    id
    imei
    lastReportedAt
  }
  currentWarnings {
    ...AdminWarningLamp
  }
  openAlertCount
  state {
    activity
    lastReportedAt
    latitude
    longitude
    address
    speedKph
    headingDeg
    ignition
    fuelLevelPct
    fuelStatus
    externalVoltage
    backupBatteryVoltage
    engineHours
    coolantTempC
    odometerKm
    odometerRecordedAt
    odometerSource
  }
}

query AdminVehicles(
  $offset: Int!
  $limit: Int!
  $search: String
  $ids: [ID!]
  $filter: FleetVehicleFilter
  $sort: FleetVehicleSort
) {
  fleetVehicles(
    offset: $offset
    limit: $limit
    search: $search
    ids: $ids
    filter: $filter
    sort: $sort
  ) {
    items {
      ...AdminVehicleDetails
    }
    total
    offset
    limit
  }
}
query AdminVehicle($id: ID!) {
  fleetVehicle(id: $id) {
    ...AdminVehicleDetails
  }
}
query AdminVehicleSummary {
  fleetVehicleSummary {
    dataAsOf
  }
}
query AdminVehicleGroups($offset: Int!, $limit: Int!, $search: String, $ids: [ID!]) {
  fleetVehicleGroups(
    offset: $offset
    limit: $limit
    search: $search
    ids: $ids
    sort: { field: NAME, direction: ASC }
  ) {
    items {
      id
      name
    }
    total
    offset
    limit
  }
}
query AdminVehicleDrivers($offset: Int!, $limit: Int!, $search: String, $ids: [ID!]) {
  fleetDrivers(
    offset: $offset
    limit: $limit
    search: $search
    ids: $ids
    sort: { field: LAST_NAME, direction: ASC }
  ) {
    items {
      id
      firstName
      lastName
      status
    }
    total
    offset
    limit
  }
}
mutation AdminCreateVehicle($input: CreateFleetVehicleInput!) {
  createFleetVehicle(input: $input) {
    ...AdminVehicleDetails
  }
}
mutation AdminUpdateVehicle($id: ID!, $input: UpdateFleetVehicleInput!) {
  updateFleetVehicle(id: $id, input: $input) {
    ...AdminVehicleDetails
  }
}
mutation AdminDeleteVehicles($ids: [ID!]!) {
  deleteFleetVehicles(ids: $ids) {
    succeededIds
    failures {
      id
      code
      message
    }
  }
}
mutation AdminDeactivateVehicles($ids: [ID!]!) {
  deactivateFleetVehicles(ids: $ids) {
    succeededIds
    failures {
      id
      code
      message
    }
  }
}

fragment AdminVehicleProfileServiceDetails on FleetServiceTask {
  id
  branchId
  vehicleId
  vehicle {
    id
    licensePlate
    status
  }
  serviceType
  status
  title
  dueOn
  dueOdometerKm
  completedOn
  completedOdometerKm
  workshop
  replacedParts
  costCents
  notes
  urgency
  remainingDays
  remainingKm
  createdAt
  updatedAt
}
fragment AdminVehicleProfileTripDetails on FleetTrip {
  id
  branchId
  vehicleId
  vehicle {
    id
    licensePlate
  }
  driverId
  driver {
    id
    firstName
    lastName
  }
  startedAt
  endedAt
  durationSeconds
  startAddress
  endAddress
  distanceKm
  maxSpeedKph
  fuelUsedL
  drivingScore
  inProgress
  source
  drivingEvents {
    id
    occurredAt
    kind
    severity
    details
  }
}
fragment AdminVehicleProfileAlertDetails on FleetEvent {
  id
  branchId
  vehicleId
  vehicle {
    id
    licensePlate
  }
  driverId
  driver {
    id
    firstName
    lastName
  }
  tripId
  occurredAt
  kind
  severity
  alertStatus
  details
  remark
  acknowledgedAt
  resolvedAt
  address
  measuredValue
  thresholdValue
  measurementUnit
  troubleCode
}
fragment AdminVehicleProfile on FleetVehicle {
  ...AdminVehicleDetails
  devices {
    ...AdminFleetLiveDevice
    ermCommandRequests {
      ...AdminFaultRead
    }
  }
  warningLamps {
    ...AdminWarningLamp
  }
  faultCheck {
    ...AdminFaultCheck
  }
  nextService {
    ...AdminVehicleProfileServiceDetails
  }
}
query AdminVehicleProfile($id: ID!) {
  fleetVehicle(id: $id) {
    ...AdminVehicleProfile
  }
  recordedFaultReports: fleetEvents(
    limit: 1
    filter: { vehicleIds: [$id], kinds: [DIAGNOSTIC_TROUBLE_CODE], actionable: false }
  ) {
    total
  }
  fleetDataClock {
    asOf
    businessDate
    timeZone
  }
  fleetDailyDistance(vehicleId: $id, days: 14) {
    dataAsOf
    points {
      date
      distanceKm
    }
  }
}
query AdminVehicleProfileTrips($vehicleId: ID!, $offset: Int!, $limit: Int!, $sort: FleetTripSort) {
  fleetTrips(offset: $offset, limit: $limit, filter: { vehicleIds: [$vehicleId] }, sort: $sort) {
    items {
      ...AdminVehicleProfileTripDetails
    }
    total
    offset
    limit
    totalDistanceKm
  }
}
query AdminVehicleProfileAlerts($vehicleId: ID!, $offset: Int!, $limit: Int!) {
  fleetEvents(
    offset: $offset
    limit: $limit
    filter: { vehicleIds: [$vehicleId], actionable: true }
    sort: { field: OCCURRED_AT, direction: DESC }
  ) {
    items {
      ...AdminVehicleProfileAlertDetails
    }
    total
    offset
    limit
  }
}
query AdminVehicleProfileService(
  $vehicleId: ID!
  $offset: Int!
  $limit: Int!
  $sort: FleetServiceTaskSort
) {
  fleetServiceTasks(
    offset: $offset
    limit: $limit
    filter: { vehicleIds: [$vehicleId] }
    sort: $sort
  ) {
    items {
      ...AdminVehicleProfileServiceDetails
    }
    total
    offset
    limit
  }
}
query AdminVehicleOdometer($id: ID!) {
  fleetVehicle(id: $id) {
    ...AdminVehicleDetails
  }
  fleetDataClock {
    asOf
    businessDate
    timeZone
  }
}
mutation AdminRecordOdometer($input: RecordFleetOdometerReadingInput!) {
  recordFleetOdometerReading(input: $input) {
    id
    vehicleId
    source
    recordedAt
    odometerKm
  }
}
query AdminVehicleDeviceEvents($vehicleId: ID!) {
  fleetEvents(
    limit: 50
    filter: {
      vehicleIds: [$vehicleId]
      kinds: [DIAGNOSTIC_TROUBLE_CODE, CAN_ERROR, UNIT_ON_BACKUP]
      actionable: false
    }
    sort: { field: OCCURRED_AT, direction: DESC }
  ) {
    total
    items {
      id
      occurredAt
      kind
      severity
      troubleCode
      source
    }
  }
}

query AdminVehiclesLive($ids: [ID!]!) {
  fleetVehicles(ids: $ids, limit: 100) {
    items {
      id
      currentWarnings {
        ...AdminWarningLamp
      }
      devices {
        ...AdminFleetLiveDevice
      }
    }
  }
}

query AdminVehicleEdataMeasurements($vehicleId: ID!, $from: DateTime!, $to: DateTime!) {
  fleetVehicleEdataMeasurements(
    vehicleId: $vehicleId
    from: $from
    to: $to
    parameterIds: [1, 3, 539]
  ) {
    from
    to
    truncated
    items {
      id
      recordedAt
      parameterId
      valueHex
      name
      unit
    }
  }
}

fragment AdminVehicleProblemDetails on FleetProblem {
  id
  sourceKind
  sourceId
  severity
  occurredAt
  state
  requiringAttention
  code
  details
  diagnostics {
    ...AdminFaultDiagnostic
  }
  vehicleId
  deviceId
  deviceImei
  alertId
  fleetEventId
  ermEventId
  commandRequestId
}
fragment AdminVehicleProblemCounts on FleetProblemCounts {
  asOf
  dataAsOf
  ermAsOf
  periodFrom
  periodTo
  total
  requiringAttention
  recorded
  bySeverity {
    severity
    total
    requiringAttention
    recorded
  }
}
query AdminVehicleProfileProblems(
  $vehicleId: ID!
  $offset: Int!
  $limit: Int!
  $sort: FleetProblemSort
) {
  fleetProblems(offset: $offset, limit: $limit, filter: { vehicleIds: [$vehicleId] }, sort: $sort) {
    items {
      ...AdminVehicleProblemDetails
    }
    total
    offset
    limit
    counts {
      ...AdminVehicleProblemCounts
    }
  }
}
query AdminVehiclesProblems($ids: [ID!]!, $offset: Int!, $limit: Int!) {
  fleetProblems(offset: $offset, limit: $limit, filter: { vehicleIds: $ids }) {
    items {
      ...AdminVehicleProblemDetails
    }
    total
    offset
    limit
    counts {
      ...AdminVehicleProblemCounts
    }
  }
}
query AdminVehicleMap($offset: Int!, $limit: Int!) {
  fleetMap(offset: $offset, limit: $limit) {
    asOf
    dataAsOf
    liveAsOf
    items {
      vehicle {
        id
        licensePlate
      }
      position {
        latitude
        longitude
        headingDeg
        speedKph
        recordedAt
        ageSeconds
      }
      connected
      reporting
      live
    }
    total
    offset
    limit
    hasMore
  }
}
query AdminVehicleTrack($vehicleId: ID!, $from: DateTime!, $to: DateTime!) {
  fleetVehicleSamples(vehicleId: $vehicleId, from: $from, to: $to) {
    vehicleId
    from
    to
    truncated
    items {
      id
      recordedAt
      latitude
      longitude
    }
    track {
      asOf
      positionCount
      firstPositionAt
      lastPositionAt
      segments {
        from
        to
        sampleIds
      }
      gaps {
        from
        to
        reason
        thresholdSeconds
      }
    }
  }
}
