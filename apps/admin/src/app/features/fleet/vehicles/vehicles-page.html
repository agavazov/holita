@if (summaryError()) {
  <p-message severity="warn"
    >{{ summaryFailure() }}
    <button pButton type="button" severity="secondary" (click)="refreshSummary()">
      {{ text().profile.retry }}
    </button>
  </p-message>
}
@if (choices.error()) {
  <p-message severity="warn"
    >{{ choicesFailure() }}
    <button pButton type="button" severity="secondary" (click)="choices.load()">
      {{ text().profile.retry }}
    </button>
  </p-message>
}
<holita-vehicles-view
  [branchName]="branch().name"
  [dataAsOf]="summary()?.dataAsOf ?? ''"
  [rows]="rows()"
  [total]="total()"
  [view]="view()"
  [state]="state()"
  [kpis]="summary()"
  [groups]="choices.groups()"
  [drivers]="choices.drivers()"
  [selection]="selected()"
  [busy]="acting() || loading()"
  [profileEnabled]="true"
  [searchError]="searchError()"
  [errorText]="failure()"
  (stateChange)="changeState($event)"
  (create)="openEditor(null)"
  (action)="run($event)"
  (selectionChange)="selected.set($event)"
  (retry)="refresh()"
/>
<router-outlet [routerOutletData]="drawerHost" />
