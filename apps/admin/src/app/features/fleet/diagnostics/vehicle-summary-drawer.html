<holita-route-drawer
  [title]="text().title"
  [subtitle]="subtitle()"
  [closeLink]="null"
  [state]="state()"
  [errorText]="errorText()"
  size="lg"
  (retry)="retry.emit()"
  (closeRequest)="close()"
>
  @if (source() !== 'HOLITA_SCENARIO') {
    <holita-empty-state
      kind="no-telemetry"
      [title]="text().unavailable"
      [description]="text().unavailableHint"
    >
      <a emptyActions pButton severity="secondary" [outlined]="true" [routerLink]="closeLink()">{{
        text().backToList
      }}</a>
    </holita-empty-state>
  } @else if (scenario(); as data) {
    @if (vehicle()) {
      <holita-vehicle-summary
        [scenario]="data"
        [vehicleId]="vehicleId()"
        [language]="language()"
        [conditions]="periodConditions()"
        [logLink]="logLink"
        [faultLink]="faultLink"
        [riskLink]="riskLink"
      />
    }
  }
  <a drawerFooter pButton severity="secondary" [outlined]="true" [routerLink]="closeLink()">{{
    backLabel()
  }}</a>
</holita-route-drawer>
