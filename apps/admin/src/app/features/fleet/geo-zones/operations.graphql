query AdminGeoZones {
  fleetGeoZones {
    id
    name
    points {
      latitude
      longitude
    }
  }
  fleetVehicles(offset: 0, limit: 100) {
    items {
      id
      licensePlate
    }
  }
}

query AdminGeoZoneEvents($offset: Int!, $limit: Int!, $filter: FleetGeoZoneEventFilter) {
  fleetGeoZoneEvents(offset: $offset, limit: $limit, filter: $filter) {
    total
    offset
    limit
    items {
      id
      kind
      occurredAt
      latitude
      longitude
      zone {
        id
        name
      }
      vehicle {
        id
        licensePlate
      }
    }
  }
}

mutation AdminCreateGeoZone($input: FleetGeoZoneInput!) {
  createFleetGeoZone(input: $input) {
    id
  }
}

mutation AdminUpdateGeoZone($id: ID!, $input: FleetGeoZoneInput!) {
  updateFleetGeoZone(id: $id, input: $input) {
    id
  }
}

mutation AdminDeleteGeoZone($id: ID!) {
  deleteFleetGeoZone(id: $id) {
    id
  }
}
