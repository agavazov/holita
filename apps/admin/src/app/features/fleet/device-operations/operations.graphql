fragment AdminDeviceConfigurationOperation on FleetDeviceOperation {
  id
  branchId
  karmaCarId
  karmaDeviceId
  kind
  phase
  baselineOperationId
  parameterBaselineOperationId
  ruleId
  ruleExpression
  ruleTrueEventId
  ruleFalseEventId
  ruleDebounceMilliseconds
  parameterId
  intervalSeconds
  previousIntervalSeconds
  catalogId
  profileId
  writeDispatchedAt
  writeUncertain
  status
  requestedAt
  dispatchedAt
  completedAt
  nextCheckAt
  deadlineAt
  errorCode
  queueIds
  observationCount
  coverageComplete
  rulesConfiguration {
    configurationId
    rules {
      ruleId
      trueEventId
      falseEventId
      debounceMilliseconds
      activateDashboard
      definitionHex
      expression
      parameterIds
    }
  }
  configuration {
    configurationId
    parameters {
      parameterId
      intervalSeconds
      definitionHex
    }
  }
}

query AdminDeviceConfigurationPage($karmaCarId: ID!, $expectedKarmaDeviceId: String!) {
  fleetDeviceOperationsEnabled
  fleetDeviceConfigurationWritesEnabled
  fleetDeviceParameterPresets {
    catalogId
    catalogLabel
    parameterId
    name
    profileIds
  }
  fleetDeviceOperations(karmaCarId: $karmaCarId, expectedKarmaDeviceId: $expectedKarmaDeviceId) {
    ...AdminDeviceConfigurationOperation
  }
  fleetDeviceRulesSnapshot(karmaCarId: $karmaCarId, expectedKarmaDeviceId: $expectedKarmaDeviceId) {
    ...AdminDeviceConfigurationOperation
  }
  fleetDeviceConfigurationSnapshot(
    karmaCarId: $karmaCarId
    expectedKarmaDeviceId: $expectedKarmaDeviceId
  ) {
    ...AdminDeviceConfigurationOperation
  }
}

mutation AdminRequestDeviceConfigurationRead($input: RequestFleetDeviceConfigurationReadInput!) {
  requestFleetDeviceConfigurationRead(input: $input) {
    ...AdminDeviceConfigurationOperation
  }
}

mutation AdminRequestDeviceParameterAddition($input: RequestFleetDeviceParameterAdditionInput!) {
  requestFleetDeviceParameterAddition(input: $input) {
    ...AdminDeviceConfigurationOperation
  }
}

mutation AdminRequestDeviceParameterIntervalUpdate(
  $input: RequestFleetDeviceParameterIntervalUpdateInput!
) {
  requestFleetDeviceParameterIntervalUpdate(input: $input) {
    ...AdminDeviceConfigurationOperation
  }
}

mutation AdminRequestDeviceRulesRead($input: RequestFleetDeviceRulesReadInput!) {
  requestFleetDeviceRulesRead(input: $input) {
    ...AdminDeviceConfigurationOperation
  }
}
mutation AdminRequestDeviceRuleChange($input: RequestFleetDeviceRuleChangeInput!) {
  requestFleetDeviceRuleChange(input: $input) {
    ...AdminDeviceConfigurationOperation
  }
}
