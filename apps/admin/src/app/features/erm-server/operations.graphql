fragment AdminErmEventFields on ErmEvent {
  id
  frameId
  unitId
  eventId
  eventTime
  positionTime
  latitude
  longitude
  speedKmh
  heading
  odometer
  engineOn
  mainVoltage
  backupVoltage
  fields
}
query AdminErmUnits($input: ErmUnitsInput) {
  ermUnits(input: $input) {
    cursor
    nextCursor
    hasMore
    items {
      unitId
      connected
      mode
      peer
      connectedSince
      lastFrameAt
      latestEvent {
        ...AdminErmEventFields
      }
    }
  }
}
query AdminErmEvents($input: ErmHistoryInput!) {
  ermEvents(input: $input) {
    cursor
    nextCursor
    hasMore
    items {
      ...AdminErmEventFields
    }
  }
}
query AdminErmFrames($input: ErmHistoryInput!) {
  ermFrames(input: $input) {
    cursor
    nextCursor
    hasMore
    items {
      id
      connectionId
      unitId
      direction
      receivedAt
      command
      reference
      checksum
      partial
      displayText
    }
  }
}
query AdminErmCommands($input: ErmHistoryInput!) {
  ermCommands(input: $input) {
    cursor
    nextCursor
    hasMore
    items {
      id
      unitId
      connectionId
      reference
      command
      fields
      status
      sentAt
      answeredAt
      resultCode
      responseText
    }
  }
}
