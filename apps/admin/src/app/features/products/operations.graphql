fragment AdminProduct on Product {
  id
  storeId
  name
  sku
  status
}

query AdminProducts(
  $offset: Int! = 0
  $limit: Int! = 20
  $search: String
  $sku: String
  $status: ProductStatus
  $sort: ProductSort
) {
  products(
    offset: $offset
    limit: $limit
    search: $search
    sku: $sku
    status: $status
    sort: $sort
  ) {
    items {
      ...AdminProduct
    }
    total
    offset
    limit
  }
}

query AdminProduct($id: ID!) {
  product(id: $id) {
    ...AdminProduct
  }
}

mutation AdminCreateProduct($input: CreateProductInput!) {
  createProduct(input: $input) {
    ...AdminProduct
  }
}

mutation AdminUpdateProduct($id: ID!, $input: UpdateProductInput!) {
  updateProduct(id: $id, input: $input) {
    ...AdminProduct
  }
}

mutation AdminDeleteProduct($id: ID!) {
  deleteProduct(id: $id) {
    ...AdminProduct
  }
}
