extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@external", "@requires"])

scalar ErmJSON

enum ErmSessionMode {
  MIRROR
  PRIMARY
}
enum ErmFrameDirection {
  DEVICE
  UPSTREAM
  HOLITA
}
enum ErmFrameChecksum {
  OK
  MISMATCH
  ABSENT
}
enum ErmCommandState {
  SENT
  ANSWERED
  TIMEOUT
  FAILED
}
"Event groups of the StarLink event catalog."
enum ErmEventCategory {
  "Periodic and on-change location reports."
  POSITION
  "Ignition, inputs, driving and other status changes."
  STATUS
  "Unit alarms: diagnostic report, power, backup battery, jamming, removal and SIM events."
  ALARM
  "eData and vehicle diagnostic payloads."
  EDATA
  "Event IDs outside the catalog."
  OTHER
}
enum ErmEventSeverity {
  INFO
  WARNING
  CRITICAL
}
enum ErmLanguage {
  BG
  EN
}
"Allowlisted reads an operator may send to a unit."
enum ErmDeviceAction {
  "Current position."
  REQUEST_LOCATION
  "Unit status."
  READ_STATUS
  "Firmware and module versions."
  READ_VERSION
  "Connected accessories."
  READ_ACCESSORIES
  "eData communication diagnostics."
  READ_EDATA_DIAGNOSTICS
  "eData fault logger."
  READ_EDATA_FAULTS
}
input ErmUnitsInput {
  pageSize: Int = 50
  cursor: String
}
input ErmHistoryInput {
  unitId: ID!
  pageSize: Int = 50
  cursor: String
}
input ErmDeviceEventsInput {
  pageSize: Int = 50
  cursor: String
  "Only these categories; every category when omitted."
  categories: [ErmEventCategory!]
}
input ErmDevicePageInput {
  pageSize: Int = 50
  cursor: String
}
input SendErmDeviceCommandInput {
  "A Fleet Device of the active Branch."
  deviceId: ID!
  action: ErmDeviceAction!
}
type ErmUnit {
  unitId: ID!
  connected: Boolean!
  mode: ErmSessionMode
  peer: String!
  connectedSince: String
  lastFrameAt: String
  latestEvent: ErmEvent
}
type ErmEvent {
  id: ID!
  frameId: ID!
  unitId: ID!
  eventId: String
  eventTime: String
  positionTime: String
  latitude: Float
  longitude: Float
  speedKmh: Float
  heading: Float
  odometer: Float
  engineOn: Boolean
  mainVoltage: Float
  backupVoltage: Float
  fields: ErmJSON!
  category: ErmEventCategory!
  severity: ErmEventSeverity!
  "Catalog name of the event; null for an event ID outside the StarLink catalog."
  name(language: ErmLanguage! = EN): String
}
"Live state of a unit on holita's device server."
type ErmUnitState {
  unitId: ID!
  "The unit has an open connection to holita now."
  online: Boolean!
  mode: ErmSessionMode
  connectedSince: String
  lastFrameAt: String
  "Latest decoded event with a position."
  lastPosition: ErmEvent
  "Latest decoded event of any category."
  latestEvent: ErmEvent
  "ALARM events in the last 24 hours."
  alarmsLast24h: Int!
  latestAlarm: ErmEvent
}
type ErmFrame {
  id: ID!
  connectionId: ID!
  unitId: ID
  direction: ErmFrameDirection!
  receivedAt: String!
  command: String
  reference: String
  checksum: ErmFrameChecksum!
  partial: Boolean!
  displayText: String!
}
type ErmCommand {
  id: ID!
  unitId: ID!
  connectionId: ID!
  reference: String!
  command: String!
  fields: [String!]!
  status: ErmCommandState!
  sentAt: String!
  answeredAt: String
  resultCode: String
  responseText: String
}
type ErmUnitsPage {
  items: [ErmUnit!]!
  cursor: String
  nextCursor: String
  hasMore: Boolean!
}
type ErmEventsPage {
  items: [ErmEvent!]!
  cursor: String
  nextCursor: String
  hasMore: Boolean!
}
type ErmFramesPage {
  items: [ErmFrame!]!
  cursor: String
  nextCursor: String
  hasMore: Boolean!
}
type ErmCommandsPage {
  items: [ErmCommand!]!
  cursor: String
  nextCursor: String
  hasMore: Boolean!
}
"Fleet's Device, resolved by its IMEI on holita's device server."
type FleetDevice @key(fields: "id") {
  id: ID!
  imei: String! @external
  "Null when the unit has never connected to holita."
  ermState: ErmUnitState @requires(fields: "imei")
  ermEvents(input: ErmDeviceEventsInput): ErmEventsPage! @requires(fields: "imei")
  ermCommands(input: ErmDevicePageInput): ErmCommandsPage! @requires(fields: "imei")
  ermFrames(input: ErmDevicePageInput): ErmFramesPage! @requires(fields: "imei")
}
type Query {
  ermUnits(input: ErmUnitsInput): ErmUnitsPage!
  ermEvents(input: ErmHistoryInput!): ErmEventsPage!
  ermFrames(input: ErmHistoryInput!): ErmFramesPage!
  ermCommands(input: ErmHistoryInput!): ErmCommandsPage!
}
type Mutation {
  "Sends an allowlisted read to the unit of a Fleet Device in the active Branch and returns the recorded command."
  sendErmDeviceCommand(input: SendErmDeviceCommandInput!): ErmCommand!
}
