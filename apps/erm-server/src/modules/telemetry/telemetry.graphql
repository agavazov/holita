extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@external", "@requires"])

scalar ErmJSON
scalar DateTime

enum ErmSessionMode {
  MIRROR
  PRIMARY
}
enum ErmFrameDirection {
  DEVICE
  UPSTREAM
  HOLITA
}
enum ErmFrameChecksum {
  OK
  MISMATCH
  ABSENT
}
enum ErmCommandState {
  SENT
  ANSWERED
  TIMEOUT
  FAILED
}
enum ErmCommandRequestStatus {
  QUEUED
  SUBMITTING
  ANSWERED
  FAILED
  EXPIRED
  CANCELLED
  UNCERTAIN
}
type ErmCommandRequest {
  id: ID!
  deviceId: ID!
  unitId: ID!
  actorId: String!
  cancelledByActorId: String
  batchId: ID
  batchIndex: Int
  retryOfId: ID
  waitingReason: ErmCommandWaitingReason
  waitingSince: DateTime
  intent: String!
  action: ErmDeviceAction!
  "Stable code for purpose translation; intent remains the operator's original text."
  actionCode: String!
  displayParameters: ErmCommandDisplayParameters!
  requestedAt: DateTime!
  queuedAt: DateTime!
  submittingAt: DateTime
  sentAt: DateTime
  answeredAt: DateTime
  failedAt: DateTime
  expiredAt: DateTime
  cancelledAt: DateTime
  uncertainAt: DateTime
  "A transport acknowledgement is not independent verification of execution."
  outcomeCode: String!
  reasonCode: String
  transportCommand: ErmCommand
  "Related verification only when a stored configuration step references this transport command."
  configurationVerification: ErmConfigurationChange
  "Exact captured outbound frame; null when unavailable."
  sentFrame: ErmFrame
  "Exact transport response bytes, encoded as hexadecimal; responseText remains readable evidence."
  receivedFrameHex: String
  status: ErmCommandRequestStatus!
  createdAt: DateTime!
  expiresAt: DateTime!
  submittedAt: DateTime
  completedAt: DateTime
  commandId: ID
  resultCode: String
  responseText: String
  failureReason: String
}
enum ErmCommandWaitingReason {
  GATEWAY_UNAVAILABLE
  FLEET_VERIFICATION_UNAVAILABLE
  UNIT_NOT_CONNECTED
}
input ErmCommandRequestsFilter {
  statuses: [ErmCommandRequestStatus!]
  actions: [ErmDeviceAction!]
  deviceIds: [ID!]
  imeis: [String!]
  actorId: String
  createdFrom: DateTime
  createdTo: DateTime
}
type ErmCommandRequestsPage {
  items: [ErmCommandRequest!]!
  total: Int!
  offset: Int!
  limit: Int!
}
input RetryErmDeviceCommandInput {
  requestId: ID!
  expiresInSeconds: Int = 7200
  intent: String
}
input StartErmCommandBatchInput {
  deviceIds: [ID!]!
  action: ErmDeviceAction!
  expiresInSeconds: Int = 7200
  intent: String
}
type ErmCommandRequestCount {
  status: ErmCommandRequestStatus!
  count: Int!
}
type ErmCommandBatch {
  id: ID!
  actorId: String!
  action: ErmDeviceAction!
  createdAt: DateTime!
  stoppedAt: DateTime
  stoppedByActorId: String
  counts: [ErmCommandRequestCount!]!
  "Requests in the selected Device order, dispatched one at a time."
  requests: [ErmCommandRequest!]!
}
"Display facts for the six existing allowlisted read actions; no arbitrary protocol input."
type ErmCommandDisplayParameters {
  expiresInSeconds: Int!
  requestedFields: [ErmCommandDisplayField!]!
}
enum ErmCommandDisplayField {
  IGNITION
  ENGINE
  VIN
  MAIN_VOLTAGE
  SIGNAL_QUALITY
  JAMMING
  FIRMWARE_VERSION
}
"A confirmation linked by the original transport command reference."
type ErmCommandAcknowledgement {
  "The Branch-scoped operator request, when this confirmation belongs to one."
  commandRequestId: ID
  commandId: ID!
  commandReference: String!
  replyReference: String!
  resultCode: String!
  receivedAt: DateTime!
}
input CancelErmDeviceCommandInput {
  deviceId: ID!
  requestId: ID!
}
enum ErmRecoveryOutcome {
  ALREADY_HOLITA
  NEEDS_OPERATOR
}
"Result of a read-only configuration session on the fixed recovery listener."
type ErmRecoverySession {
  id: ID!
  startedAt: DateTime!
  finishedAt: DateTime!
  outcome: ErmRecoveryOutcome!
  reason: String!
  primaryHost: String
  primaryPort: String
}
"Progress of a unit's stored parameter read."
enum ErmParameterSnapshotStatus {
  RUNNING
  COMPLETE
  FAILED
}
enum ErmParameterReadOutcome {
  READ
  REJECTED
  OMITTED
}
enum ErmConfigurationOperation {
  READ_EDATA
  INTERVAL
  ADD_DEFINITION
  GLOBALS
  PARAMETER
  PARAMETERS
}
enum ErmConfigurationChangeStatus {
  RUNNING
  READ
  VERIFIED
  MISMATCH
  RESTORED
  RESTORE_FAILED
  UNCERTAIN
  REFUSED
  FAILED
}
input StartErmEdataChangeInput {
  deviceId: ID!
  read: Boolean
  parameterId: Int
  intervalSeconds: Int
  definitionHex: String
  globalsHex: String
  restoreAfter: Boolean = false
}
input StartErmParameterChangeInput {
  deviceId: ID!
  parameter: String!
  value: String!
  restoreAfter: Boolean = false
}
input ErmParameterWriteInput {
  parameter: String!
  value: String!
}
input StartErmParametersChangeInput {
  deviceId: ID!
  parameters: [ErmParameterWriteInput!]!
  restoreAfter: Boolean = false
}
input StartErmParameterBatchInput {
  deviceIds: [ID!]!
  parameters: [ErmParameterWriteInput!]!
  restoreAfter: Boolean = false
}
"Sequential verified parameter workflows, retained in the command batch audit."
type ErmConfigurationBatch {
  id: ID!
  actorId: String!
  createdAt: DateTime!
  finishedAt: DateTime
  stoppedAt: DateTime
  stoppedByActorId: String
  "Every selected Device has a run; unattempted runs are refused after a stop."
  changes: [ErmConfigurationChange!]!
}
type ErmConfigurationChange {
  id: ID!
  unitId: ID!
  actorId: String
  intent: String
  parameter: Int
  operation: ErmConfigurationOperation!
  parameters: [Int!]!
  batchId: ID
  batchIndex: Int
  status: ErmConfigurationChangeStatus!
  startedAt: DateTime!
  finishedAt: DateTime
  failureReason: String
  baseline: ErmJSON!
  intended: String
  steps: ErmJSON!
  stepDetails: [ErmConfigurationStep!]!
}
"Typed view of a retained verification step; raw steps are kept for compatibility."
type ErmConfigurationStep {
  name: String!
  at: DateTime!
  outcome: String!
  outcomeCode: String!
  commandId: ID
  transportCommand: ErmCommand
  payload: String
  configuration: ErmJSON
}
"Event groups of the StarLink event catalog."
enum ErmEventCategory {
  "Periodic and on-change location reports."
  POSITION
  "Ignition, inputs, driving and other status changes."
  STATUS
  "Unit alarms: diagnostic report, power, backup battery, jamming, removal and SIM events."
  ALARM
  "eData and vehicle diagnostic payloads."
  EDATA
  "Event IDs outside the catalog."
  OTHER
}
enum ErmEventSeverity {
  INFO
  WARNING
  CRITICAL
}
enum ErmLanguage {
  BG
  EN
}
"Allowlisted reads an operator may send to a unit."
enum ErmDeviceAction {
  "Current position."
  REQUEST_LOCATION
  "Unit status."
  READ_STATUS
  "Firmware and module versions."
  READ_VERSION
  "Connected accessories."
  READ_ACCESSORIES
  "eData communication diagnostics."
  READ_EDATA_DIAGNOSTICS
  "eData fault logger."
  READ_EDATA_FAULTS
}
enum ErmEventSortField {
  TIME
  EVENT_TYPE
  STATUS
}
enum ErmEventSortDirection {
  ASC
  DESC
}
input ErmEventSort {
  field: ErmEventSortField! = TIME
  direction: ErmEventSortDirection! = DESC
}
input ErmDeviceEventsInput {
  pageSize: Int = 50
  cursor: String
  "Only these categories; every category when omitted."
  categories: [ErmEventCategory!]
  "Only these severity statuses; every status when omitted."
  severities: [ErmEventSeverity!]
  "Applied before cursor pagination; defaults to newest first."
  sort: ErmEventSort
}
input ErmDevicePageInput {
  pageSize: Int = 50
  cursor: String
}
input SendErmDeviceCommandInput {
  "A Fleet Device of the active Branch."
  deviceId: ID!
  action: ErmDeviceAction!
  expiresInSeconds: Int = 7200
  intent: String
}
input StartErmParameterSnapshotInput {
  "A Fleet Device of the active Branch, connected in primary mode."
  deviceId: ID!
}
"One parameter read; protected values are masked for Viewers."
type ErmParameterValue {
  parameter: Int!
  "Title from the archived StarLink parameter catalog."
  title: String
  "Unquoted unit value, or null when the unit did not return a value."
  value: String
  "Unit error result code when an individual read was rejected."
  resultCode: String
  outcome: ErmParameterReadOutcome!
}
"A captured value differing from the unit's previous COMPLETE snapshot."
type ErmParameterChange {
  parameter: Int!
  title: String
  previousValue: String
  value: String
}
"Sequential reads of the unit's catalog parameters, excluding routing 0049–0054."
type ErmParameterSnapshot {
  id: ID!
  unitId: ID!
  actorId: String
  intent: String
  status: ErmParameterSnapshotStatus!
  startedAt: DateTime!
  finishedAt: DateTime
  "Number of catalog parameters planned for this snapshot."
  parameterCount: Int!
  "Number of parameters with a stored value or read outcome."
  readCount: Int!
  failureReason: String
  "Captured values; protected values are masked for Viewers."
  values: [ErmParameterValue!]!
  "Parameters unread in this or the previous COMPLETE snapshot, excluded from changes."
  unreadParameters: [Int!]!
  "Changes among values read in both snapshots; empty without a previous COMPLETE snapshot."
  changes: [ErmParameterChange!]!
}
type ErmEvent {
  id: ID!
  frameId: ID!
  unitId: ID!
  eventId: String
  eventTime: DateTime
  positionTime: DateTime
  latitude: Float
  longitude: Float
  speedKmh: Float
  heading: Float
  odometer: Float
  engineOn: Boolean
  "Ignition from the event's #IGN# token: binary Tracker flags or a text structure that reports it."
  ignitionOn: Boolean
  mainVoltage: Float
  backupVoltage: Float
  fields: ErmJSON!
  category: ErmEventCategory!
  severity: ErmEventSeverity!
  "Catalog name, including the documented diagnostic meaning and raw level/code for event 02."
  name(language: ErmLanguage! = EN): String
  "Decoded Simple eData report of an External device (33) event, with its raw payload; null otherwise."
  edata: ErmJSON
}
"A numeric unit reading and the time it was observed."
type ErmReading {
  "Observed numeric value."
  value: Float!
  "Event time, or the frame receipt time when the event has no time."
  observedAt: DateTime!
}
"A text unit reading and the time its command was answered."
type ErmTextReading {
  "Observed text value."
  value: String!
  "Time the command response was received."
  observedAt: DateTime!
}
"Latest reported bytes for one parameter from eData 405; no physical conversion is assumed."
type ErmEdataMeasurement {
  parameterId: Int!
  "Monitor 9.56 name; null for an unknown ID or conflicting catalog names."
  name: String
  "Explicit unit suffix in the catalog name, for reference; null when unspecified."
  unit: String
  parameterType: Int!
  valueSize: Int!
  valueHex: String!
  "Report event time, or frame receipt time when the report has no time."
  observedAt: DateTime!
}
"A complete-device-frame gap, clipped to the last 24 hours."
type ErmDataGap {
  from: DateTime!
  to: DateTime!
  durationSeconds: Int!
  "Reporting interval known when the gap began."
  expectedIntervalSeconds: Int!
}
"A network-change event or a change to an observed network/operator field."
type ErmNetworkChange {
  "Frame receipt time."
  at: DateTime!
  networkType: String
  operatorCode: String
}
"Frame freshness, connection history and upstream routing activity."
type ErmUnitHealth {
  "Seconds since the latest complete device frame; null when none was received."
  lastFrameAgeSeconds: Int
  "Expected reporting interval: 300 seconds driving, 3600 seconds parked."
  expectedIntervalSeconds: Int!
  "No frame has arrived within twice the expected reporting interval."
  overdue: Boolean!
  "Receipt gaps longer than twice the known reporting interval, including an ongoing gap."
  gapsLast24h: [ErmDataGap!]!
  "Event 23 or an observed network/operator value change; missing fields do not count."
  networkChangesLast24h: Int!
  latestNetworkChange: ErmNetworkChange
  "Reason for the latest closed device connection."
  lastCloseReason: String
  "Time of the latest closed device connection."
  lastClosedAt: DateTime
  "Upstream disconnects recorded during the last 24 hours."
  upstreamClosesLast24h: Int!
  "Upstream 04/46 frames writing routing parameters 0049–0054 during the last 24 hours."
  karmaRoutingWritesLast24h: Int!
  "Latest upstream frame writing a routing parameter 0049–0054."
  latestKarmaRoutingWrite: ErmFrame
}
"Live state of a unit on holita's device server."
type ErmUnitState {
  unitId: ID!
  "The unit has an open connection to holita now."
  online: Boolean!
  mode: ErmSessionMode
  connectedSince: DateTime
  lastFrameAt: DateTime
  "Latest completed read-only backup recovery session; queue acceptance alone is not recovery."
  recovery: ErmRecoverySession
  "Latest decoded event with a position."
  lastPosition: ErmEvent
  "Latest decoded event of any category."
  latestEvent: ErmEvent
  "ALARM events in the last 24 hours."
  alarmsLast24h: Int!
  latestAlarm: ErmEvent
  "Latest observed main supply voltage, in volts."
  mainVoltage: ErmReading
  "Latest observed backup battery voltage, in volts."
  backupVoltage: ErmReading
  "Latest numeric cellular signal quality (#CSS#)."
  signalQuality: ErmReading
  "Latest firmware VER field returned by an answered READ_VERSION command."
  firmwareVersion: ErmTextReading
  "Newest 405 measurement per parameter, each retaining its own report time. Empty without decoded 405 values."
  edataMeasurements: [ErmEdataMeasurement!]!
  "Frame freshness, disconnect history and upstream route changes."
  health: ErmUnitHealth!
}
type ErmFrame {
  "Exact captured device confirmation linked to its original command and scoped request."
  acknowledgement: ErmCommandAcknowledgement
  id: ID!
  connectionId: ID!
  unitId: ID
  direction: ErmFrameDirection!
  receivedAt: DateTime!
  command: String
  reference: String
  checksum: ErmFrameChecksum!
  partial: Boolean!
  displayText: String!
  rawHex: String!
}
type ErmCommand {
  acknowledgement: ErmCommandAcknowledgement
  responseHex: String
  id: ID!
  unitId: ID!
  connectionId: ID!
  reference: String!
  command: String!
  fields: [String!]!
  status: ErmCommandState!
  sentAt: DateTime!
  answeredAt: DateTime
  resultCode: String
  responseText: String
}
type ErmEventsPage {
  items: [ErmEvent!]!
  cursor: String
  nextCursor: String
  hasMore: Boolean!
}
type ErmFramesPage {
  items: [ErmFrame!]!
  cursor: String
  nextCursor: String
  hasMore: Boolean!
}
type ErmCommandsPage {
  items: [ErmCommand!]!
  cursor: String
  nextCursor: String
  hasMore: Boolean!
}
"Newest-first snapshot history for one Fleet Device."
type ErmParameterSnapshotsPage {
  items: [ErmParameterSnapshot!]!
  cursor: String
  nextCursor: String
  hasMore: Boolean!
}
"Fleet's Device, resolved by its IMEI on holita's device server."
type FleetDevice @key(fields: "id") {
  id: ID!
  imei: String! @external
  "Null when the unit has never connected to holita."
  ermState: ErmUnitState @requires(fields: "imei")
  ermEvents(input: ErmDeviceEventsInput): ErmEventsPage! @requires(fields: "imei")
  ermCommands(input: ErmDevicePageInput): ErmCommandsPage! @requires(fields: "imei")
  ermFrames(input: ErmDevicePageInput): ErmFramesPage! @requires(fields: "imei")
  "Parameter snapshot history for this Branch's Device; Viewer secrets are masked."
  ermParameterSnapshots(input: ErmDevicePageInput): ErmParameterSnapshotsPage!
    @requires(fields: "imei")
  "Newest twenty controlled configuration runs for this Device."
  ermConfigurationChanges: [ErmConfigurationChange!]! @requires(fields: "imei")
  "Deployment switch for controlled configuration writes; reads remain available."
  ermConfigurationWritesEnabled: Boolean! @requires(fields: "imei")
  "Newest fifty command requests of the verified Tenant and active Branch for this Device."
  ermCommandRequests: [ErmCommandRequest!]! @requires(fields: "imei")
}
"Internal Fleet reads; the caller must verify Tenant/Branch ownership before supplying IMEIs."
type ErmFleetTelemetry {
  asOf: DateTime!
  units: [ErmFleetTelemetryUnit!]!
}
type ErmFleetTelemetryUnit {
  imei: String!
  connected: Boolean!
  lastFrameAt: DateTime
  expectedIntervalSeconds: Int!
  reporting: Boolean!
}
enum ErmFleetProblemSourceKind {
  DIAGNOSTIC
  ALARM
  COMMAND
}
enum ErmFleetProblemState {
  RECORDED
  FAILED
  UNCERTAIN
  EXPIRED
}
enum ErmFleetDiagnosticKind {
  DIAGNOSTIC_TROUBLE_CODE
  CAN_ERROR
}
enum ErmFleetDiagnosticStatus {
  ADDED
  DELETED
}
type ErmFleetDiagnostic {
  kind: ErmFleetDiagnosticKind!
  troubleCode: String
  status: ErmFleetDiagnosticStatus
}
type ErmFleetProblem {
  sourceKind: ErmFleetProblemSourceKind!
  sourceId: ID!
  imei: String!
  deviceId: ID
  occurredAt: DateTime!
  severity: ErmEventSeverity!
  state: ErmFleetProblemState!
  code: String!
  details: String
  eventTime: DateTime
  eventId: String
  diagnostics: [ErmFleetDiagnostic!]!
}
type ErmFleetProblemCount {
  sourceKind: ErmFleetProblemSourceKind!
  severity: ErmEventSeverity!
  count: Int!
}
type ErmFleetProblems {
  asOf: DateTime!
  totalCount: Int!
  hasMore: Boolean!
  items: [ErmFleetProblem!]!
  counts: [ErmFleetProblemCount!]!
}
type Query {
  "Internal token only. Current sockets and expected-frame freshness, independent of Branch data clocks."
  ermFleetTelemetry(imeis: [String!]!): ErmFleetTelemetry!
  "Internal token only. Recorded evidence and scoped durable failures; no current-fault assertion."
  ermFleetProblems(
    imeis: [String!]!
    tenantId: ID!
    branchId: ID!
    from: DateTime!
    to: DateTime!
    offset: Int = 0
    limit: Int = 500
  ): ErmFleetProblems!
  "One durable request in the verified Tenant and active Branch, suitable for pending-state polling."
  ermCommandRequest(id: ID!): ErmCommandRequest
  "Newest first, scoped to the verified Tenant and active Branch; creation range is half-open."
  ermCommandRequests(
    offset: Int! = 0
    limit: Int! = 20
    filter: ErmCommandRequestsFilter
  ): ErmCommandRequestsPage!
  ermCommandBatch(id: ID!): ErmCommandBatch
  ermConfigurationBatch(id: ID!): ErmConfigurationBatch
}
type Mutation {
  "Queues an allowlisted read for the Device's next primary connection, with expiry and no ambiguous replay."
  sendErmDeviceCommand(input: SendErmDeviceCommandInput!): ErmCommandRequest!
  "Cancels a queued request of the verified Tenant and active Branch before submission."
  cancelErmDeviceCommand(input: CancelErmDeviceCommandInput!): ErmCommandRequest!
  "Creates a new request after current Fleet ownership verification; never replays automatically."
  retryErmDeviceCommand(input: RetryErmDeviceCommandInput!): ErmCommandRequest!
  "Queues one allowlisted read per selected Branch Device in order (at most 100 unique Devices)."
  startErmCommandBatch(input: StartErmCommandBatchInput!): ErmCommandBatch!
  "Records the stopping actor and cancels only requests that are still queued."
  stopErmCommandBatch(id: ID!): ErmCommandBatch!
  "Starts a background parameter snapshot after checking the Device's active Branch and primary connection."
  startErmParameterSnapshot(input: StartErmParameterSnapshotInput!): ErmParameterSnapshot!
  "Starts a controlled eData read or single change after verifying the Device's Branch and primary connection."
  startErmEdataChange(input: StartErmEdataChangeInput!): ErmConfigurationChange!
  "Starts a single guarded 04 parameter change with snapshot, baseline and readback."
  startErmParameterChange(input: StartErmParameterChangeInput!): ErmConfigurationChange!
  "Engineer: one guarded 46 write of an explicit set, with exact-set baseline and verification."
  startErmParametersChange(input: StartErmParametersChangeInput!): ErmConfigurationChange!
  "Engineer: verified 46 workflows in Device order; stops at the first non-VERIFIED result."
  startErmParameterBatch(input: StartErmParameterBatchInput!): ErmConfigurationBatch!
  "Engineer: finishes the active unit and refuses the remaining batch runs."
  stopErmConfigurationBatch(id: ID!): ErmConfigurationBatch!
}
