supergraph:
  listen: '127.0.0.1:${env.ROUTER_PORT:-11010}'
  path: /graphql

health_check:
  listen: '127.0.0.1:${env.ROUTER_HEALTH_PORT:-11016}'
  path: /health

limits:
  router:
    http1_max_request_buf_size: 16KiB

rhai:
  scripts: router
  main: compatibility.rhai

include_subgraph_errors:
  all:
    redact_message: false
    allow_extensions_keys: [code, fieldErrors]

traffic_shaping:
  all:
    timeout: 5s

override_subgraph_url:
  core: '${env.CORE_GRAPHQL_URL:-http://127.0.0.1:11011/graphql}'
  fleet: '${env.FLEET_GRAPHQL_URL:-http://127.0.0.1:11013/graphql}'
  karma-client: '${env.KARMA_CLIENT_GRAPHQL_URL:-http://127.0.0.1:11014/graphql}'

headers:
  all:
    request:
      operations:
        - propagate:
            named: authorization
        - propagate:
            named: x-branch-id
        - propagate:
            named: x-request-id

cors:
  policies:
    - origins:
        - '${env.ADMIN_ORIGIN:-http://127.0.0.1:11000}'
      methods: [GET, POST, OPTIONS]
      allow_headers: [authorization, content-type, x-branch-id, x-request-id]
      expose_headers: [x-request-id]
