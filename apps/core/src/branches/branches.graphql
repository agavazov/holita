extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])

type Branch @key(fields: "id") {
  id: ID!
  name: String!
}

type Tenant {
  id: ID!
  name: String!
}

type DemoSession {
  token: String!
  tenant: Tenant!
}

type Mutation {
  demoLogin(tenantId: ID!): DemoSession!
}

type Query {
  tenants: [Tenant!]!
  branches: [Branch!]!
  branch(id: ID!): Branch
}
