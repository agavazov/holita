type ReferenceDevice @key(fields: "id") {
  id: ID!
  storeId: ID!
  store: Store!
  imei: String!
  vehicleId: ID!
  vehicle: ReferenceVehicle!
  createdAt: DateTime!
  updatedAt: DateTime!
}
type ReferenceDevicePage {
  items: [ReferenceDevice!]!
  total: Int!
  offset: Int!
  limit: Int!
}
input CreateReferenceDeviceInput {
  imei: String!
  vehicleId: ID!
}
input UpdateReferenceDeviceInput {
  imei: String
  vehicleId: ID
}
enum ReferenceDeviceSortField {
  IMEI
  CREATED_AT
}

enum ReferenceDeviceSortDirection {
  ASC
  DESC
}

input ReferenceDeviceSort {
  field: ReferenceDeviceSortField! = CREATED_AT
  direction: ReferenceDeviceSortDirection! = DESC
}

extend type Query {
  referenceDevices(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    ids: [ID!]
    sort: ReferenceDeviceSort
  ): ReferenceDevicePage!
  referenceDevice(id: ID!): ReferenceDevice!
}
extend type Mutation {
  createReferenceDevice(input: CreateReferenceDeviceInput!): ReferenceDevice!
  updateReferenceDevice(id: ID!, input: UpdateReferenceDeviceInput!): ReferenceDevice!
  deleteReferenceDevice(id: ID!): ReferenceDevice!
}
