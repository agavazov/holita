type ReferenceSpeaker @key(fields: "id") {
  id: ID!
  storeId: ID!
  store: Store!
  name: String!
  email: String
  shortBio: String
  active: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}
type ReferenceSpeakerPage {
  items: [ReferenceSpeaker!]!
  total: Int!
  offset: Int!
  limit: Int!
}
input CreateReferenceSpeakerInput {
  name: String!
  email: String
  shortBio: String
  active: Boolean! = true
}
input UpdateReferenceSpeakerInput {
  name: String
  email: String
  shortBio: String
  active: Boolean
}
enum ReferenceSpeakerSortField {
  NAME
  EMAIL
  ACTIVE
  CREATED_AT
}

enum ReferenceSpeakerSortDirection {
  ASC
  DESC
}

input ReferenceSpeakerSort {
  field: ReferenceSpeakerSortField! = CREATED_AT
  direction: ReferenceSpeakerSortDirection! = DESC
}

extend type Query {
  referenceSpeakers(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    active: Boolean
    ids: [ID!]
    sort: ReferenceSpeakerSort
  ): ReferenceSpeakerPage!
  referenceSpeaker(id: ID!): ReferenceSpeaker!
}
extend type Mutation {
  createReferenceSpeaker(input: CreateReferenceSpeakerInput!): ReferenceSpeaker!
  updateReferenceSpeaker(id: ID!, input: UpdateReferenceSpeakerInput!): ReferenceSpeaker!
  deleteReferenceSpeaker(id: ID!): ReferenceSpeaker!
}
