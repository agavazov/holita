fragment SalesLeadFields on Lead {
  id
  displayName
  websiteUrl
  sourceName
  stage
  stageChangedAt
  wonAt
  createdByUserId
  assignedAgentUserId
  createdAt
  updatedAt
}

query SalesLeads(
  $offset: Int!
  $limit: Int!
  $search: String
  $sort: LeadSort
  $stage: LeadStage
  $status: LeadStatusFilter
  $assignment: LeadAssignmentFilter
  $assignedAgentUserId: ID
) {
  leads(
    offset: $offset
    limit: $limit
    search: $search
    sort: $sort
    stage: $stage
    status: $status
    assignment: $assignment
    assignedAgentUserId: $assignedAgentUserId
  ) {
    items {
      ...SalesLeadFields
      nextTask {
        scheduledAt
        type
      }
    }
    total
    offset
    limit
  }
}

query SalesLead($id: ID!) {
  lead(id: $id) {
    ...SalesLeadFields
  }
}

fragment SalesAgentFields on SalesAgent {
  id
  name
  active
}

query SalesAgents($ids: [ID!]) {
  salesAgents(ids: $ids) {
    ...SalesAgentFields
  }
}

query SalesLeadAssignmentAgents {
  salesAgents: leadAssignmentAgents {
    ...SalesAgentFields
  }
}

mutation SalesCreateLead($input: LeadInput!) {
  createLead(input: $input) {
    id
  }
}

mutation SalesUpdateLead($id: ID!, $input: LeadInput!) {
  updateLead(id: $id, input: $input) {
    id
  }
}

mutation SalesUpdateLeadStage($id: ID!, $stage: LeadStage!) {
  updateLeadStage(id: $id, stage: $stage) {
    ...SalesLeadFields
  }
}

mutation SalesUpdateLeadAssignment($id: ID!, $assignedAgentUserId: ID) {
  updateLeadAssignment(id: $id, assignedAgentUserId: $assignedAgentUserId) {
    assignedAgentUserId
    updatedAt
  }
}

fragment SalesLeadNoteFields on LeadNote {
  id
  occurredAt
  text
}

query SalesLeadNotes($leadId: ID!) {
  leadNotes(leadId: $leadId) {
    note {
      ...SalesLeadNoteFields
    }
    authorName
  }
}

query SalesLeadNote($leadId: ID!, $id: ID!) {
  leadNote(leadId: $leadId, id: $id) {
    ...SalesLeadNoteFields
  }
}

mutation SalesCreateLeadNote($leadId: ID!, $input: LeadNoteInput!) {
  createLeadNote(leadId: $leadId, input: $input) {
    id
  }
}

mutation SalesUpdateLeadNote($leadId: ID!, $id: ID!, $input: LeadNoteInput!) {
  updateLeadNote(leadId: $leadId, id: $id, input: $input) {
    id
  }
}

mutation SalesDeleteLeadNote($leadId: ID!, $id: ID!) {
  deleteLeadNote(leadId: $leadId, id: $id)
}

fragment SalesLeadTaskFields on LeadTask {
  id
  scheduledAt
  type
  status
  note
  updatedAt
}

query SalesLeadTasks($leadId: ID!) {
  leadTasks(leadId: $leadId) {
    ...SalesLeadTaskFields
  }
}

query SalesLeadTask($leadId: ID!, $id: ID!) {
  leadTask(leadId: $leadId, id: $id) {
    ...SalesLeadTaskFields
  }
}

query SalesTaskQueue(
  $scope: SalesTaskQueueScope!
  $bucket: SalesTaskBucket
  $offset: Int!
  $limit: Int!
) {
  salesTaskQueue(scope: $scope, bucket: $bucket, offset: $offset, limit: $limit) {
    bucket
    total
    items {
      lead {
        id
        displayName
        websiteUrl
        assignedAgentUserId
      }
      task {
        id
        type
        status
        scheduledAt
      }
    }
  }
}

mutation SalesCreateLeadTask($leadId: ID!, $input: LeadTaskInput!) {
  createLeadTask(leadId: $leadId, input: $input) {
    id
  }
}

mutation SalesUpdateLeadTask($leadId: ID!, $id: ID!, $input: LeadTaskInput!) {
  updateLeadTask(leadId: $leadId, id: $id, input: $input) {
    id
  }
}

mutation SalesUpdateLeadTaskStatus($leadId: ID!, $id: ID!, $status: LeadTaskStatus!) {
  updateLeadTaskStatus(leadId: $leadId, id: $id, status: $status) {
    id
  }
}
