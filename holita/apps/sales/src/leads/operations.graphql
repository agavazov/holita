fragment SalesLeadFields on Lead {
  id
  displayName
  websiteUrl
  sourceName
  stage
  stageChangedAt
  wonAt
  createdByUserId
  createdAt
  updatedAt
}

query SalesLeads(
  $offset: Int!
  $limit: Int!
  $search: String
  $sort: LeadSort
  $stage: LeadStage
  $status: LeadStatusFilter
) {
  leads(
    offset: $offset
    limit: $limit
    search: $search
    sort: $sort
    stage: $stage
    status: $status
  ) {
    items {
      ...SalesLeadFields
    }
    total
    offset
    limit
  }
}

query SalesLead($id: ID!) {
  lead(id: $id) {
    ...SalesLeadFields
  }
}

mutation SalesCreateLead($input: LeadInput!) {
  createLead(input: $input) {
    id
  }
}

mutation SalesUpdateLead($id: ID!, $input: LeadInput!) {
  updateLead(id: $id, input: $input) {
    id
  }
}

mutation SalesUpdateLeadStage($id: ID!, $stage: LeadStage!) {
  updateLeadStage(id: $id, stage: $stage) {
    ...SalesLeadFields
  }
}
