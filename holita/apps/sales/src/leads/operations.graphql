fragment SalesLeadFields on Lead {
  id
  displayName
  websiteUrl
  sourceName
  stage
  stageChangedAt
  wonAt
  createdByUserId
  assignedAgentUserId
  createdAt
  updatedAt
}

query SalesLeads(
  $offset: Int!
  $limit: Int!
  $search: String
  $sort: LeadSort
  $stage: LeadStage
  $status: LeadStatusFilter
  $assignment: LeadAssignmentFilter
  $assignedAgentUserId: ID
) {
  leads(
    offset: $offset
    limit: $limit
    search: $search
    sort: $sort
    stage: $stage
    status: $status
    assignment: $assignment
    assignedAgentUserId: $assignedAgentUserId
  ) {
    items {
      ...SalesLeadFields
    }
    total
    offset
    limit
  }
}

query SalesLead($id: ID!) {
  lead(id: $id) {
    ...SalesLeadFields
  }
}

fragment SalesAgentFields on SalesAgent {
  id
  name
  active
}

query SalesAgents($ids: [ID!]) {
  salesAgents(ids: $ids) {
    ...SalesAgentFields
  }
}

query SalesLeadAssignmentAgents {
  salesAgents: leadAssignmentAgents {
    ...SalesAgentFields
  }
}

mutation SalesCreateLead($input: LeadInput!) {
  createLead(input: $input) {
    id
  }
}

mutation SalesUpdateLead($id: ID!, $input: LeadInput!) {
  updateLead(id: $id, input: $input) {
    id
  }
}

mutation SalesUpdateLeadStage($id: ID!, $stage: LeadStage!) {
  updateLeadStage(id: $id, stage: $stage) {
    ...SalesLeadFields
  }
}

mutation SalesUpdateLeadAssignment($id: ID!, $assignedAgentUserId: ID) {
  updateLeadAssignment(id: $id, assignedAgentUserId: $assignedAgentUserId) {
    assignedAgentUserId
    updatedAt
  }
}
