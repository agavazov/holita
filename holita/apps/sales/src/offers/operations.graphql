fragment SalesOfferSummary on SalesOffer {
  id
  recipientName
  recipientEmail
  currentSiteUrl
  status
  validUntil
  recommended {
    planName
    monthlyPrice
  }
  alternative {
    planName
    monthlyPrice
  }
  updatedAt
}

fragment SalesOfferDetails on SalesOffer {
  ...SalesOfferSummary
  leadId
  replyEmail
  replyPhone
  proposedSiteUrl
  exampleDomain
  preparedAt
  manuallySentAt
  productCount
  categoryCount
  languages
  currentPlatform
  message
  includedScope
  createdAt
}

query SalesOffers(
  $offset: Int!
  $limit: Int!
  $search: String
  $leadId: ID
  $status: SalesOfferStatus
  $expires: SalesOfferExpiry
) {
  salesOffers(
    offset: $offset
    limit: $limit
    search: $search
    leadId: $leadId
    status: $status
    expires: $expires
  ) {
    total
    offset
    limit
    items {
      ...SalesOfferSummary
    }
  }
}

query SalesOffer($id: ID!) {
  salesOffer(id: $id) {
    ...SalesOfferDetails
  }
}

mutation SalesCreateOffer($leadId: ID, $input: SalesOfferInput!) {
  createSalesOffer(leadId: $leadId, input: $input) {
    id
  }
}

mutation SalesUpdateOffer($id: ID!, $input: SalesOfferInput!) {
  updateSalesOffer(id: $id, input: $input) {
    id
  }
}

mutation SalesTransitionOffer($id: ID!, $action: SalesOfferAction!) {
  transitionSalesOffer(id: $id, action: $action) {
    ...SalesOfferDetails
  }
}
