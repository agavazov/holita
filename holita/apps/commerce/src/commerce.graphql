enum ProductStatus {
  DRAFT
  ACTIVE
  ARCHIVED
}
enum ProductSortField {
  NAME
  PRICE
  STATUS
  CREATED_AT
}
enum SortDirection {
  ASC
  DESC
}
input ProductSort {
  field: ProductSortField! = NAME
  direction: SortDirection! = ASC
}
input ProductFilter {
  statuses: [ProductStatus!]
}
input ProductVariantInput {
  "Keep the ID when editing an existing variant."
  id: ID
  sku: String!
  price: String!
  "Initial quantity for a new tracked variant. Existing stock is adjusted through Inventory."
  quantity: Int
  inventoryTracked: Boolean!
  active: Boolean!
  "One value from each option used by this product. Leave empty for a simple product."
  optionValueIds: [ID!]!
}
type ProductVariant {
  id: ID!
  sku: String!
  price: String!
  quantity: Int!
  inventoryTracked: Boolean!
  active: Boolean!
  optionValueIds: [ID!]!
}
input ProductImageInput {
  id: ID
  upload: String
  altText: String
}
type ProductImage {
  id: ID!
  url: String!
  altText: String
}
input ProductInput {
  name: String!
  "Bulgarian plain text. Omit to keep on update or leave unset on create. Null or blank clears it."
  descriptionBg: String
  "English plain text. Omit to keep on update or leave unset on create. Null or blank clears it."
  descriptionEn: String
  "The complete set of variants in display order. Omitted variants are removed."
  variants: [ProductVariantInput!]!
  """
  Ordered replacement. Omit to keep existing images, or pass an empty list to remove them.
  """
  images: [ProductImageInput!]
  """
  Patches the listed characteristic values. Blank text clears a value.
  Omitted IDs and an omitted, null or empty list preserve existing values.
  """
  characteristicValues: [ProductCharacteristicValueInput!]
  "Replaces the assigned badges. Omit or pass null to keep them on update, or use an empty list to clear them."
  badgeIds: [ID!]
  "Replaces the assigned tags. Omit or pass null to keep them on update, or use an empty list to clear them."
  tagIds: [ID!]
  status: ProductStatus!
  brandId: ID
  categoryId: ID
}
type Product {
  id: ID!
  name: String!
  descriptionBg: String
  descriptionEn: String
  "Lowest active variant price, or null when there are no active variants."
  price: String
  variants: [ProductVariant!]!
  images: [ProductImage!]!
  badges: [ProductBadge!]!
  tags: [ProductTag!]!
  status: ProductStatus!
  brandId: ID
  categoryId: ID
  createdAt: String!
  updatedAt: String!
}
type ProductPage {
  items: [Product!]!
  total: Int!
  offset: Int!
  limit: Int!
}
enum InventorySortField {
  PRODUCT_NAME
  SKU
  QUANTITY
}
input InventorySort {
  field: InventorySortField! = PRODUCT_NAME
  direction: SortDirection! = ASC
}
input InventoryFilter {
  inventoryTracked: Boolean
  "True restricts results to tracked variants with zero stock."
  outOfStock: Boolean
}
type InventoryOptionValue {
  optionName: String!
  label: String!
}
type InventoryVariant {
  id: ID!
  productId: ID!
  productName: String!
  sku: String!
  inventoryTracked: Boolean!
  quantity: Int!
  optionValues: [InventoryOptionValue!]!
}
type InventoryPage {
  items: [InventoryVariant!]!
  total: Int!
  offset: Int!
  limit: Int!
}
type Customer {
  id: ID!
  name: String!
  email: String!
  createdAt: String!
  updatedAt: String!
}
enum BrandStatus {
  ACTIVE
  HIDDEN
}
enum BrandSortField {
  NAME
  SLUG
  STATUS
}
input BrandSort {
  field: BrandSortField! = NAME
  direction: SortDirection! = ASC
}
input BrandInput {
  name: String!
  slug: String!
  status: BrandStatus!
  "Base64-encoded raster file. Omit to keep the logo or pass null to remove it."
  logo: String
}
type Brand {
  id: ID!
  name: String!
  slug: String!
  status: BrandStatus!
  logoUrl: String
  createdAt: String!
  updatedAt: String!
}
type BrandPage {
  items: [Brand!]!
  total: Int!
  offset: Int!
  limit: Int!
}
input CategoryInput {
  name: String!
  slug: String!
  parentId: ID
  sortOrder: Int!
  active: Boolean!
}
type Category {
  id: ID!
  name: String!
  slug: String!
  parentId: ID
  sortOrder: Int!
  active: Boolean!
}
enum OptionSortField {
  NAME
  ACTIVE
  SHOW_IN_FILTERS
}
input OptionSort {
  field: OptionSortField! = NAME
  direction: SortDirection! = ASC
}
input OptionValueInput {
  "Retain a value's ID when editing or moving it. Omit the ID to add a value."
  id: ID
  label: String!
}
input OptionInput {
  name: String!
  active: Boolean!
  showInFilters: Boolean!
  "All values in display order. Existing values omitted from this list are removed."
  values: [OptionValueInput!]!
}
type OptionValue {
  id: ID!
  label: String!
}
type Option {
  id: ID!
  name: String!
  active: Boolean!
  showInFilters: Boolean!
  values: [OptionValue!]!
}
type OptionPage {
  items: [Option!]!
  total: Int!
  offset: Int!
  limit: Int!
}
enum CharacteristicGroupSortField {
  NAME
  SORT_ORDER
}
input CharacteristicGroupSort {
  field: CharacteristicGroupSortField! = SORT_ORDER
  direction: SortDirection! = ASC
}
input CharacteristicInput {
  id: ID
  name: String!
  sortOrder: Int!
  active: Boolean!
}
input CharacteristicGroupInput {
  name: String!
  sortOrder: Int!
  active: Boolean!
  "Existing characteristics omitted from this list are retained."
  characteristics: [CharacteristicInput!]!
}
type Characteristic {
  id: ID!
  name: String!
  sortOrder: Int!
  active: Boolean!
}
type CharacteristicGroup {
  id: ID!
  name: String!
  sortOrder: Int!
  active: Boolean!
  characteristics: [Characteristic!]!
}
type CharacteristicGroupPage {
  items: [CharacteristicGroup!]!
  total: Int!
  offset: Int!
  limit: Int!
}
input ProductCharacteristicValueInput {
  characteristicId: ID!
  value: String!
}
type ProductCharacteristicValue {
  characteristicId: ID!
  value: String!
}
type ProductCharacteristics {
  groups: [CharacteristicGroup!]!
  values: [ProductCharacteristicValue!]!
}

enum ProductCollectionMode {
  MANUAL
  CATEGORY
  BRAND
}
enum ProductCollectionSortField {
  NAME
  SLUG
  ACTIVE
}
input ProductCollectionSort {
  field: ProductCollectionSortField! = NAME
  direction: SortDirection! = ASC
}
input ProductCollectionInput {
  name: String!
  slug: String!
  active: Boolean!
  mode: ProductCollectionMode!
  categoryId: ID
  brandId: ID
  "The complete selection in display order for a manual collection."
  productIds: [ID!]! = []
}
type CollectionProductRef {
  id: ID!
  name: String!
  status: ProductStatus!
}
type ProductCollection {
  id: ID!
  name: String!
  slug: String!
  active: Boolean!
  mode: ProductCollectionMode!
  categoryId: ID
  brandId: ID
  manualProducts: [CollectionProductRef!]!
}
type ProductCollectionSummary {
  id: ID!
  name: String!
  slug: String!
  active: Boolean!
  mode: ProductCollectionMode!
}
type ProductCollectionPage {
  items: [ProductCollectionSummary!]!
  total: Int!
  offset: Int!
  limit: Int!
}
enum ProductBadgeColor {
  ACCENT
  NEUTRAL
  INFO
  SUCCESS
  WARN
  DANGER
}
enum ProductBadgeSortField {
  NAME
  ACTIVE
  SORT_ORDER
}
input ProductBadgeSort {
  field: ProductBadgeSortField! = SORT_ORDER
  direction: SortDirection! = ASC
}
input ProductBadgeInput {
  name: String!
  slug: String!
  active: Boolean!
  color: ProductBadgeColor!
  sortOrder: Int!
}
type ProductBadge {
  id: ID!
  name: String!
  slug: String!
  active: Boolean!
  color: ProductBadgeColor!
  sortOrder: Int!
}
type ProductBadgePage {
  items: [ProductBadge!]!
  total: Int!
  offset: Int!
  limit: Int!
}
type ProductTag {
  id: ID!
  name: String!
  slug: String!
}
type Query {
  products(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    filter: ProductFilter
    sort: ProductSort
  ): ProductPage!
  product(id: ID!): Product
  inventory(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    filter: InventoryFilter
    sort: InventorySort
  ): InventoryPage!
  inventoryVariant(id: ID!): InventoryVariant
  customers: [Customer!]!
  brands(offset: Int! = 0, limit: Int! = 20, search: String, sort: BrandSort): BrandPage!
  brand(id: ID!): Brand
  "Shop categories in tree order. A null parentId denotes a root."
  categories: [Category!]!
  category(id: ID!): Category
  options(offset: Int! = 0, limit: Int! = 20, search: String, sort: OptionSort): OptionPage!
  option(id: ID!): Option
  "Shop options and their values for the product editor."
  productOptions: [Option!]!
  characteristicGroups(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    sort: CharacteristicGroupSort
  ): CharacteristicGroupPage!
  characteristicGroup(id: ID!): CharacteristicGroup
  productCharacteristics(productId: ID): ProductCharacteristics!
  productCollections(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    sort: ProductCollectionSort
  ): ProductCollectionPage!
  productCollection(id: ID!): ProductCollection
  productBadges(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    sort: ProductBadgeSort
  ): ProductBadgePage!
  productBadge(id: ID!): ProductBadge
  "Shop badges for the product editor, including inactive badges."
  productBadgeChoices: [ProductBadge!]!
  productTags(search: String, limit: Int! = 20): [ProductTag!]!
}
type Mutation {
  createProduct(input: ProductInput!): Product!
  updateProduct(id: ID!, input: ProductInput!): Product!
  updateInventoryQuantity(id: ID!, quantity: Int!): InventoryVariant!
  createBrand(input: BrandInput!): Brand!
  updateBrand(id: ID!, input: BrandInput!): Brand!
  deleteBrand(id: ID!): Boolean!
  createCategory(input: CategoryInput!): Category!
  updateCategory(id: ID!, input: CategoryInput!): Category!
  deleteCategory(id: ID!): Boolean!
  createOption(input: OptionInput!): Option!
  updateOption(id: ID!, input: OptionInput!): Option!
  createCharacteristicGroup(input: CharacteristicGroupInput!): CharacteristicGroup!
  updateCharacteristicGroup(id: ID!, input: CharacteristicGroupInput!): CharacteristicGroup!
  createProductCollection(input: ProductCollectionInput!): ProductCollection!
  updateProductCollection(id: ID!, input: ProductCollectionInput!): ProductCollection!
  createProductBadge(input: ProductBadgeInput!): ProductBadge!
  updateProductBadge(id: ID!, input: ProductBadgeInput!): ProductBadge!
  createProductTag(name: String!): ProductTag!
}
