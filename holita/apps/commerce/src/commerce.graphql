enum ProductStatus {
  DRAFT
  ACTIVE
  ARCHIVED
}
enum ProductSortField {
  NAME
  PRICE
  STATUS
  CREATED_AT
}
enum SortDirection {
  ASC
  DESC
}
input ProductSort {
  field: ProductSortField! = NAME
  direction: SortDirection! = ASC
}
input ProductFilter {
  statuses: [ProductStatus!]
}
input ProductInput {
  name: String!
  price: String!
  status: ProductStatus!
  brandId: ID
}
type Product {
  id: ID!
  name: String!
  price: String!
  status: ProductStatus!
  brandId: ID
  createdAt: String!
  updatedAt: String!
}
type ProductPage {
  items: [Product!]!
  total: Int!
  offset: Int!
  limit: Int!
}
type Customer {
  id: ID!
  name: String!
  email: String!
  createdAt: String!
  updatedAt: String!
}
enum BrandStatus {
  ACTIVE
  HIDDEN
}
enum BrandSortField {
  NAME
  SLUG
  STATUS
}
input BrandSort {
  field: BrandSortField! = NAME
  direction: SortDirection! = ASC
}
input BrandInput {
  name: String!
  slug: String!
  status: BrandStatus!
  "Base64-encoded raster file. Omit to keep the logo or pass null to remove it."
  logo: String
}
type Brand {
  id: ID!
  name: String!
  slug: String!
  status: BrandStatus!
  logoUrl: String
  createdAt: String!
  updatedAt: String!
}
type BrandPage {
  items: [Brand!]!
  total: Int!
  offset: Int!
  limit: Int!
}
type Query {
  products(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    filter: ProductFilter
    sort: ProductSort
  ): ProductPage!
  product(id: ID!): Product
  customers: [Customer!]!
  brands(offset: Int! = 0, limit: Int! = 20, search: String, sort: BrandSort): BrandPage!
  brand(id: ID!): Brand
}
type Mutation {
  createProduct(input: ProductInput!): Product!
  updateProduct(id: ID!, input: ProductInput!): Product!
  createBrand(input: BrandInput!): Brand!
  updateBrand(id: ID!, input: BrandInput!): Brand!
  deleteBrand(id: ID!): Boolean!
}
