input ProductVariantInput {
  """
  Keep the ID when editing an existing variant.
  Keep its option values while stock can still be restored to it. Set active to false to stop sales.
  """
  id: ID
  sku: String!
  "Optional barcode, case-insensitively unique in the shop. Omit to keep it, or pass null or blank to clear it."
  barcode: String
  price: String!
  "Weight in kilograms. Omit a measurement to keep it on update, or pass null to clear it."
  weight: Float
  "Package width in centimetres."
  width: Float
  "Package height in centimetres."
  height: Float
  "Package depth in centimetres."
  depth: Float
  "Initial quantity for a new tracked variant. Existing stock is adjusted through Inventory."
  quantity: Int
  "Minimum units per order line. Omit to keep the current minimum, or use one for a new variant."
  minimumQuantity: Int
  "An existing image retained in this product's gallery. Omit to keep it, or pass null to clear it."
  imageId: ID
  inventoryTracked: Boolean!
  active: Boolean!
  "One value from each option used by this product. Leave empty for a simple product."
  optionValueIds: [ID!]!
}
type ProductVariant {
  id: ID!
  sku: String!
  barcode: String
  price: String!
  "Weight in kilograms."
  weight: Float
  "Package width in centimetres."
  width: Float
  "Package height in centimetres."
  height: Float
  "Package depth in centimetres."
  depth: Float
  quantity: Int!
  minimumQuantity: Int!
  imageId: ID
  inventoryTracked: Boolean!
  active: Boolean!
  optionValueIds: [ID!]!
}
