input ProductInput {
  name: String!
  "Bulgarian plain text. Omit to keep on update or leave unset on create. Null or blank clears it."
  descriptionBg: String
  "English plain text. Omit to keep on update or leave unset on create. Null or blank clears it."
  descriptionEn: String
  "The complete set of variants in display order. Omitted variants are removed."
  variants: [ProductVariantInput!]!
  """
  Ordered replacement. Omit to keep existing images, or pass an empty list to remove them.
  """
  images: [ProductImageInput!]
  """
  Patches the listed applicable characteristic values. Blank text or an empty choice ID list
  clears that value. Omitted IDs and an omitted, null or empty list preserve existing values,
  including those from groups that no longer apply to the product's category.
  """
  characteristicValues: [ProductCharacteristicValueInput!]
  "Replaces the assigned badges. Omit or pass null to keep them on update, or use an empty list to clear them."
  badgeIds: [ID!]
  "Replaces the assigned tags. Omit or pass null to keep them on update, or use an empty list to clear them."
  tagIds: [ID!]
  status: ProductStatus!
  brandId: ID
  categoryId: ID
}
type Product {
  id: ID!
