type Shop {
  id: ID!
  name: String!
  "The merchant's public display name, or the Branch name when unset."
  displayName: String!
  contactEmail: String
  contactPhone: String
  contactAddress: String
  logoUrl: String
  faviconUrl: String
  announcementBg: String
  announcementEn: String
}
type PublicShopHome {
  welcomeBg: String
  welcomeEn: String
  heroActionBg: String
  heroActionEn: String
  heroHref: String
  heroImageUrl: String
  showTiles: Boolean!
  tiles: [PublicShopHomeTile]!
  showBenefits: Boolean!
  benefits: [PublicShopHomeBenefit]!
  showLatestProducts: Boolean!
}
type PublicShopHomeTile {
  titleBg: String
  titleEn: String
  eyebrowBg: String
  eyebrowEn: String
  imageAltBg: String
  imageAltEn: String
  href: String
  imageUrl: String
}
enum ShopHomeBenefitIcon {
  RETURNS
  CALENDAR
  GIFT_CARD
  PLANET
}
type PublicShopHomeBenefit {
  titleBg: String
  titleEn: String
  descriptionBg: String
  descriptionEn: String
  icon: ShopHomeBenefitIcon!
}
type ShopNavigation {
  header: [ShopNavigationLink!]!
  footer: [ShopNavigationLink!]!
}
type ShopNavigationLink {
  id: ID!
  labelBg: String
  labelEn: String
  href: String!
  external: Boolean!
}
type PublishedShopPage {
  slug: String!
  titleBg: String
  titleEn: String
  bodyBg: String
  bodyEn: String
}
type PublicBlogTag {
  name: String!
  slug: String!
}
type PublicBlogArticle {
  slug: String!
  titleBg: String
  titleEn: String
  bodyBg: String
  bodyEn: String
  publishedAt: String!
  tags: [PublicBlogTag!]!
}
type PublicBlogArticlePage {
  items: [PublicBlogArticle!]!
  total: Int!
  offset: Int!
  limit: Int!
}
type CatalogueProductImage {
  id: ID!
  url: String!
  altText: String
}
enum CatalogueBadgeColor {
  ACCENT
  NEUTRAL
  INFO
  SUCCESS
  WARN
  DANGER
}
type CatalogueBadge {
  id: ID!
  name: String!
  color: CatalogueBadgeColor!
}
type CatalogueTag {
  id: ID!
  name: String!
  slug: String!
}
type CatalogueProduct {
  coverImage: CatalogueProductImage
  images: [CatalogueProductImage!]!
  id: ID!
  name: String!
  descriptionBg: String
  descriptionEn: String
  "Lowest active variant price."
  price: String!
  "Whether at least one active variant can be sold."
  available: Boolean!
  variantSelection: CatalogueVariantSelection!
  optionPreviews: [CatalogueOptionPreview!]!
  brand: CatalogueBrand
  category: CatalogueCategory
  "The visible categories from the root through the product's category."
  categoryPath: [CatalogueCategory!]!
  badges: [CatalogueBadge!]!
  tags: [CatalogueTag!]!
}
type CatalogueBrand {
  id: ID!
  name: String!
  slug: String!
  logoUrl: String
}
type CatalogueCategory {
  id: ID!
  name: String!
  slug: String!
  parentId: ID
  sortOrder: Int!
}
input CatalogueBrowseFilter {
  search: String
  minPrice: String
  maxPrice: String
  brandIds: [ID!]
  "Matches any selected tag in the current shop, combined with the other filters."
  tagIds: [ID!]
  optionValueIds: [ID!]
  inStock: Boolean
  "Combines choices within a characteristic with OR, and across characteristics with AND."
  characteristicChoiceIds: [ID!]
}
enum CatalogueSort {
  NAME_ASC
  NAME_DESC
  PRICE_ASC
  PRICE_DESC
  NEWEST
}
type CatalogueListing {
  id: ID!
  name: String!
  slug: String!
  categoryPath: [CatalogueCategory!]!
  subcategories: [CatalogueCategory!]!
}
type CatalogueOptionValue {
  id: ID!
  label: String!
  swatchColor: String
}
type CatalogueOption {
  id: ID!
  name: String!
  values: [CatalogueOptionValue!]!
}
type CatalogueOptionPreview {
  id: ID!
  name: String!
  values: [CatalogueOptionPreviewValue!]!
}
type CatalogueOptionPreviewValue {
  id: ID!
  label: String!
  swatchColor: String
  "Whether an active variant with this value can meet its minimum purchase quantity."
  inStock: Boolean!
}
type CatalogueVariantSelection {
  "Active option groups and their values used by these variants."
  options: [CatalogueOption!]!
  "Active variants in merchant order, including sold-out variants."
  variants: [CatalogueVariant!]!
}
type CatalogueVariant {
  id: ID!
  sku: String!
  price: String!
  """
  Lowest known public EUR price in the rolling 30 × 24-hour window through now.
  Includes a known price already in effect at the start of the window.
  Null when no public price is known for that window.
  """
  referencePrice30Days: String
  "Weight in kilograms."
  weight: Float
  "Package width in centimetres."
  width: Float
  "Package height in centimetres."
  height: Float
  "Package depth in centimetres."
  depth: Float
  available: Boolean!
  minimumQuantity: Int!
  imageId: ID
  "Visible values in option group order."
  optionValueIds: [ID!]!
}
type CatalogueCharacteristicChoice {
  id: ID!
  name: String!
  count: Int!
}
type CatalogueCharacteristicFacet {
  id: ID!
  name: String!
  choices: [CatalogueCharacteristicChoice!]!
}
type CatalogueCharacteristicGroupFacet {
  id: ID!
  name: String!
  characteristics: [CatalogueCharacteristicFacet!]!
}
type CatalogueFacets {
  brands: [CatalogueBrand!]!
  tags: [CatalogueTag!]!
  options: [CatalogueOption!]!
  "Choices come from the listing. Counts include search and other filters, excluding this characteristic's selection."
  characteristicFacets: [CatalogueCharacteristicGroupFacet!]!
}
type CataloguePage {
  listing: CatalogueListing
  "Available filter choices for the listing."
  facets: CatalogueFacets!
  items: [CatalogueProduct!]!
  total: Int!
  offset: Int!
  limit: Int!
}
type CatalogueBrandPage {
  items: [CatalogueBrand!]!
  total: Int!
  offset: Int!
  limit: Int!
}
type CatalogueTagPage {
  items: [CatalogueTag!]!
  total: Int!
  offset: Int!
  limit: Int!
}
type CatalogueCollection {
  id: ID!
  name: String!
  slug: String!
}
type CatalogueCollectionPage {
  items: [CatalogueCollection!]!
  total: Int!
  offset: Int!
  limit: Int!
}
type Shopper {
  id: ID!
  name: String!
  email: String!
}
enum CustomerAddressType {
  "An unclassified address usable for shipping or billing."
  GENERAL
  SHIPPING
  BILLING
}
type CustomerAddress {
  id: ID!
  type: CustomerAddressType!
  isDefault: Boolean!
  recipient: String!
  line1: String!
  line2: String
  phone: String
  city: String!
  postalCode: String!
  countryCode: String!
}
input CustomerAddressInput {
  "Omit to keep the current type on update or use GENERAL on create."
  type: CustomerAddressType
  """
  A shipping or billing default replaces the previous default for that type.
  Omit on update to keep the default flag when the type stays the same.
  """
  isDefault: Boolean
  recipient: String!
  line1: String!
  "Omit to keep the current second line on update. Pass null or blank to clear it."
  line2: String
  "Omit to keep the current phone on update. Pass null or blank to clear it."
  phone: String
  city: String!
  postalCode: String!
  countryCode: String!
}
type ShopperSession {
  token: String!
  shopper: Shopper!
  expiresAt: String!
  cartMergeIssues: [CartMergeIssue!]!
}
enum CartIssue {
  UNAVAILABLE
  INSUFFICIENT_STOCK
  MINIMUM_QUANTITY_NOT_MET
}
type CartLine {
  id: ID!
  variantId: ID
  productId: ID
  name: String
  coverImage: CatalogueProductImage
  optionLabels: [String!]!
  quantity: Int!
  minimumQuantity: Int
  unitPrice: String
  lineTotal: String
  "Whether the requested quantity can be fulfilled."
  available: Boolean!
  issue: CartIssue
}
enum CartDiscountIssue {
  INVALID
  NOT_STARTED
  EXPIRED
  MINIMUM_NOT_MET
  EXHAUSTED
}
type CartDiscount {
  code: String!
  amount: String!
  issue: CartDiscountIssue
}
type Cart {
  lines: [CartLine!]!
  "Total requested quantity across all lines."
  itemCount: Float!
  "Current total for lines that can be fulfilled."
  subtotal: String!
  discount: CartDiscount
  discountedSubtotal: String!
}
type CartAddResult {
  cart: Cart!
  "Issued only when a new guest cart is created."
  guestCartToken: String
}
type CartMergeIssue {
  name: String
  quantity: Int!
  reason: CartIssue!
}
type CheckoutPaymentMethod {
  id: ID!
  label: String!
  instructions: String!
}
type CheckoutShippingMethod {
  id: ID!
  label: String!
  fixedFee: String!
}
type CheckoutState {
  cart: Cart!
  currency: String!
  paymentMethods: [CheckoutPaymentMethod!]!
  shippingMethods: [CheckoutShippingMethod!]!
}
input CheckoutContactInput {
  name: String!
  email: String!
  phone: String!
}
input CheckoutAddressInput {
  countryCode: String!
  city: String!
  postalCode: String!
  line1: String!
  line2: String
}
input CheckoutQuoteInput {
  contact: CheckoutContactInput!
  shippingAddress: CheckoutAddressInput!
  "Omit or pass null to use the shipping address and order contact."
  billingAddress: CheckoutBillingAddressInput
  paymentMethodId: ID!
  shippingMethodId: ID!
}
type CheckoutQuote {
  cartId: ID!
  quoteRevision: String!
  lines: [CartLine!]!
  paymentMethod: CheckoutPaymentMethod!
  shippingMethod: CheckoutShippingMethod!
  currency: String!
  subtotal: String!
  discountCode: String
  discountAmount: String!
  shippingFee: String!
  total: String!
}
input CheckoutBillingAddressInput {
  name: String!
  phone: String!
  countryCode: String!
  city: String!
  postalCode: String!
  line1: String!
  line2: String
}
input PlaceOrderInput {
  cartId: ID!
  quoteRevision: String!
  contact: CheckoutContactInput!
  shippingAddress: CheckoutAddressInput!
  "Omit or pass null to use the shipping address and order contact."
  billingAddress: CheckoutBillingAddressInput
  "An optional plain-text instruction of up to 5,000 characters."
  shopperNote: String
  paymentMethodId: ID!
  shippingMethodId: ID!
}
enum OrderStatus {
  PLACED
  CONFIRMED
  PROCESSING
  SHIPPED
  COMPLETED
  CANCELLED
}
enum OrderPaymentStatus {
  UNPAID
  PAID
}
type OrderContact {
  name: String!
  email: String!
  phone: String!
}
type OrderShippingAddress {
  countryCode: String!
  city: String!
  postalCode: String!
  line1: String!
  line2: String
}
type OrderConfirmationLine {
  id: ID!
  sku: String!
  label: String!
  quantity: Int!
  unitPrice: String!
  lineTotal: String!
}
type OrderConfirmation {
  id: ID!
  number: String!
  status: OrderStatus!
  paymentStatus: OrderPaymentStatus!
  placedAt: String!
  contact: OrderContact!
  shippingAddress: OrderShippingAddress!
  paymentMethodLabel: String!
  paymentInstructions: String!
  shippingMethodLabel: String!
  shopperNote: String
  lines: [OrderConfirmationLine!]!
  currency: String!
  subtotal: String!
  discountCode: String
  discountAmount: String!
  shippingFee: String!
  total: String!
}
type ShopperOrderSummary {
  id: ID!
  number: String!
  status: OrderStatus!
  paymentStatus: OrderPaymentStatus!
  placedAt: String!
  paymentMethodLabel: String!
  shippingMethodLabel: String!
  currency: String!
  total: String!
}
type ShopperOrderPage {
  items: [ShopperOrderSummary!]!
  total: Int!
  offset: Int!
  limit: Int!
}
input ShopperReturnLineInput {
  "The line ID from the shopper's order."
  orderLineId: ID!
  quantity: Int!
}
input ShopperReturnInput {
  orderId: ID!
  reason: String!
  """
  Quantities are combined per line and may use only units not already requested or approved.
  A pending or approved request with the same reason and combined lines cannot be repeated.
  """
  lines: [ShopperReturnLineInput!]!
}
type ShopperReturnReceipt {
  id: ID!
  requestedAt: String!
}
type CatalogueSpecificationGroup {
  name: String!
  values: [CatalogueSpecification!]!
}
type CatalogueSpecification {
  name: String!
  value: String!
}
type Query {
  shop: Shop
  "Saved shop navigation links whose destinations are publicly available."
  shopNavigation: ShopNavigation!
  shopHome: PublicShopHome
  "The published page with this slug in the current shop."
  shopPage(slug: String!): PublishedShopPage
  "Published articles in descending publication order, optionally filtered by an assigned tag."
  blogArticles(tagSlug: String, offset: Int! = 0, limit: Int! = 20): PublicBlogArticlePage!
  blogArticle(slug: String!): PublicBlogArticle
  "Tags assigned to published articles in the current shop."
  blogTags: [PublicBlogTag!]!
  "Uses search relevance when a search is supplied without an explicit sort."
  catalogue(
    offset: Int! = 0
    limit: Int! = 20
    filter: CatalogueBrowseFilter
    sort: CatalogueSort
  ): CataloguePage!
  catalogueProduct(id: ID!): CatalogueProduct
  catalogueProductSpecifications(productId: ID!): [CatalogueSpecificationGroup!]!
  catalogueBrands(offset: Int! = 0, limit: Int! = 20): [CatalogueBrand!]!
  catalogueBrandIndex(offset: Int! = 0, limit: Int! = 20): CatalogueBrandPage!
  catalogueTags(offset: Int! = 0, limit: Int! = 20): CatalogueTagPage!
  "Visible shop categories in tree order. A null parentId denotes a root."
  catalogueCategories: [CatalogueCategory!]!
  catalogueCollections(offset: Int! = 0, limit: Int! = 20): CatalogueCollectionPage!
  catalogueCategoryProducts(
    slug: String!
    offset: Int! = 0
    limit: Int! = 20
    filter: CatalogueBrowseFilter
    sort: CatalogueSort
  ): CataloguePage
  catalogueBrandProducts(
    slug: String!
    offset: Int! = 0
    limit: Int! = 20
    filter: CatalogueBrowseFilter
    sort: CatalogueSort
  ): CataloguePage
  "Active members in collection order by default, or by relevance for a search without an explicit sort. Returns null for a missing or inactive collection."
  catalogueCollectionProducts(
    slug: String!
    offset: Int! = 0
    limit: Int! = 20
    filter: CatalogueBrowseFilter
    sort: CatalogueSort
  ): CataloguePage
  catalogueTagProducts(
    slug: String!
    offset: Int! = 0
    limit: Int! = 20
    filter: CatalogueBrowseFilter
    sort: CatalogueSort
  ): CataloguePage
  shopperMe: Shopper
  shopperAddresses: [CustomerAddress!]!
  shopperOrders(offset: Int! = 0, limit: Int! = 20): ShopperOrderPage!
  shopperOrder(id: ID!): OrderConfirmation
  cart: Cart!
  checkout: CheckoutState
  orderConfirmation(orderId: ID!): OrderConfirmation
  guestOrderConfirmation(cartId: ID!): OrderConfirmation
  shopperOrderConfirmation(cartId: ID!): OrderConfirmation
}
type Mutation {
  registerShopper(name: String!, email: String!, password: String!): ShopperSession!
  signInShopper(email: String!, password: String!): ShopperSession!
  signOutShopper: Boolean!
  requestShopperPasswordReset(email: String!): Boolean!
  resetShopperPassword(token: String!, password: String!): Boolean!
  createShopperAddress(input: CustomerAddressInput!): CustomerAddress!
  updateShopperAddress(addressId: ID!, input: CustomerAddressInput!): CustomerAddress!
  removeShopperAddress(addressId: ID!): Boolean!
  addCartLine(variantId: ID!, quantity: Int!): CartAddResult!
  updateCartLine(lineId: ID!, quantity: Int!): Cart!
  removeCartLine(lineId: ID!): Cart!
  applyCartDiscount(code: String!): Cart!
  removeCartDiscount: Cart!
  quoteCheckout(input: CheckoutQuoteInput!): CheckoutQuote!
  placeOrder(input: PlaceOrderInput!): OrderConfirmation!
  "Submit a pending return for your own non-cancelled order within 14 days of placement."
  requestShopperReturn(input: ShopperReturnInput!): ShopperReturnReceipt!
}
