fragment OperatorShopSettingsFields on ShopSettings {
  displayName
  contactEmail
  contactPhone
  contactAddress
  logoUrl
  faviconUrl
  basicHome {
    announcementEnabled
    announcementBg
    announcementEn
    welcomeBg
    welcomeEn
    heroActionBg
    heroActionEn
    heroHref
    heroImageUrl
    showTiles
    tiles {
      titleBg
      titleEn
      eyebrowBg
      eyebrowEn
      imageAltBg
      imageAltEn
      href
      imageUrl
    }
    showBenefits
    benefits {
      titleBg
      titleEn
      descriptionBg
      descriptionEn
      icon
    }
    showLatestProducts
  }
}

query OperatorShopSettings {
  shopSettings {
    ...OperatorShopSettingsFields
  }
}

mutation OperatorUpdateShopSettings($input: ShopSettingsInput!) {
  updateShopSettings(input: $input) {
    ...OperatorShopSettingsFields
  }
}
