<osnova-page-header [title]="text().customers" [moduleInfo]="text().customersInfo" />
@if (scope()) {
<osnova-table-panel
  mobileIdentityLayout="trailing"
  [mobileFullWidthActions]="true"
  [heading]="text().shopCustomers"
  [columns]="columns()"
  [tableMinWidth]="tableMinWidth"
  [view]="view()"
  [busy]="list.isLoading()"
  [total]="page()?.total ?? null"
  [page]="pagination()"
  [emptyTitle]="text().noCustomers"
  [errorText]="text().unavailable"
  (pageChange)="url.setPage($event)"
  (retry)="list.reload()"
  (clearFilters)="url.clearFilters()"
>
  <osnova-filter-builder
    panelActions
    [mobileFullWidth]="true"
    [searchLabel]="text().searchCustomers"
    [search]="url.searchDraft()"
    [searchError]="url.searchError() ? shared().searchTooManyWords : null"
    (searchChange)="url.editSearch($event)"
  />
  <p-table
    class="app-responsive-table app-table-fixed"
    [value]="page()?.items ?? []"
    [rowTrackBy]="trackById"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [scrollable]="true"
    [tableStyle]="{ 'min-width': 'var(--app-table-responsive-min-width)' }"
    dataKey="id"
  >
    <ng-template #colgroup>
      <colgroup>
        @for (column of columns(); track column.id) {
        <col
          [class]="column.className ?? ''"
          [style.width]="column.kind === 'identity'
                ? 'var(--app-table-identity-width, ' + column.width + ')'
                : column.width"
        />
        }
      </colgroup>
    </ng-template>
    <ng-template #header>
      <tr>
        <th scope="col" class="app-col-identity">{{ text().name }}</th>
        <th scope="col" class="app-table-merged-column">{{ text().email }}</th>
      </tr>
    </ng-template>
    <ng-template #body let-customer>
      <tr>
        <td class="app-col-identity">
          <div class="app-table-identity-layout">
            <div class="app-cell-identity">
              <a
                class="app-link app-table-identity-wrap"
                [routerLink]="['/', language(), 'customers', customer.id]"
                [queryParams]="detailQuery()"
                [preserveFragment]="true"
                [title]="customer.name"
                (click)="url.cancelPending()"
                >{{ customer.name }}</a
              >
              <span class="app-table-mobile-meta" [title]="customer.email">
                {{ customer.email }}
              </span>
            </div>
          </div>
        </td>
        <td class="app-table-merged-column">
          <span class="app-cell-truncate" [title]="customer.email">{{ customer.email }}</span>
        </td>
      </tr>
    </ng-template>
  </p-table>
</osnova-table-panel>
} @else {
<p-message severity="info">{{ text().noShop }}</p-message>
}
