<osnova-page-header
  [title]="text().blogTags"
  [moduleInfo]="text().blogTagsInfo"
  [actions]="headerActions()"
  (action)="open('new')"
/>
@if (scope()) {
<osnova-table-panel
  #panel
  [heading]="text().shopBlogTags"
  mobileIdentityLayout="trailing"
  [mobileFullWidthActions]="true"
  [columns]="columns()"
  [tableMinWidth]="tableMinWidth"
  [view]="view()"
  [total]="page()?.total ?? null"
  [busy]="list.isLoading()"
  [errorText]="text().blogTagsUnavailable"
  [emptyTitle]="text().emptyBlogTags"
  [emptyDescription]="text().emptyBlogTagsDescription"
  [page]="pagination()"
  [actionContext]="params()"
  [actions]="actions()"
  (action)="run($event)"
  (pageChange)="url.setPage($event)"
  (retry)="list.reload()"
  (clearFilters)="url.clearFilters()"
>
  <osnova-filter-builder
    panelActions
    [mobileFullWidth]="true"
    [searchLabel]="text().searchBlogTags"
    [search]="url.searchDraft()"
    [searchError]="url.searchError() ? shared().searchTooManyWords : null"
    (searchChange)="url.editSearch($event)"
  >
    <osnova-list-sort-menu
      filterActions
      [fields]="sortFields()"
      [sort]="sort()"
      (sortChange)="changeSort($event)"
    />
  </osnova-filter-builder>
  <p-table
    class="app-responsive-table app-table-fixed"
    [value]="page()?.items ?? []"
    [rowTrackBy]="trackById"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [scrollable]="true"
    [tableStyle]="{ 'min-width': 'var(--app-table-responsive-min-width)' }"
    [sortField]="sort().field"
    [sortOrder]="sort().direction === 'asc' ? 1 : -1"
    (onLazyLoad)="tableSort($event)"
    dataKey="id"
  >
    <ng-template #colgroup>
      <colgroup>
        @for (column of columns(); track column.id) {
        <col
          [class]="column.className ?? ''"
          [style.width]="
                column.kind === 'identity'
                  ? 'var(--app-table-identity-width, ' + column.width + ')'
                  : column.width
              "
        />
        }
      </colgroup>
    </ng-template>
    <ng-template #header>
      <tr>
        <th scope="col" class="app-col-identity" pSortableColumn="NAME">
          {{ text().name }} <p-sort-icon field="NAME" />
        </th>
        @if (canWrite()) {
        <th scope="col" class="app-col-actions" pFrozenColumn alignFrozen="right">
          <span class="app-visually-hidden">{{ shared().pageHeader.actions }}</span>
        </th>
        }
      </tr>
    </ng-template>
    <ng-template #body let-tag>
      @let row = record(tag);
      <tr>
        <td class="app-col-identity">
          <div class="app-table-identity-layout">
            <div class="app-cell-identity">
              @if (canWrite()) {
              <button
                type="button"
                class="app-link app-table-identity-wrap"
                [title]="tag.name"
                (click)="panel.run('edit', [row], $event.currentTarget)"
              >
                {{ tag.name }}
              </button>
              } @else {
              <span class="app-table-identity-wrap" [title]="tag.name">{{ tag.name }}</span>
              }
              <span class="app-table-identity-wrap app-mono" [title]="tag.slug"
                >{{ tag.slug }}</span
              >
            </div>
            @if (canWrite()) {
            <div class="app-table-mobile-actions">
              <osnova-row-actions
                [actions]="actions()"
                [record]="row"
                (choose)="panel.run($event.action, [row], $event.origin)"
              />
            </div>
            }
          </div>
        </td>
        @if (canWrite()) {
        <td class="app-col-actions" pFrozenColumn alignFrozen="right">
          <osnova-row-actions
            [actions]="actions()"
            [record]="row"
            (choose)="panel.run($event.action, [row], $event.origin)"
          />
        </td>
        }
      </tr>
    </ng-template>
  </p-table>
</osnova-table-panel>
} @else {
<p-message severity="info">{{ text().noShop }}</p-message>
}
<router-outlet [routerOutletData]="drawerHost" />
