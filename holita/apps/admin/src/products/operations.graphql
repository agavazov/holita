query OperatorProducts(
  $offset: Int!
  $limit: Int!
  $search: String
  $filter: ProductFilter
  $sort: ProductSort
) {
  products(offset: $offset, limit: $limit, search: $search, filter: $filter, sort: $sort) {
    items {
      id
      name
      price
      status
      brandId
      categoryId
      createdAt
      updatedAt
    }
    total
    offset
    limit
  }
}
mutation OperatorCreateProduct($input: ProductInput!) {
  createProduct(input: $input) {
    id
    name
    price
    status
  }
}
mutation OperatorUpdateProduct($id: ID!, $input: ProductInput!) {
  updateProduct(id: $id, input: $input) {
    id
    name
    price
    status
  }
}
query OperatorProduct($id: ID!) {
  product(id: $id) {
    id
    name
    descriptionBg
    descriptionEn
    status
    brandId
    categoryId
    badges {
      ...ProductBadgeChoice
    }
    tags {
      ...ProductTagChoice
    }
    images {
      id
      url
      altText
    }
    variants {
      id
      sku
      price
      quantity
      inventoryTracked
      active
      optionValueIds
    }
  }
}

fragment ProductBadgeChoice on ProductBadge {
  id
  name
  active
}

fragment ProductTagChoice on ProductTag {
  id
  name
}

query OperatorProductBadgeChoices {
  productBadgeChoices {
    ...ProductBadgeChoice
  }
}

query OperatorProductTags($search: String) {
  productTags(search: $search) {
    ...ProductTagChoice
  }
}

mutation OperatorCreateProductTag($name: String!) {
  createProductTag(name: $name) {
    ...ProductTagChoice
  }
}

query OperatorProductOptions {
  productOptions {
    id
    name
    values {
      id
      label
    }
  }
}

query OperatorProductCharacteristics($productId: ID) {
  productCharacteristics(productId: $productId) {
    groups {
      id
      name
      characteristics {
        id
        name
      }
    }
    values {
      characteristicId
      value
    }
  }
}
