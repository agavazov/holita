fragment OperatorOrderSummary on OrderSummary {
  id
  number
  placedAt
  status
  paymentStatus
  contactName
  total
  currency
}

query OperatorOrderNotifications($offset: Int!, $limit: Int!) {
  orderNotifications(offset: $offset, limit: $limit) {
    items {
      orderId
      orderNumber
      placedAt
      readAt
    }
    total
    unreadCount
  }
}

mutation OperatorMarkOrderNotificationRead($orderId: ID!) {
  markOrderNotificationRead(orderId: $orderId)
}

mutation OperatorMarkAllOrderNotificationsRead {
  markAllOrderNotificationsRead
}

query OperatorOrderReturns($offset: Int!, $limit: Int!) {
  orderReturns(offset: $offset, limit: $limit) {
    items {
      id
      orderNumber
      reason
      status
      requestedAt
    }
    total
  }
}

fragment OperatorReturnCase on OrderReturnCase {
  id
  orderId
  orderNumber
  reason
  status
  requestedAt
  fullOrder
  canRecordRefund
  canCompleteWithoutRefund
  completion {
    completedAt
    stockRestored
  }
  refund {
    id
    amount
    currency
    reason
    stockRestored
    createdAt
  }
  lines {
    orderLineId
    sku
    label
    quantity
  }
  decisions {
    outcome
    decidedAt
  }
}

query OperatorOrderReturn($id: ID!) {
  orderReturn(id: $id) {
    ...OperatorReturnCase
  }
}

mutation OperatorDecideOrderReturn($id: ID!, $outcome: OrderReturnOutcome!) {
  decideOrderReturn(id: $id, outcome: $outcome) {
    ...OperatorReturnCase
  }
}

mutation OperatorRecordOrderReturnRefund($id: ID!, $input: RecordOrderRefundInput!) {
  recordOrderReturnRefund(id: $id, input: $input) {
    id
  }
}

mutation OperatorCompleteOrderReturnWithoutRefund($id: ID!) {
  completeOrderReturnWithoutRefund(id: $id) {
    ...OperatorReturnCase
  }
}

fragment OperatorOrderDetail on Order {
  id
  invoiceReviewRevision
  number
  placedAt
  status
  paymentStatus
  paidAt
  canEditManualOrder
  canEditStorefrontOrder
  customerId
  merchantNote
  shopperNote
  paymentMethodId
  shippingMethodId
  contact {
    name
    email
    phone
  }
  shippingAddress {
    countryCode
    city
    postalCode
    line1
    line2
  }
  billingAddress {
    name
    phone
    countryCode
    city
    postalCode
    line1
    line2
  }
  paymentMethodLabel
  paymentInstructions
  shippingMethodLabel
  lines {
    id
    variantId
    sku
    label
    quantity
    unitPrice
    lineTotal
  }
  subtotal
  discountCode
  discountAmount
  shippingFee
  total
  currency
  statusChanges {
    fromStatus
    toStatus
    occurredAt
  }
  returnCompletions {
    returnCaseId
    completedAt
    stockRestored
  }
  nextStatuses
  canMarkPaid
  invoice {
    id
    number
  }
}

query OperatorOrders(
  $offset: Int!
  $limit: Int!
  $search: String
  $customerId: ID
  $filter: OrderListFilter
) {
  orders(
    offset: $offset
    limit: $limit
    search: $search
    customerId: $customerId
    filter: $filter
  ) {
    items {
      ...OperatorOrderSummary
    }
    total
  }
}

query OperatorOrderFilterMethods {
  orderFilterMethods {
    paymentMethodLabels
    shippingMethodLabels
    paymentMethods {
      id
      label
    }
    shippingMethods {
      id
      label
    }
  }
}

query OperatorOrderFilterCustomer($id: ID!) {
  customerContact(id: $id) {
    ...OperatorManualOrderCustomer
  }
}

query OperatorOrder($id: ID!) {
  order(id: $id) {
    ...OperatorOrderDetail
  }
  orderRefundSummary(orderId: $id) {
    status
    refundedAmount
    refundableAmount
    canRecordRefund
    canRestockOnCompletion
    refunds {
      id
      amount
      currency
      reason
      restock
      returnCaseId
      stockRestored
      createdAt
    }
  }
}

mutation OperatorUpdateOrderStatus($id: ID!, $status: OrderStatus!) {
  updateOrderStatus(id: $id, status: $status) {
    id
  }
}

mutation OperatorMarkOrderPaid($id: ID!) {
  markOrderPaid(id: $id) {
    id
    paymentStatus
    paidAt
  }
}

query OperatorInvoices($offset: Int!, $limit: Int!, $search: String, $filter: InvoiceFilter) {
  invoices(offset: $offset, limit: $limit, search: $search, filter: $filter) {
    items {
      id
      orderId
      number
      issueDate
      recipientName
      currency
      total
    }
    total
  }
}

fragment OperatorInvoice on Invoice {
  id
  orderId
  orderNumber
  number
  issueDate
  taxEventDate
  dueDate
  paymentTermDays
  paymentMethod
  paymentStatus
  reason
  note
  issuerName
  issuerCompanyId
  issuerAddress
  issuerVatNumber
  issuerRepresentative
  issuerBankName
  issuerIban
  issuerBic
  recipientName
  recipientAddress
  recipientCompanyId
  recipientVatNumber
  recipientEmail
  recipientPhone
  currency
  subtotal
  discountAmount
  shippingFee
  total
  lines {
    id
    description
    sku
    unit
    quantity
    unitPrice
    lineTotal
  }
}

query OperatorOrderInvoice($orderId: ID!) {
  orderInvoice(orderId: $orderId) {
    ...OperatorInvoice
  }
}

query OperatorInvoiceById($id: ID!) {
  invoice(id: $id) {
    ...OperatorInvoice
  }
}

fragment OperatorInvoiceIssuerFields on InvoiceIssuerSettings {
  issuerName
  issuerCompanyId
  issuerAddress
  issuerVatNumber
  issuerRepresentative
  issuerBankName
  issuerIban
  issuerBic
}

query OperatorInvoiceIssuerSettings {
  invoiceIssuerSettings {
    ...OperatorInvoiceIssuerFields
  }
}

mutation OperatorUpdateInvoiceIssuerSettings($input: InvoiceIssuerSettingsInput!) {
  updateInvoiceIssuerSettings(input: $input) {
    ...OperatorInvoiceIssuerFields
  }
}

mutation OperatorIssueStandaloneInvoice($input: IssueStandaloneInvoiceInput!) {
  issueStandaloneInvoice(input: $input) {
    id
  }
}

mutation OperatorIssueOrderInvoice($orderId: ID!, $input: IssueOrderInvoiceInput!) {
  issueOrderInvoice(orderId: $orderId, input: $input) {
    id
    orderId
    number
  }
}

mutation OperatorRecordOrderRefund($orderId: ID!, $input: RecordOrderRefundInput!) {
  recordOrderRefund(orderId: $orderId, input: $input) {
    id
    amount
    currency
    reason
    restock
    createdAt
  }
}

fragment OperatorManualOrderCustomer on CustomerListItem {
  id
  name
  email
  phone
}

query OperatorManualOrderChoices($customerId: ID!, $includeCustomer: Boolean!) {
  manualOrderMethods {
    currency
    paymentMethods {
      id
      label
    }
    shippingMethods {
      id
      label
      fixedFee
    }
  }
  customerContact(id: $customerId) @include(if: $includeCustomer) {
    ...OperatorManualOrderCustomer
  }
  productOptions {
    active
    values {
      id
      label
    }
  }
}

query OperatorManualOrderCustomers($search: String) {
  customers(limit: 10, search: $search) {
    items {
      ...OperatorManualOrderCustomer
    }
  }
}

query OperatorManualOrderVariants($search: String, $offset: Int!) {
  manualOrderVariants(search: $search, offset: $offset) {
    items {
      id
      productName
      sku
      minimumQuantity
      optionValueIds
    }
    total
    offset
    limit
  }
}

mutation OperatorCreateManualOrder($input: ManualOrderInput!) {
  createManualOrder(input: $input) {
    id
  }
}

mutation OperatorUpdateManualOrder($id: ID!, $input: ManualOrderUpdateInput!) {
  updateManualOrder(id: $id, input: $input) {
    id
  }
}
