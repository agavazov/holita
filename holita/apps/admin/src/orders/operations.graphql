fragment OperatorOrderSummary on OrderSummary {
  id
  number
  placedAt
  status
  paymentStatus
  contactName
  total
  currency
}

fragment OperatorOrderDetail on Order {
  id
  number
  placedAt
  status
  paymentStatus
  paidAt
  canEditManualOrder
  customerId
  merchantNote
  paymentMethodId
  shippingMethodId
  contact {
    name
    email
    phone
  }
  shippingAddress {
    countryCode
    city
    postalCode
    line1
    line2
  }
  paymentMethodLabel
  paymentInstructions
  shippingMethodLabel
  lines {
    id
    variantId
    sku
    label
    quantity
    unitPrice
    lineTotal
  }
  subtotal
  shippingFee
  total
  currency
  statusChanges {
    fromStatus
    toStatus
    occurredAt
  }
  nextStatuses
  canMarkPaid
  invoice {
    id
    number
  }
}

query OperatorOrders($offset: Int!, $limit: Int!, $search: String, $status: OrderStatus) {
  orders(offset: $offset, limit: $limit, search: $search, status: $status) {
    items {
      ...OperatorOrderSummary
    }
    total
  }
}

query OperatorOrder($id: ID!) {
  order(id: $id) {
    ...OperatorOrderDetail
  }
  orderRefundSummary(orderId: $id) {
    status
    refundedAmount
    refundableAmount
    canRecordRefund
    canRestockOnCompletion
    refunds {
      id
      amount
      currency
      reason
      restock
      createdAt
    }
  }
}

mutation OperatorUpdateOrderStatus($id: ID!, $status: OrderStatus!) {
  updateOrderStatus(id: $id, status: $status) {
    id
  }
}

mutation OperatorMarkOrderPaid($id: ID!) {
  markOrderPaid(id: $id) {
    id
    paymentStatus
    paidAt
  }
}

query OperatorOrderInvoice($orderId: ID!) {
  orderInvoice(orderId: $orderId) {
    id
    orderId
    orderNumber
    number
    issueDate
    issuerName
    issuerCompanyId
    issuerAddress
    issuerVatNumber
    recipientName
    recipientAddress
    recipientCompanyId
    recipientVatNumber
    recipientEmail
    recipientPhone
    currency
    subtotal
    shippingFee
    total
    lines {
      id
      description
      sku
      quantity
      unitPrice
      lineTotal
    }
  }
}

mutation OperatorIssueOrderInvoice($orderId: ID!, $input: IssueOrderInvoiceInput!) {
  issueOrderInvoice(orderId: $orderId, input: $input) {
    id
    orderId
    number
  }
}

mutation OperatorRecordOrderRefund($orderId: ID!, $input: RecordOrderRefundInput!) {
  recordOrderRefund(orderId: $orderId, input: $input) {
    id
    amount
    currency
    reason
    restock
    createdAt
  }
}

query OperatorManualOrderChoices {
  manualOrderMethods {
    currency
    paymentMethods {
      id
      label
    }
    shippingMethods {
      id
      label
      fixedFee
    }
  }
  customers {
    id
    name
    email
    orderPhone
  }
  productOptions {
    active
    values {
      id
      label
    }
  }
}

query OperatorManualOrderProducts($search: String) {
  products(search: $search, filter: { statuses: [ACTIVE] }) {
    items {
      name
      variants {
        id
        active
        sku
        optionValueIds
      }
    }
    total
  }
}

mutation OperatorCreateManualOrder($input: ManualOrderInput!) {
  createManualOrder(input: $input) {
    id
  }
}

mutation OperatorUpdateManualOrder($id: ID!, $input: ManualOrderUpdateInput!) {
  updateManualOrder(id: $id, input: $input) {
    id
  }
}
