<osnova-page-header
  [title]="text().orderNotifications"
  [moduleInfo]="text().orderNotificationsInfo"
/>
<osnova-table-panel
  [heading]="text().orderNotificationsInbox"
  [columns]="columns()"
  tableMinWidth="32rem"
  [view]="view()"
  [total]="data()?.total ?? null"
  [busy]="list.isLoading()"
  [errorText]="text().orderNotificationsUnavailable"
  [emptyTitle]="text().orderNotificationsEmpty"
  [page]="pagination()"
  (pageChange)="url.setPage($event)"
  (retry)="list.reload()"
>
  <div panelActions class="app-inline">
    @if (data(); as page) {
    <p-tag
      [value]="text().orderNotificationUnread + ' · ' + formatNumber(page.unreadCount, language())"
    />
    } @if (notifications.canWrite()) {
    <button
      pButton
      type="button"
      severity="secondary"
      [outlined]="true"
      [disabled]="!data()?.unreadCount || notifications.busy()"
      (click)="notifications.markAllRead()"
    >
      {{ text().orderNotificationsMarkAllRead }}
    </button>
    }
  </div>
  <p-table
    class="app-responsive-table app-table-fixed"
    [value]="data()?.items ?? []"
    [rowTrackBy]="trackOrder"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [scrollable]="true"
    [tableStyle]="{ 'min-width': 'var(--app-table-responsive-min-width)' }"
    dataKey="orderId"
  >
    <ng-template #colgroup>
      <colgroup>
        @for (column of columns(); track column.id) {
        <col
          [class]="column.className ?? ''"
          [style.width]="column.kind === 'identity' ? 'var(--app-table-identity-width, ' + column.width + ')' : column.width"
        />
        }
      </colgroup>
    </ng-template>
    <ng-template #header>
      <tr>
        @for (column of columns(); track column.id) {
        <th scope="col" [class]="column.className ?? ''">{{ column.label }}</th>
        }
      </tr>
    </ng-template>
    <ng-template #body let-notification>
      <tr>
        <td class="app-col-identity">
          <div class="app-cell-identity">
            <button
              type="button"
              class="app-link app-table-identity-wrap"
              [disabled]="notifications.busy()"
              [attr.aria-label]="text().openOrder + ' · ' + notification.orderNumber"
              (click)="notifications.open(notification.orderId, !notification.readAt)"
            >
              {{ notification.orderNumber }}
            </button>
          </div>
        </td>
        <td class="app-col-secondary">
          <time
            class="app-cell-date"
            [dateTime]="notification.placedAt"
            [title]="format.utc(notification.placedAt)"
          >
            {{ format.dateTime(notification.placedAt) }}
          </time>
        </td>
        <td>
          <span class="app-cell-status">
            <p-tag
              [severity]="notification.readAt ? 'secondary' : 'info'"
              [value]="notification.readAt ? text().orderNotificationRead : text().orderNotificationUnread"
            />
          </span>
        </td>
      </tr>
    </ng-template>
  </p-table>
</osnova-table-panel>
