supergraph:
  listen: '127.0.0.1:${env.STOREFRONT_ROUTER_PORT:-12031}'
  path: /graphql
health_check:
  listen: '127.0.0.1:${env.STOREFRONT_ROUTER_HEALTH_PORT:-12036}'
  path: /health
limits:
  router:
    http1_max_request_buf_size: 16KiB
# The public listener needs the full operation to apply the sign-in quota.
apq:
  enabled: false
traffic_shaping:
  router:
    global_rate_limit:
      capacity: 100
      interval: 1s
    timeout: 50s
  all:
    timeout: 5s
override_subgraph_url:
  commerce: '${env.STOREFRONT_COMMERCE_URL:-http://127.0.0.1:12013/storefront/graphql}'
include_subgraph_errors:
  all:
    redact_message: true
    allow_extensions_keys: [code, fieldErrors]
headers:
  all:
    request:
      operations:
        - propagate:
            named: authorization
        - propagate:
            named: x-branch-id
        - propagate:
            named: x-cart-token
        - propagate:
            named: accept-language
cors:
  policies:
    - origins: ['${env.STOREFRONT_ORIGIN:-http://127.0.0.1:12020}']
      methods: [GET, POST, OPTIONS]
      allow_headers: [authorization, content-type, x-branch-id, x-cart-token, accept-language]
