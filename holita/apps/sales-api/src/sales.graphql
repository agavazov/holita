type Query {
  salesWorkspaceAccess: SalesWorkspaceViewer!
  appointmentServices(offset: Int! = 0, limit: Int! = 20, search: String): AppointmentServicePage!
  appointmentService(id: ID!): AppointmentService
  salesOffers(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    leadId: ID
    status: SalesOfferStatus
    expires: SalesOfferExpiry
  ): SalesOfferPage!
  salesOffer(id: ID!): SalesOffer
  leads(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    sort: LeadSort
    stage: LeadStage
    status: LeadStatusFilter = OPEN
    assignment: LeadAssignmentFilter
    assignedAgentUserId: ID
  ): LeadPage!
  lead(id: ID!): Lead
  leadNotes(leadId: ID!): [LeadNoteActivity!]!
  leadNote(leadId: ID!, id: ID!): LeadNote
  leadTasks(leadId: ID!): [LeadTask!]!
  leadTask(leadId: ID!, id: ID!): LeadTask
  salesTaskQueue(
    scope: SalesTaskQueueScope! = MINE
    bucket: SalesTaskBucket
    offset: Int! = 0
    limit: Int! = 20
  ): [SalesTaskQueueGroup!]!
  salesAgents(search: String, ids: [ID!]): [SalesAgent!]!
  leadAssignmentAgents: [SalesAgent!]!
  leadContacts(leadId: ID!): [LeadContact!]!
  leadContact(leadId: ID!, id: ID!): LeadContact
  salesContacts(
    offset: Int! = 0
    limit: Int! = 20
    search: String
    sort: LeadContactSort
  ): LeadContactPage!
}

type Mutation {
  createAppointmentService(input: AppointmentServiceInput!): AppointmentService!
  updateAppointmentService(id: ID!, input: AppointmentServiceInput!): AppointmentService!
  deactivateAppointmentService(id: ID!): AppointmentService!
  createSalesOffer(leadId: ID, input: SalesOfferInput!): SalesOffer!
  updateSalesOffer(id: ID!, input: SalesOfferInput!): SalesOffer!
  transitionSalesOffer(id: ID!, action: SalesOfferAction!): SalesOffer!
  createLead(input: LeadInput!): Lead!
  updateLead(id: ID!, input: LeadInput!): Lead!
  updateLeadStage(id: ID!, stage: LeadStage!): Lead!
  updateLeadAssignment(id: ID!, assignedAgentUserId: ID): Lead!
  createLeadNote(leadId: ID!, input: LeadNoteInput!): LeadNote!
  updateLeadNote(leadId: ID!, id: ID!, input: LeadNoteInput!): LeadNote!
  deleteLeadNote(leadId: ID!, id: ID!): Boolean!
  createLeadTask(leadId: ID!, input: LeadTaskInput!): LeadTask!
  updateLeadTask(leadId: ID!, id: ID!, input: LeadTaskInput!): LeadTask!
  updateLeadTaskStatus(leadId: ID!, id: ID!, status: LeadTaskStatus!): LeadTask!
  createLeadContact(leadId: ID!, input: LeadContactInput!): LeadContact!
  updateLeadContact(leadId: ID!, id: ID!, input: LeadContactInput!): LeadContact!
  deleteLeadContact(leadId: ID!, id: ID!): Boolean!
}

enum AppointmentServiceColor {
  C1
  C2
  C3
  C4
  C5
  C6
  C7
  C8
}

type AppointmentService {
  id: ID!
  name: String!
  description: String
  active: Boolean!
  color: AppointmentServiceColor!
  durationMinutes: Int!
  bufferMinutes: Int!
  """
  ISO weekdays, where Monday is 1 and Sunday is 7.
  """
  weekdays: [Int!]!
  """
  Local HH:mm in Europe/Sofia.
  """
  startTime: String!
  """
  Local HH:mm in Europe/Sofia.
  """
  endTime: String!
  createdAt: String!
  updatedAt: String!
}

type AppointmentServicePage {
  items: [AppointmentService!]!
  total: Int!
  offset: Int!
  limit: Int!
}

input AppointmentServiceInput {
  name: String!
  description: String
  """
  Defaults to true on creation. Omit or pass null to preserve the current status on update.
  """
  active: Boolean
  color: AppointmentServiceColor!
  durationMinutes: Int!
  bufferMinutes: Int!
  """
  ISO weekdays, where Monday is 1 and Sunday is 7.
  """
  weekdays: [Int!]!
  """
  Local HH:mm in Europe/Sofia.
  """
  startTime: String!
  """
  Local HH:mm in Europe/Sofia.
  """
  endTime: String!
}

type SalesWorkspaceViewer {
  tenantId: ID!
  userId: ID!
}

type Lead {
  id: ID!
  displayName: String
  websiteUrl: String
  sourceName: String
  stage: LeadStage!
  stageChangedAt: String!
  wonAt: String
  createdByUserId: ID!
  assignedAgentUserId: ID
  nextTask: LeadTask
  createdAt: String!
  updatedAt: String!
}

type SalesAgent {
  id: ID!
  name: String!
  active: Boolean!
  eligible: Boolean!
}

type LeadNote {
  id: ID!
  leadId: ID!
  occurredAt: String!
  text: String!
  authorUserId: ID!
  createdAt: String!
  updatedAt: String!
}

type LeadNoteActivity {
  note: LeadNote!
  authorName: String
}

input LeadNoteInput {
  """
  Occurrence as an ISO-8601 instant with a time zone offset.
  """
  occurredAt: String!
  text: String!
}

type LeadTask {
  id: ID!
  leadId: ID!
  scheduledAt: String!
  type: LeadTaskType!
  status: LeadTaskStatus!
  note: String
  assignedAgentUserId: ID
  createdAt: String!
  updatedAt: String!
}

enum SalesTaskQueueScope {
  MINE
  TEAM
}

enum SalesTaskBucket {
  OVERDUE
  TODAY
  UPCOMING
  NO_FOLLOW_UP
}

type SalesTaskQueueGroup {
  bucket: SalesTaskBucket!
  total: Int!
  items: [SalesTaskQueueItem!]!
}

type SalesTaskQueueItem {
  lead: SalesTaskQueueLead!
  task: LeadTask
}

type SalesTaskQueueLead {
  id: ID!
  displayName: String
  websiteUrl: String
  assignedAgentUserId: ID
}

input LeadTaskInput {
  """
  Schedule as an ISO-8601 instant with a time zone offset.
  """
  scheduledAt: String!
  type: LeadTaskType!
  note: String
}

enum LeadTaskType {
  OUTREACH
  PREPARE_DEMO_SITE
  PREPARE_SEND_OFFER
  DEMO
  RESEARCH
}

enum LeadTaskStatus {
  PENDING
  IN_PROGRESS
  COMPLETED
  CANCELLED
}

type LeadPage {
  items: [Lead!]!
  total: Int!
  offset: Int!
  limit: Int!
}

enum LeadStage {
  NEW
  APPROVED_FOR_CALL
  CALLED
  INTERESTED
  TRY_LATER
  NOT_INTERESTED
  WON
  LOST
}

enum LeadStatusFilter {
  OPEN
  CLOSED
  ALL
}

enum LeadAssignmentFilter {
  MINE
  UNASSIGNED
}

input LeadInput {
  displayName: String
  websiteUrl: String
  sourceName: String
}

enum LeadSortField {
  CREATED_AT
  DISPLAY_NAME
}

enum LeadSortDirection {
  ASC
  DESC
}

input LeadSort {
  field: LeadSortField! = CREATED_AT
  direction: LeadSortDirection! = DESC
}

type LeadContact {
  id: ID!
  leadId: ID!
  name: String
  phone: String
  email: String
  role: LeadContactRole!
  isPrimary: Boolean!
  notes: String
  createdAt: String!
  updatedAt: String!
}

input LeadContactInput {
  name: String
  phone: String
  email: String
  role: LeadContactRole! = UNKNOWN
  isPrimary: Boolean! = false
  notes: String
}

enum LeadContactRole {
  OWNER
  MANAGER
  EMPLOYEE
  TECHNICAL
  UNKNOWN
}

type LeadContactPage {
  items: [SalesContact!]!
  total: Int!
  offset: Int!
  limit: Int!
}

type SalesContact {
  contact: LeadContact!
  lead: LeadContactParent!
}

type LeadContactParent {
  id: ID!
  displayName: String
  websiteUrl: String
}

enum LeadContactSortField {
  NAME
  UPDATED_AT
}

enum LeadContactSortDirection {
  ASC
  DESC
}

input LeadContactSort {
  field: LeadContactSortField! = NAME
  direction: LeadContactSortDirection! = ASC
}

type SalesOfferPage {
  items: [SalesOffer!]!
  total: Int!
  offset: Int!
  limit: Int!
}

type SalesOffer {
  id: ID!
  tenantId: ID!
  leadId: ID
  authorUserId: ID!
  status: SalesOfferStatus!
  preparedAt: String
  manuallySentAt: String
  recipientName: String
  recipientEmail: String
  replyEmail: String
  replyPhone: String
  currentSiteUrl: String
  proposedSiteUrl: String
  exampleDomain: String
  """
  Calendar date in YYYY-MM-DD format.
  """
  validUntil: String
  productCount: Int
  categoryCount: Int
  languages: String
  currentPlatform: String
  message: String
  includedScope: String
  recommended: SalesQuoteLine
  alternative: SalesQuoteLine
  createdAt: String!
  updatedAt: String!
}

enum SalesOfferStatus {
  DRAFT
  PREPARED
  MANUALLY_SENT
}

enum SalesOfferAction {
  PREPARE
  MARK_MANUALLY_SENT
  CLEAR_MANUALLY_SENT
}

enum SalesOfferExpiry {
  """
  Manually sent offers valid from today through seven days ahead, inclusive, in Europe/Sofia.
  """
  WITHIN_7_DAYS
}

type SalesQuoteLine {
  planName: String!
  """
  Exact decimal amount in EUR per month before VAT.
  """
  monthlyPrice: String!
}

input SalesQuoteLineInput {
  planName: String!
  """
  Nonnegative EUR amount with up to two decimal places.
  """
  monthlyPrice: String!
}

input SalesOfferInput {
  recipientName: String
  recipientEmail: String
  replyEmail: String
  replyPhone: String
  currentSiteUrl: String
  proposedSiteUrl: String
  exampleDomain: String
  validUntil: String
  productCount: Int
  categoryCount: Int
  languages: String
  currentPlatform: String
  message: String
  includedScope: String
  recommended: SalesQuoteLineInput
  alternative: SalesQuoteLineInput
}
