query PublicShop {
  shop {
    id
    name
  }
}
fragment CatalogueBrandFields on CatalogueBrand {
  id
  name
  slug
  logoUrl
}
fragment CatalogueCategoryFields on CatalogueCategory {
  id
  name
  slug
  parentId
}
fragment CatalogueBadgeFields on CatalogueBadge {
  id
  name
  color
}
fragment CatalogueBrowsePage on CataloguePage {
  items {
    id
    name
    price
    available
    coverImage {
      url
      altText
    }
    brand {
      ...CatalogueBrandFields
    }
    badges {
      ...CatalogueBadgeFields
    }
  }
  listing {
    id
    name
    categoryPath {
      ...CatalogueCategoryFields
    }
    subcategories {
      ...CatalogueCategoryFields
    }
  }
  facets {
    brands {
      ...CatalogueBrandFields
    }
    options {
      id
      name
      values {
        id
        label
      }
    }
  }
  total
  offset
  limit
}
query Catalogue($offset: Int!, $limit: Int!, $filter: CatalogueBrowseFilter, $sort: CatalogueSort) {
  catalogue(offset: $offset, limit: $limit, filter: $filter, sort: $sort) {
    ...CatalogueBrowsePage
  }
}
query CatalogueCategoryProducts(
  $slug: String!
  $offset: Int!
  $limit: Int!
  $filter: CatalogueBrowseFilter
  $sort: CatalogueSort
) {
  catalogueCategoryProducts(
    slug: $slug
    offset: $offset
    limit: $limit
    filter: $filter
    sort: $sort
  ) {
    ...CatalogueBrowsePage
  }
}
query CatalogueBrandProducts(
  $slug: String!
  $offset: Int!
  $limit: Int!
  $filter: CatalogueBrowseFilter
  $sort: CatalogueSort
) {
  catalogueBrandProducts(
    slug: $slug
    offset: $offset
    limit: $limit
    filter: $filter
    sort: $sort
  ) {
    ...CatalogueBrowsePage
  }
}
query CatalogueCollectionProducts(
  $slug: String!
  $offset: Int!
  $limit: Int!
  $filter: CatalogueBrowseFilter
  $sort: CatalogueSort
) {
  catalogueCollectionProducts(
    slug: $slug
    offset: $offset
    limit: $limit
    filter: $filter
    sort: $sort
  ) {
    ...CatalogueBrowsePage
  }
}
query CatalogueTagProducts(
  $slug: String!
  $offset: Int!
  $limit: Int!
  $filter: CatalogueBrowseFilter
  $sort: CatalogueSort
) {
  catalogueTagProducts(slug: $slug, offset: $offset, limit: $limit, filter: $filter, sort: $sort) {
    ...CatalogueBrowsePage
  }
}
query CatalogueCategories {
  catalogueCategories {
    ...CatalogueCategoryFields
  }
}
query CatalogueBrandIndex($offset: Int!, $limit: Int!) {
  catalogueBrandIndex(offset: $offset, limit: $limit) {
    items {
      ...CatalogueBrandFields
    }
    total
  }
}
query CatalogueCollections($offset: Int!, $limit: Int!) {
  catalogueCollections(offset: $offset, limit: $limit) {
    items {
      id
      name
      slug
    }
    total
  }
}
query CatalogueTags($offset: Int!, $limit: Int!) {
  catalogueTags(offset: $offset, limit: $limit) {
    items {
      id
      name
      slug
    }
    total
  }
}
query CatalogueProduct($id: ID!) {
  catalogueProduct(id: $id) {
    id
    name
    descriptionBg
    descriptionEn
    variantSelection {
      options {
        id
        name
        values {
          id
          label
        }
      }
      variants {
        id
        sku
        price
        available
        optionValueIds
      }
    }
    images {
      url
      altText
    }
    brand {
      ...CatalogueBrandFields
    }
    categoryPath {
      ...CatalogueCategoryFields
    }
    badges {
      ...CatalogueBadgeFields
    }
    tags {
      id
      name
      slug
    }
  }
  catalogueProductSpecifications(productId: $id) {
    name
    values {
      name
      value
    }
  }
}
query ShopperMe {
  shopperMe {
    id
    name
    email
  }
}
mutation RegisterShopper($name: String!, $email: String!, $password: String!) {
  registerShopper(name: $name, email: $email, password: $password) {
    token
    expiresAt
    shopper {
      id
      name
      email
    }
    cartMergeIssues {
      name
      quantity
      reason
    }
  }
}
mutation SignInShopper($email: String!, $password: String!) {
  signInShopper(email: $email, password: $password) {
    token
    expiresAt
    shopper {
      id
      name
      email
    }
    cartMergeIssues {
      name
      quantity
      reason
    }
  }
}
mutation SignOutShopper {
  signOutShopper
}
fragment PublicCartLineFields on CartLine {
  id
  variantId
  productId
  name
  optionLabels
  quantity
  unitPrice
  lineTotal
  issue
  coverImage {
    url
  }
}
fragment PublicCartFields on Cart {
  itemCount
  subtotal
  lines {
    ...PublicCartLineFields
  }
}
query PublicCart {
  cart {
    ...PublicCartFields
  }
}
mutation AddCartLine($variantId: ID!, $quantity: Int!) {
  addCartLine(variantId: $variantId, quantity: $quantity) {
    guestCartToken
    cart {
      ...PublicCartFields
    }
  }
}
mutation UpdateCartLine($lineId: ID!, $quantity: Int!) {
  updateCartLine(lineId: $lineId, quantity: $quantity) {
    ...PublicCartFields
  }
}
mutation RemoveCartLine($lineId: ID!) {
  removeCartLine(lineId: $lineId) {
    ...PublicCartFields
  }
}
fragment CheckoutPaymentFields on CheckoutPaymentMethod {
  id
  label
  instructions
}
fragment CheckoutShippingFields on CheckoutShippingMethod {
  id
  label
  fixedFee
}
query Checkout {
  checkout {
    cart {
      ...PublicCartFields
    }
    currency
    paymentMethods {
      ...CheckoutPaymentFields
    }
    shippingMethods {
      ...CheckoutShippingFields
    }
  }
}
mutation QuoteCheckout($input: CheckoutQuoteInput!) {
  quoteCheckout(input: $input) {
    cartId
    quoteRevision
    lines {
      ...PublicCartLineFields
    }
    paymentMethod {
      ...CheckoutPaymentFields
    }
    shippingMethod {
      ...CheckoutShippingFields
    }
    currency
    subtotal
    shippingFee
    total
  }
}
fragment OrderConfirmationFields on OrderConfirmation {
  id
  number
  placedAt
  status
  paymentStatus
  contact {
    name
    email
    phone
  }
  shippingAddress {
    countryCode
    city
    postalCode
    line1
    line2
  }
  paymentMethodLabel
  paymentInstructions
  shippingMethodLabel
  lines {
    sku
    label
    quantity
    unitPrice
    lineTotal
  }
  currency
  subtotal
  shippingFee
  total
}
mutation PlaceOrder($input: PlaceOrderInput!) {
  placeOrder(input: $input) {
    ...OrderConfirmationFields
  }
}
query OrderConfirmation($orderId: ID!) {
  orderConfirmation(orderId: $orderId) {
    ...OrderConfirmationFields
  }
}
query ShopperOrders($offset: Int!, $limit: Int!) {
  shopperOrders(offset: $offset, limit: $limit) {
    items {
      id
      number
      placedAt
      status
      paymentStatus
      shippingMethodLabel
      paymentMethodLabel
      total
      currency
    }
    total
    offset
    limit
  }
}
query ShopperOrder($id: ID!) {
  shopperOrder(id: $id) {
    ...OrderConfirmationFields
  }
}
