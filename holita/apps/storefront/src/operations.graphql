query PublicShop {
  shop {
    id
    name
  }
}
fragment CatalogueBrandFields on CatalogueBrand {
  id
  name
  slug
  logoUrl
}
fragment CatalogueCategoryFields on CatalogueCategory {
  id
  name
  slug
  parentId
}
fragment CatalogueBrowsePage on CataloguePage {
  items {
    id
    name
    price
    available
    coverImage {
      url
      altText
    }
    brand {
      ...CatalogueBrandFields
    }
    badges {
      id
      name
      color
    }
  }
  listing {
    id
    name
    categoryPath {
      ...CatalogueCategoryFields
    }
    subcategories {
      ...CatalogueCategoryFields
    }
  }
  facets {
    brands {
      ...CatalogueBrandFields
    }
    options {
      id
      name
      values {
        id
        label
      }
    }
  }
  total
  offset
  limit
}
query Catalogue($offset: Int!, $limit: Int!, $filter: CatalogueBrowseFilter, $sort: CatalogueSort) {
  catalogue(offset: $offset, limit: $limit, filter: $filter, sort: $sort) {
    ...CatalogueBrowsePage
  }
}
query CatalogueCategoryProducts(
  $slug: String!
  $offset: Int!
  $limit: Int!
  $filter: CatalogueBrowseFilter
  $sort: CatalogueSort
) {
  catalogueCategoryProducts(
    slug: $slug
    offset: $offset
    limit: $limit
    filter: $filter
    sort: $sort
  ) {
    ...CatalogueBrowsePage
  }
}
query CatalogueBrandProducts(
  $slug: String!
  $offset: Int!
  $limit: Int!
  $filter: CatalogueBrowseFilter
  $sort: CatalogueSort
) {
  catalogueBrandProducts(
    slug: $slug
    offset: $offset
    limit: $limit
    filter: $filter
    sort: $sort
  ) {
    ...CatalogueBrowsePage
  }
}
query CatalogueCollectionProducts(
  $slug: String!
  $offset: Int!
  $limit: Int!
  $filter: CatalogueBrowseFilter
  $sort: CatalogueSort
) {
  catalogueCollectionProducts(
    slug: $slug
    offset: $offset
    limit: $limit
    filter: $filter
    sort: $sort
  ) {
    ...CatalogueBrowsePage
  }
}
query CatalogueTagProducts(
  $slug: String!
  $offset: Int!
  $limit: Int!
  $filter: CatalogueBrowseFilter
  $sort: CatalogueSort
) {
  catalogueTagProducts(slug: $slug, offset: $offset, limit: $limit, filter: $filter, sort: $sort) {
    ...CatalogueBrowsePage
  }
}
query CatalogueCategories {
  catalogueCategories {
    ...CatalogueCategoryFields
  }
}
query CatalogueBrandIndex($offset: Int!, $limit: Int!) {
  catalogueBrandIndex(offset: $offset, limit: $limit) {
    items {
      ...CatalogueBrandFields
    }
    total
  }
}
query CatalogueCollections($offset: Int!, $limit: Int!) {
  catalogueCollections(offset: $offset, limit: $limit) {
    items {
      id
      name
      slug
    }
    total
  }
}
query CatalogueTags($offset: Int!, $limit: Int!) {
  catalogueTags(offset: $offset, limit: $limit) {
    items {
      id
      name
      slug
    }
    total
  }
}
query CatalogueProduct($id: ID!) {
  catalogueProduct(id: $id) {
    id
    name
    descriptionBg
    descriptionEn
    variantSelection {
      options {
        id
        name
        values {
          id
          label
        }
      }
      variants {
        id
        sku
        price
        available
        optionValueIds
      }
    }
    images {
      url
      altText
    }
    brand {
      ...CatalogueBrandFields
    }
    categoryPath {
      ...CatalogueCategoryFields
    }
    tags {
      id
      name
      slug
    }
  }
  catalogueProductSpecifications(productId: $id) {
    name
    values {
      name
      value
    }
  }
}
query ShopperMe {
  shopperMe {
    id
    name
    email
  }
}
mutation RegisterShopper($name: String!, $email: String!, $password: String!) {
  registerShopper(name: $name, email: $email, password: $password) {
    token
    expiresAt
    shopper {
      id
      name
      email
    }
  }
}
mutation SignInShopper($email: String!, $password: String!) {
  signInShopper(email: $email, password: $password) {
    token
    expiresAt
    shopper {
      id
      name
      email
    }
  }
}
mutation SignOutShopper {
  signOutShopper
}
